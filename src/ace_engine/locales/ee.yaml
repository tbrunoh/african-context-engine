  commands.TEXTS.help: "ACE naa aɖaŋuɖoɖo siwo wodzro le wò nuto me. Bia le wò gbe me. Sedede: AMEBLEBLE + gbedasi be woalé ŋku ɖe eŋu, AƉAŊU + wò aɖaŋu be nàma sidzedze, DZƆTSOƑE, BUBUWO, GBE + kɔd (abe GBE EN ene), TUTU be nàtutu wò nyatakakawo."
  commands.TEXTS.help_short: "Bia ACE le wò gbe me. AMEBLEBLE + gbedasi lé ŋku ɖe eŋu. TUTU tutua wò nyatakakawo."
