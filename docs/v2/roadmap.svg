  <text x="70.0" y="190" class="sans" font-size="19" fill="#253239" font-weight="700">Foundations</text>
  <text x="70.0" y="212" class="sans" font-size="13" fill="#56636A">Dec 2026 to Feb 2027</text>
  <circle cx="74.0" cy="239.5" r="3" fill="#006B69"/>
  <text x="86.0" y="244" class="sans" font-size="13.5" fill="#3E4B52">Connector framework</text>
  <circle cx="74.0" cy="263.5" r="3" fill="#006B69"/>
