  translations:
    sw:
      claim: Baada ya kujifungua, tafuta msaada mara moja kwa kutokwa na damu nyingi au mabonge makubwa, miguu myekundu
        au iliyovimba, maumivu ya kichwa yasiyoisha, homa kali au kutapika, maumivu ya kifua, kupumua kwa shida, au degedege.
      short: 'Baada ya kujifungua, pata msaada SASA kwa: damu nyingi, miguu kuvimba, kichwa kisichoisha, homa kali, kifua,
        degedege.'
    fr:
      claim: Après l'accouchement, demandez de l'aide immédiatement en cas de saignement abondant ou de gros caillots,
        de jambes rouges ou gonflées, de maux de tête qui ne passent pas, de forte fièvre ou de vomissements, de douleur
        à la poitrine, de difficulté à respirer ou de convulsions.
      short: 'Après l''accouchement, aide IMMÉDIATE si : saignement abondant, jambes gonflées, maux de tête persistants,
        forte fièvre, douleur thoracique, convulsions.'
    pt:
      claim: 'Depois do parto, procure ajuda imediatamente se houver sangramento forte ou coágulos grandes, pernas vermelhas ou inchadas, dor de cabeça que não passa, febre alta ou vómitos, dor no peito, dificuldade em respirar, ou convulsões.'
      short: 'Depois do parto, peça ajuda JÁ se houver: sangramento forte ou coágulos, pernas inchadas, dor de cabeça persistente, febre alta, dor no peito, convulsões.'
      reviewed: false
    ar:
