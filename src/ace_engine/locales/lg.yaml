  commands.TEXTS.help: "ACE ewa amagezi ag'omu kitundu agakeberebwa. Buuza mu lulimi lwo. Ebiragiro: OBUFERE + obubaka okukebera obubaka, AMAGEZI + amagezi go okugabana okumanya, ENSIBUKO, EBIRALA, OLULIMI + koodi (okugeza OLULIMI EN), SANGULA okusangula ebikukwatako."
  commands.TEXTS.help_short: "Buuza ACE mu lulimi lwo. OBUFERE + obubaka bubukebera. SANGULA esangula ebikukwatako."
  commands.TEXTS.forgotten: "Kikoleddwa. ACE esangudde byonna bye yali erina ku namba eno."
  commands.TEXTS.stopped: "Tojja kuddamu kufuna bubaka okuva mu ACE okuggyako ng'owandiise nate. Weereza SANGULA okusangula ebikukwatako."
  commands.TEXTS.language: "Ddamu OLULIMI ne koodi:"
  commands.TEXTS.tip_thanks: "Webale. Amagezi go gaterekeddwa omukugu agakebere. Tegajja kugabanwa nga tegannakeberebwa."
  commands.TEXTS.tip_usage: "Weereza AMAGEZI n'amagezi go, okugeza: AMAGEZI ebikoola bya neem biyamba ku nsowera z'kasooli e Masaka."
  commands.TEXTS.scam_usage: "Weereza OBUFERE n'obubaka bw'otakkiriza, ACE ejja kububekera."
  commands.TEXTS.no_sources: "Tewali kuddamu kwa kubiri kulaga gye kwava. Sooka obuuze ekibuuzo."
  commands.TEXTS.no_more: "Ebyo bye byonna ACE by'erina ku nsonga eno kaakano. Buuza ekibuuzo ekirala oba weereza OBUYAMBI."
  commands.TEXTS.clarify: "ACE tennaba kufuna magezi gakeberebwa ku ekyo. ACE esobola okukuyamba ku: {topics}. Weereza AMAGEZI okwongerako okumanya."
  commands.TEXTS.unread: "ACE tennaba kusoma lulimi luno. Bambi wandiika mu lumu ku nnimi zino: {languages}."

