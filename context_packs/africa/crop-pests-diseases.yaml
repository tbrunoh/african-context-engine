    ha:
      claim: 'Tsutsotsin ganyen tumatir suna haƙa faffaɗan ramuka masu sheƙi kamar azurfa a cikin ganyen tumatir, waɗanda suke yin launin ruwan ƙasa su bushe. Suna kuma huda kara da ''ya''yan itace, suna barin ramukan fita a cikin ''ya''yan. Tsutsotsin kore ne zuwa ruwan hoda, tsawonsu har zuwa mm 9, da ratsin baƙi a bayan kai. Gauta, barkono da dankali ma ana iya kai musu hari.'
      short: 'Alamun tsutsar ganyen tumatir: ramuka masu sheƙi a ganye da ke yin ruwan ƙasa, ramuka a ''ya''yan, ƙananan tsutsotsi kore zuwa ruwan hoda da ratsin baƙi.'
