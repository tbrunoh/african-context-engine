# Four crop problems that threaten food across the covered countries, for the V2 pest and disease check.
# Maize lethal necrosis (CIMMYT), cassava mosaic disease (CABI Plantwise), banana Xanthomonas wilt
# (Bioversity International and IITA) and the tomato leaf miner (CABI Plantwise and the World Vegetable Center).
# Pesticide products and rates are deliberately excluded. Next step: review by national extension services
# and plant protection organisations, and review of the Swahili and French text by fluent speakers.
spec_version: '1.0'
id: africa-crop-pests-diseases
title: Crop pests and diseases
description: How farmers can recognise four serious crop problems and what to do first, with a referral to an extension
  officer before any spraying. Fall armyworm has its own pack.
