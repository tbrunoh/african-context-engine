# Kenya's rainfall seasons, from the Kenya Meteorological Department.
spec_version: "1.0"
id: ke-rainfall-seasons
title: Kenya rainfall seasons
description: >-
  The two main rainy seasons and where to get the official seasonal forecast.
  County level onset dates are a good first issue for contributors.
