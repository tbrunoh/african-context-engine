- id: bxw-action
  claim: There is no cure for banana Xanthomonas wilt. As soon as a plant shows signs, cut that plant at soil level and
    leave the healthy plants in the mat. Clean the tool after each cut by holding it in a fire for up to a minute or
    washing it with soap and water or chlorine. Once the last hand has formed, remove the male bud with a forked stick,
    and check plants often.
  short: 'Banana wilt: no cure. Cut each sick plant at soil level, clean the tool in fire or with soap after each cut, remove
    the male bud with a forked stick.'
