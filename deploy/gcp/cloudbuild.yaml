# Build, test and release ACE. setup.sh runs it once with _DEPLOY=no to build the first image. For each later
# release:
#   gcloud builds submit --region africa-south1 --config deploy/gcp/cloudbuild.yaml \
#     --substitutions _IMAGE=africa-south1-docker.pkg.dev/PROJECT/ace/ace:TAG,_COMMIT=$(git rev-parse HEAD),_DOMAIN=ace.example.org .
# The new revision of ace-web first takes no traffic; the smoke suite reaches it through the load balancer with the
# candidate header, and only then does traffic move. ace-mcp and the refresh job follow.
substitutions:
  _IMAGE: ""
  _COMMIT: ""
  _REGION: africa-south1
  _DOMAIN: ace.korext.com
  _DEPLOY: "yes"
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
steps:
- id: test
  name: python:3.12-slim
  entrypoint: sh
  args:
  - -c
  - |
    pip install -q -e ".[dev,mcp]" httpx && ruff check src tests && python -m pytest -q && python -m benchmark.run --quick
- id: build
  name: gcr.io/cloud-builders/docker
  args: ["build", "--build-arg", "ACE_COMMIT=${_COMMIT}", "-t", "${_IMAGE}", "."]
- id: push
  name: gcr.io/cloud-builders/docker
  args: ["push", "${_IMAGE}"]
- id: release
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  secretEnv: ["CANDIDATE"]
  args:
  - -c
  - |
    set -euo pipefail
    if [ "${_DEPLOY}" != "yes" ]; then echo "build only"; exit 0; fi
    gcloud run services update ace-web --region ${_REGION} --image ${_IMAGE} \
      --update-env-vars ACE_COMMIT=${_COMMIT} --tag candidate --no-traffic
    apt-get -qq update >/dev/null && apt-get -qq install -y python3 >/dev/null
    python3 deploy/gcp/smoke.py https://${_DOMAIN} --header "x-ace-candidate: $$CANDIDATE"
    gcloud run services update-traffic ace-web --region ${_REGION} --to-latest
    gcloud run services update ace-mcp --region ${_REGION} --image ${_IMAGE} --update-env-vars ACE_COMMIT=${_COMMIT}
    gcloud run jobs update ace-refresh --region ${_REGION} --image ${_IMAGE}
    gcloud run services update ace-guard --region ${_REGION} --image ${_IMAGE}
    if gcloud run jobs describe ace-modelcheck --region ${_REGION} >/dev/null 2>&1; then
      gcloud run jobs update ace-modelcheck --region ${_REGION} --image ${_IMAGE}
    fi
    python3 deploy/gcp/smoke.py https://${_DOMAIN}
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ace-candidate-header/versions/latest
    env: CANDIDATE
images: ["${_IMAGE}"]
