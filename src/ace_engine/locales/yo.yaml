  commands.TEXTS.stopped: "O ko ni gba ifiranṣẹ kankan mọ lati ọdọ ACE ayafi ti o ba tun kọwe. Fi PAARẸ ranṣẹ lati pa data rẹ rẹ."
  commands.TEXTS.language: "Dahun pẹlu EDE ati koodu kan:"
  commands.TEXTS.tip_thanks: "O ṣeun. A ti fi imọran rẹ pamọ fun amoye lati ṣayẹwo. A ko ni pin in titi a o fi ṣayẹwo rẹ."
  commands.TEXTS.tip_usage: "Fi IMỌRAN ranṣẹ pẹlu imọran rẹ, fun apẹẹrẹ: IMỌRAN ewe dongoyaro n ṣe iranlọwọ lodi si kokoro agbado ni Ọyọ."
  commands.TEXTS.scam_usage: "Fi JIBITI ranṣẹ pẹlu ifiranṣẹ ti o ṣiyemeji rẹ, ACE yoo si ṣayẹwo rẹ."
  commands.TEXTS.no_sources: "Ko si idahun ti tẹlẹ lati fi orisun rẹ han. Kọkọ beere ibeere kan."
  commands.TEXTS.no_more: "Iyẹn ni gbogbo ohun ti ACE ni lori koko yii fun bayi. Beere ibeere miiran tabi fi IRANLỌWỌ ranṣẹ."
  commands.TEXTS.clarify: "ACE ko tii ni imọran ti a ṣayẹwo lori iyẹn. ACE le ran ọ lọwọ pẹlu: {topics}. Fi IMỌRAN ranṣẹ lati daba imọ."
