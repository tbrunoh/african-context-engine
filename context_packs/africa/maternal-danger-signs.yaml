  translations:
    sw:
      claim: Mama mjamzito anapaswa kwenda kituo cha afya haraka iwezekanavyo akiwa na homa, maumivu ya tumbo, akijisikia
        mgonjwa, au akivimba vidole, uso na miguu.
      short: 'Muone mhudumu wa afya haraka kwa: homa, maumivu ya tumbo, kujisikia mgonjwa, au kuvimba vidole, uso na
        miguu.'
    fr:
      claim: Une femme enceinte doit aller au centre de santé dès que possible si elle a de la fièvre, des douleurs abdominales,
        se sent malade, ou si ses doigts, son visage et ses jambes sont gonflés.
      short: 'Consultez vite un agent de santé si : fièvre, douleurs au ventre, malaise, ou doigts, visage et jambes
        gonflés.'
    pt:
      claim: 'Uma mulher grávida deve ir a um centro de saúde o mais depressa possível se tiver febre, dor de barriga, se sentir doente, ou tiver inchaço dos dedos, da cara e das pernas.'
      short: 'Consulte um profissional de saúde em breve se houver: febre, dor de barriga, mal-estar, ou dedos, cara e pernas inchados.'
      reviewed: false
    ar:
      claim: 'يجب أن تذهب المرأة الحامل إلى مركز صحي في أقرب وقت ممكن إذا أصيبت بالحمى أو ألم البطن أو شعرت بالمرض أو تورمت أصابعها ووجهها وساقاها.'
      short: 'راجعي عاملًا صحيًا قريبًا عند: الحمى، أو ألم البطن، أو الشعور بالمرض، أو تورم الأصابع والوجه والساقين.'
      reviewed: false
    am:
      claim: 'ነፍሰ ጡር ሴት ትኩሳት፣ የሆድ ሕመም፣ የሕመም ስሜት፣ ወይም የጣቶች፣ የፊትና የእግሮች እብጠት ካለባት በተቻለ ፍጥነት ወደ ጤና ጣቢያ መሄድ አለባት።'
      short: 'በቅርቡ የጤና ባለሙያ ያግኙ፡ ትኩሳት፣ የሆድ ሕመም፣ የሕመም ስሜት፣ ወይም ያበጡ ጣቶች፣ ፊትና እግሮች።'
      reviewed: false
    om:
      claim: 'Dubartiin ulfaa ho''a qaamaa, garaa dhukkubbii, dhukkubsachuu yoo itti dhaga''ame, ykn quba, fuulaa fi miila dhiitessuu yoo qabaatte hanga danda''ametti dafee buufata fayyaa deemuu qabdi.'
      short: 'Dafaatii ogeessa fayyaa argaa: ho''a qaamaa, garaa dhukkubbii, dhukkubsachuu, ykn quba, fuula fi miila dhiite.'
      reviewed: false
    so:
      claim: 'Haweeneyda uurka leh waa inay sida ugu dhakhsaha badan u tagto xarun caafimaad haddii ay qabto qandho, calool xanuun, ay dareento jirro, ama ay bararaan farahu, wejigu iyo lugahu.'
      short: 'Dhakhso u tag shaqaale caafimaad haddii ay jiraan: qandho, calool xanuun, jirro, ama faro, weji iyo lugo bararay.'
      reviewed: false
