  translations:
    sw:
      claim: Mbinu ya push-pull hupunguza viwavijeshi vamizi. Panda Desmodium kati ya mistari ya mahindi ili kuwafukuza
        nondo, na majani ya Napier au Brachiaria kuzunguka mpaka wa shamba ili kuwavuta mbali. Desmodium pia hudhibiti
        gugu la Striga, na mimea yote miwili ni lishe nzuri ya mifugo.
      short: 'Push-pull: Desmodium kati ya mistari ya mahindi, Napier au Brachiaria mpakani. Hupunguza viwavijeshi.'
    fr:
      claim: La technique push-pull réduit la chenille légionnaire d'automne. Semez du Desmodium entre les rangs de maïs
        pour repousser les papillons, et de l'herbe à éléphant (Napier) ou du Brachiaria autour du champ pour les attirer
        ailleurs. Le Desmodium combat aussi le Striga, et les deux plantes sont un bon fourrage.
      short: 'Push-pull : Desmodium entre les rangs de maïs, Napier ou Brachiaria en bordure. Réduit la chenille légionnaire.'
    pt:
      claim: 'O sistema push-pull reduz a lagarta-do-funil. Semeie Desmodium entre as linhas de milho para repelir as borboletas, e capim Napier ou Brachiaria à volta do campo para as atrair para longe. O Desmodium também controla a erva Striga, e ambas as plantas são boa forragem.'
      short: 'Push-pull: Desmodium entre as linhas de milho, capim Napier ou Brachiaria à volta. Reduz a lagarta-do-funil.'
      reviewed: false
    ar:
      claim: 'تقنية الدفع والجذب تقلل دودة الحشد الخريفية. ازرع الديسموديوم بين صفوف الذرة لطرد الفراشات، وعشب نابيير أو البراكياريا حول حدود الحقل لجذبها بعيدًا. يكافح الديسموديوم أيضًا عشبة الستريغا، والنباتان علف جيد.'
      short: 'الدفع والجذب: ديسموديوم بين صفوف الذرة، وعشب نابيير أو براكياريا حول الحقل. يقلل دودة الحشد.'
      reviewed: false
    am:
      claim: 'የፑሽ ፑል ዘዴ ፎል አርሚዎርምን ይቀንሳል። የእሳት እራቶቹን ለማባረር ዴስሞዲየምን በበቆሎ መስመሮች መካከል፣ ወደ ውጭ ለመሳብ ደግሞ ናፒየር ወይም ብራኪያሪያ ሣርን በማሳው ዳርቻ ዙሪያ ይትከሉ። ዴስሞዲየም አረም የሆነውን ስትሪጋንም ይቆጣጠራል፣ ሁለቱም ተክሎች ጥሩ መኖ ናቸው።'
      short: 'ፑሽ ፑል፡ ዴስሞዲየም በበቆሎ መስመሮች መካከል፣ ናፒየር ወይም ብራኪያሪያ ሣር በዳርቻው። ተምቹን ይቀንሳል።'
      reviewed: false
    om:
