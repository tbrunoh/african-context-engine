id: africa-maize-fall-armyworm
title: Fall armyworm in maize
description: How smallholder maize farmers can recognise fall armyworm, scout for it and manage it with low cost methods.
  Pesticide advice is deliberately excluded until a licensed reviewer adds it for each country.
