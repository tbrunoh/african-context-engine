    zu:
      claim: 'Isifo se-mosaic somdumbula sibonisa amaqabunga asontekile anamabala aluhlaza naphuzi noma aluhlaza namhlophe. Uma kubi kakhulu, amaqabunga amasha amancane futhi asontekile, futhi isitshalo asikhuli kahle. Amaqabunga aphuzi noma ansundu yonke into akhomba enye inkinga. Izimpukane ezimhlophe (whiteflies) zisabalalisa isifo zisuka kwesinye isitshalo ziye kwesinye.'
