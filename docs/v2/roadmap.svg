  <line x1="70.0" y1="342" x2="290.0" y2="342" stroke="#E8E2D9"/>
  <text x="70.0" y="366" class="sans" font-size="13.5" fill="#253239" font-weight="700">Gate: every number checked</text>
  <text x="70.0" y="386" class="sans" font-size="13" fill="#56636A">within 30 days</text>
