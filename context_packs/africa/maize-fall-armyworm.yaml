  translations:
    sw:
      claim: Tembelea mahindi yako mara kwa mara kuyakagua. Kagua mimea 50 kwa kutembea kwa umbo la W shambani, ukisimama
        sehemu tano na kuangalia katikati ya kilele cha mimea kumi katika kila sehemu.
      short: 'Kagua mara kwa mara: tembea kwa umbo la W, simama sehemu 5, angalia kilele cha mimea 10 kila sehemu.'
