    so:
      claim: 'Si dhakhso ah uga saar oo burburi midhaha yaanyada ee ay ku dhaceen, oo nadiifi dhirta kale ee martigelisa ee ku wareegsan beerta. Dabinnada feroomoonka ayaa qabta balanbaalisyada, alaabooyinka ku salaysan niimka ama Bacillus thuringiensis ayaa caawin kara. Buufinta caadiga ah inta badan way fashilantaa sababtoo ah dirxigu wuxuu wax ku cunaa caleenta gudaheeda, cayayaankuna dhakhso ayuu u adkaystaa sunta, sidaas darteed weydii sarkaalka kordhinta beeraha ka hor intaadan buufin.'
      short: 'Duqsiga caleenta yaanyada: burburi midhaha ay ku dhaceen, isticmaal dabinno feroomoon, niim ama Bt; weydii sarkaalka beeraha ka hor buufinta.'
