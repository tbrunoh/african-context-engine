# Icibemba for Zambia, in the standard spelling. Drafted for ACE 2.3 with lower confidence than most added
# languages: fluent speakers and, for the safety phrases, clinicians must review it first. Zambians often mix
# Bemba with English, and the English safety phrases still apply to those messages.
