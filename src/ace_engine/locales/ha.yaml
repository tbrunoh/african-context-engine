templates:
  safety.OPENERS.self_harm: "Na yi baƙin ciki sosai da kuke jin haka. Kun cancanci tallafi a yanzu. {numbers}"
  safety.OPENERS.maternal: "Wannan na iya zama gaggawar ciki. Ku je cibiyar lafiya mafi kusa yanzu. {numbers}"
  safety.OPENERS.poisoning: "Wannan yana kama da guba. Ku nemi taimakon likita yanzu, ku tafi da kwalbar. {numbers}"
  safety.OPENERS.child_protection: "Yaro na iya kasancewa cikin haɗari. Don Allah ku nemi taimako yanzu. {numbers}"
  safety.OPENERS.gbv: "Na yi baƙin ciki da wannan ke faruwa. Kuna iya samun taimako yanzu. {numbers}"
  safety.OPENERS.health_urgent: "Wannan yana kama da gaggawa. Ku nemi taimakon likita yanzu. {numbers}"
  safety.CALL_WORD: "Ku kira {numbers}"
  safety.OR_WORD: "ko"
  safety.EMERGENCY_WORD: "gaggawa"
  safety.FALLBACK_NUMBERS: "Ku kira lambar gaggawa ta yankinku ko ku je cibiyar lafiya mafi kusa."

  commands.TEXTS.help: "ACE yana ba da shawarwari na gida da aka tabbatar. Ku yi tambaya da harshenku. Umarni: ZAMBA + saƙo don a duba saƙo, SHAWARA + shawararku don raba ilimi, MAJIYA, ƘARI, HARSHE + lamba (misali HARSHE EN), GOGE don share bayananku."
  commands.TEXTS.help_short: "Ku tambayi ACE da harshenku. ZAMBA + saƙo yana duba shi. GOGE yana share bayananku."
  commands.TEXTS.forgotten: "An gama. An share duk abin da ACE ke riƙe game da wannan lambar."
  commands.TEXTS.stopped: "Ba za ku ƙara samun saƙo daga ACE ba sai kun sake rubutawa. Ku aika GOGE don share bayananku."
  commands.TEXTS.language: "Ku amsa da HARSHE da lamba:"
  commands.TEXTS.tip_thanks: "Na gode. An adana shawararku don ƙwararre ya duba. Ba za a raba ta ba sai an tabbatar da ita."
  commands.TEXTS.tip_usage: "Ku aika SHAWARA tare da shawararku, misali: SHAWARA ganyen darbejiya yana taimakawa kan tsutsar masara a Kano."
  commands.TEXTS.scam_usage: "Ku aika ZAMBA tare da saƙon da kuke shakka a kai, ACE zai duba shi."
  commands.TEXTS.no_sources: "Babu amsar da ta gabata da za a nuna majiyoyinta. Ku fara yin tambaya."
  commands.TEXTS.no_more: "Wannan shi ne duk abin da ACE ke da shi kan wannan batu yanzu. Ku yi wata tambaya ko ku aika TAIMAKO."
  commands.TEXTS.clarify: "ACE ba shi da tabbatacciyar shawara kan wannan tukuna. ACE zai iya taimakawa da: {topics}. Ku aika SHAWARA don ba da ilimi."
  commands.TEXTS.unread: "ACE ba ta iya karanta wannan harshe ba tukuna. Don Allah a rubuta da ɗaya daga cikin waɗannan: {languages}."

