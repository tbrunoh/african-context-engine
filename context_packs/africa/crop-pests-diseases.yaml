    ar:
      claim: 'لا توجد مادة كيميائية تكافح مرض فسيفساء الكسافا. افحص النباتات كل أسبوع خلال الشهرين أو الثلاثة الأولى. اقلع النباتات المريضة وأخرجها من الحقل وجففها في الشمس واحرقها، واستبدلها بعقل سليمة طولها 15 إلى 20 سم من نباتات لا تظهر عليها علامات. لا تزرع الكسافا بجوار حقل مصاب.'
      short: 'فسيفساء الكسافا: لا يعالجها أي مبيد. اقلع النباتات المريضة وجففها واحرقها، وأعد الزراعة بعقل من نباتات سليمة، وافحص كل أسبوع.'
