- id: mln-action
  claim: Pull out and burn maize plants that show maize lethal necrosis. Do not feed them to animals and do not keep their
    seed. Plant certified seed, follow maize with beans or another crop that is not maize, keep a break of two months
    with no maize, clean your tools and remove weeds. Ask your agriculture office before spraying the insects that spread
    it.
  short: 'MLN: pull out and burn sick plants; never feed them to animals or keep their seed. Use certified seed, rotate with
    beans, ask your agriculture office.'
  topic: crop_disease
  vertical: agriculture
  kind: action
  subjects:
  - maize
  keywords: [maize, mln, lethal, necrosis, control, certified, seed, rotate, mahindi, kudhibiti, mbegu, mais, lutte,
             semences, milho, necrose, ذرة, نخر, በቆሎ, ኒክሮሲስ, boqqolloo, galley, galleyda]
  translations:
    sw:
      claim: Ng'oa na uchome mimea ya mahindi yenye ugonjwa wa MLN. Usiwalishe mifugo na usihifadhi mbegu zake. Panda mbegu
        zilizothibitishwa, panda maharagwe au zao lisilo mahindi baada ya mahindi, acha miezi miwili bila mahindi, safisha
        zana zako na ondoa magugu. Uliza ofisi ya kilimo kabla ya kunyunyizia dawa wadudu wanaoueneza.
      short: 'MLN: ng''oa na uchome mimea yenye ugonjwa; usiwalishe mifugo wala kuhifadhi mbegu zake. Tumia mbegu
        zilizothibitishwa, uliza ofisi ya kilimo.'
    fr:
      claim: Arrachez et brûlez les plants de maïs atteints de nécrose létale. Ne les donnez pas aux animaux et ne gardez
        pas leurs semences. Semez des semences certifiées, faites suivre le maïs par des haricots ou une autre culture que le
        maïs, laissez deux mois sans maïs, nettoyez vos outils et enlevez les mauvaises herbes. Demandez au service agricole
        avant de traiter contre les insectes qui la transmettent.
      short: 'Nécrose du maïs : arrachez et brûlez les plants malades, ni fourrage ni semences. Semences certifiées,
        rotation, demandez au service agricole.'
    pt:
      claim: 'Arranque e queime as plantas de milho com necrose letal. Não as dê aos animais e não guarde a sua semente. Semeie semente certificada, faça rotação do milho com feijão ou outra cultura que não seja milho, deixe dois meses sem milho, limpe as ferramentas e tire as ervas daninhas. Pergunte aos serviços de agricultura antes de pulverizar os insetos que a transmitem.'
      short: 'MLN: arranque e queime as plantas doentes; não as dê aos animais nem guarde a semente. Use semente certificada, rode com feijão, pergunte à agricultura.'
      reviewed: false
    ar:
      claim: 'اقلع نباتات الذرة المصابة بالنخر المميت واحرقها. لا تطعمها للحيوانات ولا تحتفظ ببذورها. ازرع بذورًا معتمدة، وازرع بعد الذرة الفاصوليا أو محصولًا آخر غير الذرة، واترك شهرين بلا ذرة، ونظف أدواتك وأزل الأعشاب. اسأل مكتب الزراعة قبل رش الحشرات التي تنقله.'
      short: 'النخر المميت: اقلع النباتات المريضة واحرقها، ولا تطعمها للحيوانات ولا تحفظ بذورها. ازرع بذورًا معتمدة، وناوب مع الفاصوليا، واسأل مكتب الزراعة.'
      reviewed: false
    am:
      claim: 'በበቆሎ ገዳይ ኒክሮሲስ የተያዙ የበቆሎ ተክሎችን ነቅለው ያቃጥሉ። ለእንስሳት አይመግቡ፣ ዘራቸውንም አያስቀምጡ። የተረጋገጠ ዘር ይዝሩ፣ ከበቆሎ በኋላ ባቄላ ወይም ሌላ በቆሎ ያልሆነ ሰብል ይዝሩ፣ ለሁለት ወራት በቆሎ ሳይዘሩ ይቆዩ፣ መሣሪያዎችዎን ያጽዱ እና አረሞችን ያስወግዱ። በሽታውን የሚያስተላልፉትን ነፍሳት ከመርጨትዎ በፊት የግብርና ቢሮዎን ይጠይቁ።'
      short: 'MLN፡ የታመሙ ተክሎችን ነቅለው ያቃጥሉ፤ ለእንስሳት አይመግቡ፣ ዘራቸውንም አያስቀምጡ። የተረጋገጠ ዘር ይጠቀሙ፣ ከባቄላ ጋር ያፈራርቁ፣ የግብርና ቢሮን ይጠይቁ።'
      reviewed: false
    om:
      claim: 'Biqiltuu boqqolloo dhukkuba MLN qaban buqqisaa gubaa. Horiif hin kenninaa, sanyii isaanii hin kuusinaa. Sanyii mirkanaa''e facaasaa, boqqolloo booda baaqelaa ykn midhaan biraa boqqolloo hin taane facaasaa, ji''a lama boqqolloo malee turaa, meeshaalee keessan qulqulleessaa aramas balleessaa. Ilbiisota dhukkuba kana daddabarsan biifuu dura waajjira qonnaa gaafadhaa.'
      short: 'MLN: biqiltuu dhukkubsate buqqisaa gubaa; horiif hin kenninaa, sanyii hin kuusinaa. Sanyii mirkanaa''e fayyadamaa, baaqelaan jijjiiraa, qonna gaafadhaa.'
      reviewed: false
    so:
      claim: 'Ka saar oo gub geedaha galleyda ee qaba cudurka dila galleyda. Ha siin xoolaha, hana kaydsan iniintooda. Beer abuur shahaado leh, galleyda kadib beer digir ama dalag kale oo aan galley ahayn, ka tag laba bilood oo aan galley lahayn, nadiifi qalabkaaga oo saar haramaha. Weydii xafiiska beeraha ka hor intaadan buufin cayayaanka faafiya.'
      short: 'MLN: ka saar oo gub geedaha jiran; ha siin xoolaha, hana kaydsan iniintooda. Isticmaal abuur shahaado leh, ku beddel digir, weydii xafiiska beeraha.'
      reviewed: false
