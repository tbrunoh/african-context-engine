# Fall armyworm in maize: identification, scouting and low cost control. Applies in every covered country.
# Sources are FAO guidance notes, ICIPE and CIFOR-ICRAF field guides. Push-pull is scoped to the
# countries where ICIPE has disseminated it. Next step: review by national extension services.
