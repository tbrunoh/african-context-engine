    ig:
      claim: 'Ikpuru akwụkwọ tomato na-egwu ụzọ sara mbara na-egbuke egbuke dịka ọlaọcha n''akwụkwọ tomato, nke na-acha aja aja ma kpọnwụọ. Ha na-akpụkwa oghere n''ime osisi na mkpụrụ, na-ahapụ oghere ọpụpụ na mkpụrụ ahụ. Ikpuru ndị ahụ na-acha akwụkwọ ndụ ruo pink, ogologo ruo 9 mm, nwere eriri ojii n''azụ isi. Ọ nwekwara ike ịwakpo afufa, ose na nduku.'
      short: 'Akara ikpuru akwụkwọ tomato: ụzọ na-egbuke egbuke n''akwụkwọ na-acha aja aja, oghere na mkpụrụ, ikpuru obere akwụkwọ ndụ ruo pink nwere eriri ojii.'
