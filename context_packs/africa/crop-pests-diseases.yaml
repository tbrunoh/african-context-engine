    om:
      claim: 'Dhukkubni goggogsaa muuzii Xaanttoomoonaas qoricha hin qabu. Akkuma biqiltuun tokko mallattoo agarsiiseen, biqiltuu sana lafa irraa kutaatii biqiltuuwwan fayyaa ta''an iddoo isaanii dhiisaa. Kutaa hundaan booda meeshaa sana ibidda irratti hanga daqiiqaa tokkootti qabachuun ykn saamunaa fi bishaaniin ykn kiloriiniin dhiquun qulqulleessaa. Erga harki dhumaa uumamee booda, ababa dhiiraa muka damee lama qabuun buqqisaa, biqiltuuwwanis yeroo baay''ee ilaalaa.'
