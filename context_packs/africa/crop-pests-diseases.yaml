    pcm:
      claim: 'Remove and destroy tomato fruit wey worm don enter quick quick, and clear other plants wey the insect dey live for around the farm. Pheromone trap dey catch the flying insects, and products wey dem make from neem (dogonyaro) or Bacillus thuringiensis fit help. Normal spray dey fail because the worms dey eat inside the leaf, and the insect dey quickly resist chemical, so ask extension officer before you spray.'
