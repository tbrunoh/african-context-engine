    am:
      claim: 'የሙዝ ዛንቶሞናስ ጠውልግ ቅጠሎች ቢጫ እንዲሆኑና እንዲጠወልጉ፣ ዘለላዎች ያለጊዜያቸው እንዲበስሉና እንዲበሰብሱ ያደርጋል፣ ተክሉም ይሞታል። በሽታው በምሥራቅ እና በመካከለኛው አፍሪካ ይገኛል።'
      short: 'የሙዝ ጠውልግ ምልክቶች፡ ቅጠሎች ቢጫ መሆንና መጠውለግ፣ ዘለላዎች ቀድመው መብሰልና መበስበስ፣ ተክሎች መሞት።'
      reviewed: false
    om:
      claim: 'Dhukkubni goggogsaa muuzii Xaanttoomoonaas baalli akka keelloo ta''uu fi goggogu, firiin muuzii yeroo isaa dura bilchaatee akka tortoru, biqiltuunis akka du''u godha. Dhukkubni kun Afrikaa Bahaa fi Giddu Galeessaa keessa jira.'
      short: 'Mallattoo goggogsaa muuzii: baala keelloo ta''ee goggogu, firii yeroo dura bilchaatee tortoru, biqiltuu du''u.'
      reviewed: false
    so:
      claim: 'Cudurka engegga muuska ee Xanthomonas wuxuu ka dhigaa caleemaha inay huruud noqdaan oo engegaan, xidhmooyinka muuska ayaa bisla goor hore oo qudhma, geedkuna wuu dhintaa. Cudurka waxaa laga helaa Bariga iyo Bartamaha Afrika.'
      short: 'Calaamadaha engegga muuska: caleemo huruud noqda oo engega, xidhmooyin goor hore bisla oo qudhma, geedo dhinta.'
      reviewed: false
    ti:
      claim: 'ሕማም ምንቕፋፍ ባናና (Xanthomonas) ቆጽሊ ብጫ ኮይኑ ክልሕልሕ፣ ኣስካል ባናና ቅድሚ ግዜኡ በሲሉ ክበላሸው፣ ተኽሊ ድማ ክመውት ይገብር። እዚ ሕማም ኣብ ምብራቕን ማእከልን ኣፍሪቃ ይርከብ።'
      short: 'ምልክታት ምንቕፋፍ ባናና: ብጫ ዝኸውን ዝልሕልሕ ቆጽሊ፣ ቀልጢፉ ዝበስልን ዝበላሸውን ኣስካል፣ ዝመውት ተኽሊ።'
      reviewed: false
    fuf:
      claim: 'Ñawu yoorugol banaana (Xanthomonas) ina waɗa haakoo ngoo wonta oolo yoora, banaana ina beñña ado saha mum hewtude ina boosa, lekki oo maaya. Ñawu ngu ina woodi to Fuɗnaange e Hakkunde Afrik.'
      short: 'Maandeeji yoorugol banaana: haakoo wontooɗo oolo yoora, banaana beññooɗo law boosa, lekki maayooɗo.'
      reviewed: false
    mos:
      claim: 'Banaan kuub bãag (Xanthomonas) maanda ti vãadã lebg miuug la b kuum, banaanã bĩid reng ti wakatã ta la b põo, la koodã ki. Bãag kãngã bee Afrik Yaang la a Sukã.'
      short: 'Banaan kuub bãnde: vãad sẽn lebgd miuug la b kuumd, banaan sẽn bĩid tao-tao la b põo, kood sẽn kiid.'
      reviewed: false
    dyu:
      claim: 'Namasa jali bana (Xanthomonas) bɛ a kɛ furaw bɛ nɛrɛmuguya ka ja, namasa denw bɛ mɔ sani u waati ka se ka tolon, sɛnɛfɛn bɛ sa. Nin bana bɛ Afiriki Kɔrɔn ni a Cɛmancɛ la.'
      short: 'Namasa jali taamashiyɛnw: furaw minnu bɛ nɛrɛmuguya ka ja, namasa denw minnu bɛ mɔ joona ka tolon, sɛnɛfɛn min bɛ ka sa.'
      reviewed: false
    wo:
      claim: 'Feebaru wow bu banaana (Xanthomonas) dafay tax xob yi mboq te lafu, banaana yi ñor bala jamono jot te yàqu, te gàncax gi dee. Feebar bii ngi am ci Penku ak Diggu Afrig.'
      short: 'Màndargay wow bu banaana: xob yuy mboq te lafu, banaana yuy ñor ci teel te yàqu, gàncax guy dee.'
      reviewed: false
    ee:
      claim: 'Akɔɖu ƒe ƒuƒu dɔlélé (Xanthomonas) naa aŋgbawo zua dzẽ eye woƒuna, akɔɖu ƒe ʋlɔwo ɖia hafi woƒe ɣeyiɣi naɖo eye wogblẽna, eye nukuku la kuna. Dɔlélé sia le Afrika ƒe Ɣedzeƒe kple Titina.'
      short: 'Akɔɖu ƒe ƒuƒu ƒe dzesiwo: aŋgba siwo le dzẽ zum eye wole ƒuƒum, ʋlɔ siwo ɖina kaba eye wogblẽna, nukuku si le kukum.'
      reviewed: false
    ak:
      claim: 'Kwadu nkyenkyem yare (Xanthomonas) ma nhaban dan akokɔsrades na ɛhwan, kwadu no bere ansa na ne bere adu na ɛporɔw, na afifide no wu. Yare yi wɔ Afrika Apuei ne Mfinimfini.'
      short: 'Kwadu nkyenkyem nsɛnkyerɛnne: nhaban a ɛdan akokɔsrades na ɛhwan, kwadu a ɛbere ntɛm na ɛporɔw, afifide a ɛrewu.'
      reviewed: false
    ln:
      claim: 'Bokono ya kokauka ya makemba (Xanthomonas) esalaka ete nkasa ekoma mosaka mpe ekauka, makemba eteya liboso ya tango mpe epola, mpe bilona ekufa. Bokono oyo ezali na Ete mpe na Katikati ya Afrika.'
      short: 'Bilembo ya kokauka ya makemba: nkasa ekomi mosaka mpe ekauki, makemba eteyi liboso ya tango mpe epoli, bilona ekufi.'
      reviewed: false
    lg:
      claim: 'Obulwadde bwa kiwotoka obw''amatooke (Xanthomonas) bufuula ebikoola kyenvu ne biwotoka, enkota z''amatooke ne zengera nga ebiseera tebinnatuuka ne zivunda, era ekirime ne kifa. Obulwadde buno busangibwa mu Buvanjuba ne mu Masekkati ga Afirika.'
      short: 'Obubonero bwa kiwotoka: ebikoola ebifuuka kyenvu ne biwotoka, enkota ezengera nga ebiseera tebinnatuuka ne zivunda, ekirime ekifa.'
      reviewed: false
    rn:
      claim: 'Indwara yumisha insina (Xanthomonas) ituma amababi aba umuhondo akuma, ibitoke bigahisha igihe kitageze bikabora, kandi ikimera kigapfa. Iyi ndwara iboneka mu Buseruko no mu Karere ko Hagati ka Afrika.'
      short: 'Ibimenyetso vy''indwara yumisha insina: amababi ahinduka umuhondo akuma, ibitoke bihisha kare bikabora, ikimera gipfa.'
      reviewed: false
    rw:
      claim: 'Kirabiranya y''urutoki (Xanthomonas) ituma amababi aba umuhondo akanuma, ibitoki bigahisha igihe kitageze bikabora, kandi igihingwa kigapfa. Iyi ndwara iboneka mu Burasirazuba no mu Karere ko Hagati ka Afurika.'
      short: 'Ibimenyetso bya kirabiranya: amababi ahinduka umuhondo akuma, ibitoki bihisha kare bikabora, igihingwa gipfa.'
      reviewed: false
    bem:
      claim: 'Ubulwele bwa kuuma kwa nkonde (Xanthomonas) bulalenga amabula ukuba ayakashikila no kufota, ifisansa fya nkonde ukupya ilyo inshita taileafika no kubola, kabili icilimwa cilafwa. Ubu bulwele bulasangwa ku Kabanga na pa Kati ka Afrika.'
      short: 'Ifishibilo fya kuuma kwa nkonde: amabula ayalesanguka kashikila no kufota, ifisansa ifilepya bwangu no kubola, icilimwa icilefwa.'
      reviewed: false
    ny:
      claim: 'Matenda ofota nthochi (Xanthomonas) amachititsa masamba kukhala achikasu ndi kufota, zipatso za nthochi kupsa nthawi isanakwane ndi kuwola, ndipo mbewu imafa. Matendawa amapezeka Kum''mawa ndi Pakati pa Africa.'
      short: 'Zizindikiro zofota nthochi: masamba akusanduka achikasu ndi kufota, zipatso zikupsa nthawi isanakwane ndi kuwola, mbewu ikufa.'
      reviewed: false
    sn:
      claim: 'Chirwere chekusvava kwemabhanana (Xanthomonas) chinoita kuti mashizha ave yero uye asvave, masumbu emabhanana aibve nguva isati yakwana uye aore, uye chirimwa chife. Chirwere ichi chinowanikwa kuMabvazuva nepakati peAfrica.'
      short: 'Zviratidzo zvekusvava kwemabhanana: mashizha ari kuva yero achisvava, masumbu anoibva nguva isati yakwana achiora, chirimwa chinofa.'
      reviewed: false
    ts:
      claim: 'Vuvabyi byo vuna ka mabanana (Xanthomonas) byi endla leswaku matluka ma tshopana ma vuna, swirhundzu swa mabanana swi vupfa ku nga si fika nkarhi swi bola, naswona ximila xi fa. Vuvabyi lebyi byi kumeka eVuxeni na le Xikarhi xa Afrika.'
      short: 'Swikombiso swo vuna ka mabanana: matluka lama tshopanaka ma vuna, swirhundzu leswi vupfaka ku nga si fika nkarhi swi bola, ximila lexi faka.'
      reviewed: false
    tn:
      claim: 'Bolwetse jwa go swaba ga banana (Xanthomonas) bo dira gore matlhare a nne serolwana mme a swabe, ditlhopha tsa banana di butswe pele ga nako mme di bole, mme semela se swe. Bolwetse jo bo bonwa kwa Botlhaba le Bogare jwa Aforika.'
      short: 'Matshwao a go swaba ga banana: matlhare a a fetogang serolwana a swabang, ditlhopha tse di butswang pele ga nako di bole, semela se se swang.'
      reviewed: false
    st:
      claim: 'Lefu la ho swaba ha banana (Xanthomonas) le etsa hore makgasi a be mosehla mme a swabe, mekotla ya banana e butswe pele ho nako mme e bole, mme semela se shwe. Lefu lena le fumanwa Botjhabela le Bohareng ba Afrika.'
      short: 'Matshwao a ho swaba ha banana: makgasi a fetohang mosehla a swabang, mekotla e butswang pele ho nako e bolang, semela se shwang.'
      reviewed: false
    af:
      claim: 'Piesang-Xanthomonas-verwelking laat blare geel word en verwelk, trosse ryp word voor hul tyd en vrot, en die plant sterf. Die siekte kom in Oos- en Sentraal-Afrika voor.'
      short: 'Tekens van piesangverwelking: blare wat geel word en verwelk, trosse wat te vroeg ryp word en vrot, plante wat sterf.'
