    am:
      claim: 'የካሳቫ ሞዛይክ በሽታን የሚቆጣጠር ኬሚካል የለም። በመጀመሪያዎቹ ሁለት እስከ ሶስት ወራት ተክሎችን በየሳምንቱ ይፈትሹ። የታመሙ ተክሎችን ነቅለው ከማሳው ያውጡ፣ በፀሐይ አድርቀው ያቃጥሉ፣ ምልክት ከሌላቸው ተክሎች በተወሰዱ ከ15 እስከ 20 ሴ.ሜ በሚረዝሙ ጤናማ ቁርጥራጮች ይተኩ። በሽታው ካለበት ማሳ አጠገብ ካሳቫ አይትከሉ።'
