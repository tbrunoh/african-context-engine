templates:
  safety.OPENERS.self_harm: "Aad baan uga xumahay inaad sidan dareemayso. Waxaad mudan tahay taageero hadda. {numbers}"
  safety.OPENERS.maternal: "Tani waxay noqon kartaa xaalad degdeg ah oo uurka ah. Hadda aad xarunta caafimaadka ee kuugu dhow. {numbers}"
  safety.OPENERS.poisoning: "Tani waxay u egtahay sumoobid. Hadda raadi gargaar caafimaad oo qaado weelka. {numbers}"
  safety.OPENERS.child_protection: "Ilmo ayaa khatar ku jiri kara. Fadlan hadda raadi gargaar. {numbers}"
  safety.OPENERS.gbv: "Waan ka xumahay waxa kugu dhacaya. Hadda waad heli kartaa gargaar. {numbers}"
