# Igbo for Nigeria, in the standard Latin script with the dotted letters ị, ọ, ụ and ṅ. Tone marks are left out, as
# most people type Igbo on phones. Drafted for ACE 2.3. Awaiting review by fluent speakers and, for the safety
# phrases, by clinicians.
meta:
  code: ig
  name: Igbo
  native: "Igbo"
  script: Latn
  encoding: gsm7
  direction: ltr
  reviewed: false
  confirm: "ACE ga-aza n'asụsụ Igbo."
  names: ["igbo", "asusu igbo", "ig"]

templates:
  safety.OPENERS.self_harm: "Ọ dị m nwute nke ukwuu na ị na-enwe mmetụta a. I kwesịrị inweta nkwado ugbu a. {numbers}"
  safety.OPENERS.maternal: "Nke a nwere ike ịbụ ihe mberede afọ ime. Gaa n'ụlọ ọgwụ kacha nso ugbu a. {numbers}"
  safety.OPENERS.poisoning: "Nke a dị ka nsi. Chọọ enyemaka dọkịta ugbu a, were karama ahụ gaa. {numbers}"
  safety.OPENERS.child_protection: "Nwatakịrị nwere ike ịnọ n'ihe egwu. Biko chọọ enyemaka ugbu a. {numbers}"
  safety.OPENERS.gbv: "Ọ dị m nwute na nke a na-eme gị. Ị nwere ike inweta enyemaka ugbu a. {numbers}"
  safety.OPENERS.fire: "Nke a dị ka ọkụ. Mee ka mmadụ niile pụọ ugbu a, unu alaghachila n'ime. {numbers}"
  safety.OPENERS.health_urgent: "Nke a dị ka ihe mberede. Chọọ enyemaka dọkịta ugbu a. {numbers}"
  safety.CALL_WORD: "Kpọọ {numbers}"
  safety.OR_WORD: "ma ọ bụ"
  safety.EMERGENCY_WORD: "mberede"
  safety.FALLBACK_NUMBERS: "Kpọọ nọmba mberede mpaghara gị ma ọ bụ gaa n'ụlọ ọgwụ kacha nso."

  commands.TEXTS.help: "ACE na-enye ndụmọdụ mpaghara a nyochara. Jụọ ajụjụ n'asụsụ gị. Iwu: AGHỤGHỌ + ozi iji nyochaa ozi, NDỤMỌDỤ + ndụmọdụ gị iji kesaa ihe ọmụma, NDABERE, ỌZỌ, ASỤSỤ + koodu (dịka ASỤSỤ EN), HICHAPỤ iji hichapụ data gị."
  commands.TEXTS.help_short: "Jụọ ACE ajụjụ n'asụsụ gị. AGHỤGHỌ + ozi na-enyocha ya. HICHAPỤ na-ehichapụ data gị."
  commands.TEXTS.forgotten: "Emechala. Ehichapụla ihe niile ACE nwere gbasara nọmba a."
  commands.TEXTS.stopped: "Ị gaghị enweta ozi ọzọ site n'aka ACE ọ gwụla ma i dee ọzọ. Ziga HICHAPỤ iji hichapụ data gị."
  commands.TEXTS.language: "Zaa ASỤSỤ na koodu:"
  commands.TEXTS.tip_thanks: "Daalụ. Echekwala ndụmọdụ gị ka ọkachamara nyochaa ya. A gaghị ekesa ya ruo mgbe a nyochara ya."
  commands.TEXTS.tip_usage: "Ziga NDỤMỌDỤ na ndụmọdụ gị, dịka: NDỤMỌDỤ akwụkwọ dogonyaro na-enyere aka megide ikpuru ọka na Enugu."
  commands.TEXTS.scam_usage: "Ziga AGHỤGHỌ na ozi ị na-enweghị obi ike na ya, ACE ga-enyocha ya."
  commands.TEXTS.no_sources: "Enweghị azịza mbụ a ga-egosi ebe o si. Buru ụzọ jụọ ajụjụ."
  commands.TEXTS.no_more: "Nke ahụ bụ ihe niile ACE nwere n'isiokwu a ugbu a. Jụọ ajụjụ ọzọ ma ọ bụ ziga ENYEMAKA."
  commands.TEXTS.clarify: "ACE enwebeghị ndụmọdụ a nyochara gbasara nke ahụ. ACE nwere ike inyere gị aka na: {topics}. Ziga NDỤMỌDỤ iji tụnye ihe ọmụma."
  commands.TEXTS.unread: "ACE agụbeghị asụsụ a. Biko dee n'otu n'ime ndị a: {languages}."

