- id: scouting-w-pattern
  claim: Visit your maize often to scout. Check 50 plants by walking a W shape across the field, stopping at five points
    and looking into the whorls of ten plants at each point.
  short: 'Scout often: walk a W across the field, stop at 5 points, check the whorl of 10 plants at each.'
