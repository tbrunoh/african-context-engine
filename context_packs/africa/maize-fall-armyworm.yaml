      claim: 'Visitez souvent votre champ de maïs pour le surveiller. Examinez 50 plants en traversant le champ en forme
        de W : arrêtez-vous en cinq points et regardez dans le cornet de dix plants à chaque point.'
      short: 'Surveillez souvent : traversez le champ en W, arrêtez-vous en 5 points, examinez le cornet de 10 plants
