  commands.TEXTS.help: "ACE n fun ọ ni imọran agbegbe ti a ti ṣayẹwo. Beere ibeere ni ede rẹ. Awọn aṣẹ: JIBITI + ifiranṣẹ lati ṣayẹwo ifiranṣẹ, IMỌRAN + imọran rẹ lati pin imọ, ORISUN, SIWAJU, EDE + koodu (fun apẹẹrẹ EDE EN), PAARẸ lati pa data rẹ rẹ."
  commands.TEXTS.help_short: "Beere ibeere lọwọ ACE ni ede rẹ. JIBITI + ifiranṣẹ yoo ṣayẹwo rẹ. PAARẸ yoo pa data rẹ rẹ."
