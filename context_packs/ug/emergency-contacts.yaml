      short: 'Dhuluma za kijinsia au mtoto hatarini Uganda: piga 0800 199 195, bure.'
  source: Uganda Police Force Child and Family Protection Department, via Nile Post; UN Women Uganda
  source_url: https://nilepost.co.ug/news/109883/police-ask-gender-based-violence-victims-to-always-speak-out
