  translations:
    sw:
      claim: Viwavi wachanga wa viwavijeshi vamizi hukwangua majani ya mahindi na kuacha madoa membamba kama madirisha.
        Viwavi wakubwa hujificha katikati ya kilele cha mmea, hula majani machanga na kuacha kinyesi kibichi kama unga
        wa mbao.
      short: 'Dalili: madoa kama madirisha kwenye majani, kilele kilicholiwa, kinyesi kibichi kama unga wa mbao.'
    fr:
      claim: Les jeunes larves de la chenille légionnaire d'automne grattent les feuilles de maïs et laissent de fines
        plages transparentes, comme des fenêtres. Les larves plus âgées se cachent dans le cornet, déchiquettent les
        jeunes feuilles et laissent des excréments humides qui ressemblent à de la sciure.
      short: 'Signes : plages transparentes sur les feuilles, cornet déchiqueté, excréments humides comme de la sciure.'
    pt:
      claim: 'As larvas jovens da lagarta-do-funil raspam as folhas do milho e deixam manchas finas e transparentes, como janelas. As larvas mais velhas escondem-se no cartucho, rasgam as folhas novas e deixam excrementos húmidos parecidos com serradura.'
      short: 'Sinais da lagarta-do-funil: manchas transparentes nas folhas, cartucho rasgado, excrementos húmidos como serradura no cartucho.'
      reviewed: false
    ar:
      claim: 'تكشط يرقات دودة الحشد الخريفية الصغيرة أوراق الذرة وتترك بقعًا رقيقة شفافة كالنوافذ. أما اليرقات الأكبر فتختبئ في قلب النبتة، وتمزق الأوراق الصغيرة، وتترك فضلات رطبة تشبه نشارة الخشب.'
      short: 'علامات دودة الحشد الخريفية: بقع شفافة على الأوراق، قلب ممزق، فضلات رطبة تشبه نشارة الخشب في قلب النبتة.'
      reviewed: false
    am:
      claim: 'ለጋ የፎል አርሚዎርም (የአሜሪካ መጤ ተምች) እጮች የበቆሎ ቅጠሎችን ፍቀው እንደ መስኮት የሚያሳዩ ስስ ምልክቶችን ይተዋሉ። ትላልቆቹ እጮች በተክሉ እንብርት ውስጥ ይደበቃሉ፣ ለጋ ቅጠሎችን ይቦጫጭቃሉ፣ እርጥብና ሰጋቱራ የሚመስል ኩስ ይተዋሉ።'
      short: 'የተምቹ ምልክቶች፡ በቅጠል ላይ እንደ መስኮት ያሉ ስስ ምልክቶች፣ የተቦጫጨቀ እንብርት፣ በእንብርቱ ውስጥ እርጥብ ሰጋቱራ የሚመስል ኩስ።'
      reviewed: false
    om:
      claim: 'Ilmaan raammoo loltuu (fall armyworm) xixiqqoon baala boqqolloo haxaa''anii mallattoo qal''aa foddaa fakkaatu dhiisu. Ilmaan guddatan handhuura biqiltuu keessa dhokatu, baala haaraa ciccitu, udaan jiidhaa daakuu mukaa fakkaatu dhiisu.'
      short: 'Mallattoo raammoo loltuu: mallattoo foddaa fakkaatu baala irratti, handhuura cicciitame, udaan jiidhaa daakuu mukaa fakkaatu handhuura keessatti.'
      reviewed: false
    so:
      claim: 'Dirxiga yar ee fall armyworm wuxuu xoqaa caleemaha galleyda wuxuuna uga tagaa dhibco khafiif ah oo daaqad u eg. Dirxiga waaweyn waxay ku dhuuntaan bartamaha geedka, waxay jeexjeexaan caleemaha cusub, waxayna ka tagaan saxaro qoyan oo budo alwaax u eg.'
      short: 'Calaamadaha fall armyworm: dhibco daaqad u eg oo caleemaha ku yaal, bartame jeexjeexan, saxaro qoyan oo budo alwaax u eg bartamaha.'
      reviewed: false
