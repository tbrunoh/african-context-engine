  translations:
    sw:
      claim: Tafuta huduma mara moja wakati wa ujauzito ikiwa mtoto atabadilisha jinsi anavyocheza tumboni, au baada
        ya jeraha lolote tumboni.
      short: Mtoto anacheza kidogo au tofauti, au umeumia tumboni? Tafuta huduma mara moja.
    fr:
      claim: Pendant la grossesse, consultez immédiatement si les mouvements du bébé changent, ou après tout choc au
        ventre.
      short: Le bébé bouge moins ou autrement, ou un choc au ventre ? Consultez immédiatement.
    pt:
      claim: 'Procure cuidados imediatamente na gravidez se os movimentos do bebé mudarem, ou depois de qualquer pancada na barriga.'
      short: 'O bebé mexe menos ou de outra forma, ou houve uma pancada na barriga? Procure cuidados já.'
