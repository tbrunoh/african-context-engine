    am:
      claim: 'የሙዝ ዛንቶሞናስ ጠውልግ መድኃኒት የለውም። አንድ ተክል ምልክት እንዳሳየ ያንን ተክል ከአፈር ጋር እኩል ቆርጠው ጤናማዎቹን ተክሎች በጉቶው ላይ ይተዉ። ከእያንዳንዱ ቁርጥ በኋላ መሣሪያውን እስከ አንድ ደቂቃ በእሳት ላይ በመያዝ ወይም በሳሙናና በውሃ ወይም በክሎሪን በማጠብ ያጽዱ። የመጨረሻው እጅ ከተፈጠረ በኋላ የወንድ እምቡጡን ባለ ሹካ እንጨት ያስወግዱ፣ ተክሎችንም በተደጋጋሚ ይፈትሹ።'
      short: 'የሙዝ ጠውልግ፡ መድኃኒት የለውም። የታመመውን ተክል ከአፈር ጋር እኩል ይቁረጡ፣ ከእያንዳንዱ ቁርጥ በኋላ መሣሪያውን በእሳት ወይም በሳሙና ያጽዱ፣ የወንድ እምቡጡን በሹካ እንጨት ያስወግዱ።'
