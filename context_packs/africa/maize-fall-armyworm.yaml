  translations:
    sw:
      claim: Kiwavi wa viwavijeshi vamizi ana alama ya Y iliyopinduka kichwani na madoa manne meusi yaliyopangwa kama
        mraba kwenye pingili ya pili kutoka mwisho wa mwili.
