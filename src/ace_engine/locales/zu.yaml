  commands.TEXTS.help: "I-ACE inikeza izeluleko zendawo ezihloliwe. Buza ngolimi lwakho. Imiyalo: INKOHLISO + umlayezo ukuze uhlole umlayezo, ICEBISO + icebiso lakho ukuze wabelane ngolwazi, IMITHOMBO, OKUNYE, ULIMI + ikhodi (isib. ULIMI EN), SULA ukuze usule imininingwane yakho."
  commands.TEXTS.help_short: "Buza i-ACE ngolimi lwakho. INKOHLISO + umlayezo iyawuhlola. SULA isula imininingwane yakho."
  commands.TEXTS.forgotten: "Kwenziwe. I-ACE isule konke ebinakho ngale nombolo."
  commands.TEXTS.stopped: "Ngeke usathola imilayezo evela ku-ACE ngaphandle uma ubhala futhi. Thumela u-SULA ukuze usule imininingwane yakho."
  commands.TEXTS.language: "Phendula ngo-ULIMI nekhodi:"
  commands.TEXTS.tip_thanks: "Siyabonga. Icebiso lakho ligciniwe ukuze lihlolwe uchwepheshe. Ngeke labiwe lingakahlolwa."
  commands.TEXTS.tip_usage: "Thumela ICEBISO necebiso lakho, isib.: ICEBISO amaqabunga e-neem asiza ngesibungu sommbila eLimpopo."
  commands.TEXTS.scam_usage: "Thumela INKOHLISO nomlayezo ongawuthembi, i-ACE izowuhlola."
  commands.TEXTS.no_sources: "Ayikho impendulo yangaphambili engakhombisa umthombo wayo. Buza umbuzo kuqala."
  commands.TEXTS.no_more: "Yilokho kuphela i-ACE enakho ngale ndaba okwamanje. Buza omunye umbuzo noma uthumele USIZO."
  commands.TEXTS.clarify: "I-ACE ayikabi nesiqondiso esihloliwe ngalokho. I-ACE ingakusiza nge: {topics}. Thumela ICEBISO ukuze wengeze ulwazi."
  commands.TEXTS.unread: "I-ACE ayikakwazi ukufunda lolu limi. Sicela ubhale ngolunye lwalezi: {languages}."

