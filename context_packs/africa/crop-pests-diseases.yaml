    sw:
      claim: Hakuna dawa inayotibu batobato ya muhogo. Kagua mimea kila wiki kwa miezi miwili hadi mitatu ya kwanza.
        Ng'oa mimea yenye ugonjwa, ipeleke nje ya shamba, ikaushe juani na uichome, kisha panda vipandikizi vyenye afya vya
        sentimita 15 hadi 20 kutoka mimea isiyo na dalili. Usipande muhogo karibu na shamba lenye ugonjwa.
      short: 'Batobato ya muhogo: hakuna dawa. Ng''oa, kausha na uchome mimea yenye ugonjwa; panda vipandikizi vyenye afya;
        kagua kila wiki.'
    fr:
      claim: Aucun produit chimique ne traite la mosaïque du manioc. Inspectez les plants chaque semaine pendant les deux à
        trois premiers mois. Arrachez les plants malades, sortez-les du champ, séchez-les au soleil et brûlez-les, puis
        remplacez-les par des boutures saines de 15 à 20 cm prises sur des plants sans symptômes. Ne plantez pas à côté d'un
        champ atteint.
      short: 'Mosaïque du manioc : aucun produit ne la traite. Arrachez et brûlez les plants malades, replantez des boutures
        saines, inspectez chaque semaine.'
    pt:
      claim: 'Nenhum produto químico controla a doença do mosaico da mandioca. Verifique as plantas todas as semanas nos primeiros dois a três meses. Arranque as plantas doentes, leve-as para fora do campo, seque-as ao sol e queime-as, e substitua-as por estacas saudáveis de 15 a 20 cm de plantas sem sinais. Não plante mandioca junto a um campo com a doença.'
      short: 'Mosaico da mandioca: nenhum químico o cura. Arranque, seque e queime as plantas doentes; replante com estacas de plantas sãs; verifique todas as semanas.'
