- id: after-birth
  claim: After giving birth, seek help immediately for heavy bleeding or large clots, red or swollen legs, a headache
    that will not go away, high fever or vomiting, chest pain, difficulty breathing, or seizures.
  short: 'After birth, get help NOW for: heavy bleeding or clots, swollen legs, lasting headache, high fever, chest pain,
    fits.'
