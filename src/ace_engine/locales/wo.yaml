# Wolof for Senegal, in the official Latin spelling. SMS folds ë to e and keeps ñ. Drafted for ACE 2.3 with lower
# confidence than most added languages: fluent speakers and, for the safety phrases, clinicians must review it
# first. Many Senegalese write Wolof mixed with French, and the French safety phrases still apply to those messages.
meta:
  code: wo
  name: Wolof
  native: "Wolof"
  script: Latn
  encoding: gsm7
  direction: ltr
  reviewed: false
  confirm: "ACE dina la tontu ci Wolof."
  names: ["wolof", "wo"]

templates:
