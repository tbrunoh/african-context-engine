- id: bleeding-urgent
  claim: Bleeding in pregnancy needs immediate transport to a health facility. A woman, particularly one with anaemia,
    can die within hours.
  short: 'Bleeding in pregnancy: get to a facility immediately. It can kill within hours.'
  topic: danger_signs
