templates:
  safety.OPENERS.self_harm: "Nnina ennaku nnyingi okuba nti owulira bw'otyo. Osaanidde okufuna obuyambi kaakano. {numbers}"
  safety.OPENERS.maternal: "Kino kiyinza okuba obuzibu obw'amangu obw'olubuto. Genda mu ddwaaliro eriri okumpi kaakano. {numbers}"
