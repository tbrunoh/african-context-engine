# Mooré for Burkina Faso, written with plain u and i where the standard spelling has u and i, as most people type
# it on phones; SMS folds the nasal vowels. Commands stay in French, as many speakers use them. Drafted for ACE 2.3
# with the lowest confidence of the added languages: fluent speakers and, for the safety phrases, clinicians must
# review it before it is offered widely. The French safety phrases still apply to messages that mix French in.
