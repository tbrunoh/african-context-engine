# Lingala for DR Congo, in the standard spelling without tone marks. Its commonest words, na and ya, are also
# Swahili markers, so its own marker words count double (marker_weight). Drafted for ACE 2.3. Awaiting review by
# fluent speakers and, for the safety phrases, by clinicians.
meta:
  code: ln
  name: Lingala
  native: "Lingala"
  script: Latn
  encoding: gsm7
  direction: ltr
  reviewed: false
  marker_weight: 2
  confirm: "ACE ekozongisa na Lingala."
  names: ["lingala", "ln"]

