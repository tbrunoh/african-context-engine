  translations:
    sw:
      claim: Viwavi wachanga wa viwavijeshi vamizi hukwangua majani ya mahindi na kuacha madoa membamba kama madirisha.
        Viwavi wakubwa hujificha katikati ya kilele cha mmea, hula majani machanga na kuacha kinyesi kibichi kama unga
        wa mbao.
      short: 'Dalili: madoa kama madirisha kwenye majani, kilele kilicholiwa, kinyesi kibichi kama unga wa mbao.'
    fr:
      claim: Les jeunes larves de la chenille légionnaire d'automne grattent les feuilles de maïs et laissent de fines
        plages transparentes, comme des fenêtres. Les larves plus âgées se cachent dans le cornet, déchiquettent les
        jeunes feuilles et laissent des excréments humides qui ressemblent à de la sciure.
      short: 'Signes : plages transparentes sur les feuilles, cornet déchiqueté, excréments humides comme de la sciure.'
    pt:
      claim: 'As larvas jovens da lagarta-do-funil raspam as folhas do milho e deixam manchas finas e transparentes, como janelas. As larvas mais velhas escondem-se no cartucho, rasgam as folhas novas e deixam excrementos húmidos parecidos com serradura.'
      short: 'Sinais da lagarta-do-funil: manchas transparentes nas folhas, cartucho rasgado, excrementos húmidos como serradura no cartucho.'
      reviewed: false
    ar:
      claim: 'تكشط يرقات دودة الحشد الخريفية الصغيرة أوراق الذرة وتترك بقعًا رقيقة شفافة كالنوافذ. أما اليرقات الأكبر فتختبئ في قلب النبتة، وتمزق الأوراق الصغيرة، وتترك فضلات رطبة تشبه نشارة الخشب.'
      short: 'علامات دودة الحشد الخريفية: بقع شفافة على الأوراق، قلب ممزق، فضلات رطبة تشبه نشارة الخشب في قلب النبتة.'
      reviewed: false
    am:
      claim: 'ለጋ የፎል አርሚዎርም (የአሜሪካ መጤ ተምች) እጮች የበቆሎ ቅጠሎችን ፍቀው እንደ መስኮት የሚያሳዩ ስስ ምልክቶችን ይተዋሉ። ትላልቆቹ እጮች በተክሉ እንብርት ውስጥ ይደበቃሉ፣ ለጋ ቅጠሎችን ይቦጫጭቃሉ፣ እርጥብና ሰጋቱራ የሚመስል ኩስ ይተዋሉ።'
      short: 'የተምቹ ምልክቶች፡ በቅጠል ላይ እንደ መስኮት ያሉ ስስ ምልክቶች፣ የተቦጫጨቀ እንብርት፣ በእንብርቱ ውስጥ እርጥብ ሰጋቱራ የሚመስል ኩስ።'
      reviewed: false
    om:
      claim: 'Ilmaan raammoo loltuu (fall armyworm) xixiqqoon baala boqqolloo haxaa''anii mallattoo qal''aa foddaa fakkaatu dhiisu. Ilmaan guddatan handhuura biqiltuu keessa dhokatu, baala haaraa ciccitu, udaan jiidhaa daakuu mukaa fakkaatu dhiisu.'
      short: 'Mallattoo raammoo loltuu: mallattoo foddaa fakkaatu baala irratti, handhuura cicciitame, udaan jiidhaa daakuu mukaa fakkaatu handhuura keessatti.'
      reviewed: false
    so:
      claim: 'Dirxiga yar ee fall armyworm wuxuu xoqaa caleemaha galleyda wuxuuna uga tagaa dhibco khafiif ah oo daaqad u eg. Dirxiga waaweyn waxay ku dhuuntaan bartamaha geedka, waxay jeexjeexaan caleemaha cusub, waxayna ka tagaan saxaro qoyan oo budo alwaax u eg.'
      short: 'Calaamadaha fall armyworm: dhibco daaqad u eg oo caleemaha ku yaal, bartame jeexjeexan, saxaro qoyan oo budo alwaax u eg bartamaha.'
      reviewed: false
    ti:
      claim: 'ንኣሽቱ ሓሰኻ ዕፉን (fall armyworm) ቆጽሊ ዕፉን ይፍሕፍሑ፣ ከም መስተዋት መስኮት ዝኾኑ ቀጠንቲ ቦታታት ይገድፉ። ዓበይቲ ሓሰኻ ኣብ ልቢ ተኽሊ ይሕብኡ፣ ንኣሽቱ ቆጽሊ ይቐድዱ፣ frass ዝበሃል ከም ሓርጭ ዕንጨይቲ ዝመስል ርሑስ ርስሓት ድማ ይገድፉ።'
      short: 'ምልክታት ሓሰኻ ዕፉን: ኣብ ቆጽሊ ከም መስተዋት ዝኾኑ ቦታታት፣ ዝተቐደደ ልቢ ተኽሊ፣ ኣብ ልቢ ተኽሊ ከም ሓርጭ ዕንጨይቲ ዝመስል ርሑስ ርስሓት።'
      reviewed: false
    fuf:
      claim: 'Ɓowɗi makka tokooɗi (fall armyworm) ina ñaama haakoo makka, ina acca nokkuuji ɓennuɗi no weer palanteer. Ɓowɗi mawɗi ina suuɗoo e ɓernde ko aawi, ina seeka haakoo kesoo, ina acca bolaaje leppuɗe no ndonndi lekki ɗe noddirtee frass.'
      short: 'Maandeeji ɓowɗi makka: nokkuuji no weer e haakoo, ɓernde ko aawi seekaaɗo, bolaaje leppuɗe no ndonndi lekki e ɓernde ko aawi.'
      reviewed: false
    mos:
      claim: 'Kamaan zãns bilfã (fall armyworm) koosda kamaan vãadã, n basd zĩis sẽn yaa bilf wa fenetr wɛɛr. Zãns-kãsemsã solgda b menga koodã sũurẽ, b pãrgda vãad-paalã, la b basda bĩnd sẽn tar koom wa tiig tom b sẽn boond ti frass.'
      short: 'Kamaan zãnga bãnde: zĩis wa fenetr wɛɛr vãadã zugu, kood sũur sẽn pãrge, bĩnd sẽn tar koom wa tiig tom kood sũurã pugẽ.'
      reviewed: false
    dyu:
      claim: 'Kaba tumu fitininw (fall armyworm) bɛ kaba furaw sɔsɔ, ka yɔrɔ finmanw to minnu bɛ iko finɛtiri wɛrɛ. Tumu kɔrɔbaw bɛ dogo sɛnɛfɛn dusukun na, ka fura kuraw faran, ka nɔgɔ sumaman to min bɛ iko yiri mugu min bɛ wele frass.'
      short: 'Kaba tumuw taamashiyɛnw: yɔrɔw iko finɛtiri wɛrɛ furaw kan, sɛnɛfɛn dusukun faranen, nɔgɔ sumaman iko yiri mugu sɛnɛfɛn dusukun na.'
      reviewed: false
    wo:
      claim: 'Sóoboo mbóq (fall armyworm) yu ndaw dañuy sëgg xobu mbóq, bàyyi barab yu sew yu mel ni weeru palanteer. Sóoboo yu mag yi dañuy nëbbu ci xolu gàncax gi, xotti xob yu bees yi, te bàyyi tooj bu tooy bu mel ni pëndu garab bu ñuy wax frass.'
      short: 'Màndargay sóoboo mbóq: barab yu mel ni weer ci xob yi, xolu gàncax bu xottiku, tooj bu tooy bu mel ni pëndu garab ci xolu gàncax gi.'
      reviewed: false
    ee:
      claim: 'Bli ƒe ŋɔ (fall armyworm) suewo kpaa bli aŋgbawo, eye wogblea teƒe sue siwo le abe fesre ƒe ahuhɔ̃e ene. Ŋɔ gãwo ɣlaa wo ɖokui ɖe nukuku la ƒe dzi me, wovuvua aŋgba yeyewo, eye wogblea mi si fa abe ati ƒe ke ene si woyɔna be frass.'
      short: 'Bli ƒe ŋɔ ƒe dzesiwo: teƒe siwo le abe ahuhɔ̃e ene le aŋgbawo dzi, nukuku ƒe dzi si vuvu, mi si fa abe ati ƒe ke ene le nukuku ƒe dzi me.'
      reviewed: false
    ak:
      claim: 'Aburow sumpii (fall armyworm) nketewa twitwa aburow nhaban, na wogyaw mmeae a ɛyɛ tratraa te sɛ mpoma ahwehwɛ. Wɔn a wɔanyin no hintaw afifide no koma mu, wɔtetew nhaban foforo, na wogyaw ebin a ɛyɛ fɔkyee te sɛ dua mfuturo a wɔfrɛ no frass.'
      short: 'Aburow sumpii nsɛnkyerɛnne: mmeae te sɛ mpoma ahwehwɛ wɔ nhaban so, afifide koma a atetew, ebin a ɛyɛ fɔkyee te sɛ dua mfuturo wɔ afifide koma mu.'
      reviewed: false
    ln:
      claim: 'Banzoto ya moke ya masango (fall armyworm) epalolaka nkasa ya masango, etikaka bisika ya pete lokola talatala ya lininisa. Banzoto minene ebombanaka na motema ya bilona, epasolaka nkasa ya sika, mpe etikaka nyei ya mai lokola putulu ya nzete oyo babengaka frass.'
      short: 'Bilembo ya banzoto ya masango: bisika lokola talatala na nkasa, motema ya bilona epasuki, nyei ya mai lokola putulu ya nzete na motema ya bilona.'
      reviewed: false
    lg:
      claim: 'Ensowera za kasooli (fall armyworm) ento zikolokota ebikoola bya kasooli, ne zireka amabala amalungi ng''endabirwamu y''eddirisa. Ensowera ennene zeekweka mu mutima gw''ekirime, ziyuza ebikoola ebito, era zireka obubi obubisi obufaanana ng''enfuufu y''omuti obuyitibwa frass.'
      short: 'Obubonero bw''ensowera za kasooli: amabala ng''endabirwamu ku bikoola, omutima gw''ekirime ogwayuziddwa, obubi obubisi ng''enfuufu y''omuti mu mutima gw''ekirime.'
      reviewed: false
    rn:
      claim: 'Inkongwa ntoya (fall armyworm) zihomba amababi y''ibigori, zigasiga ahantu hato hasa n''ikirahuri c''idirisha. Inkongwa nkuru zinyegeza mu mutima w''ikimera, zigacagagura amababi mato, kandi zigasiga amase atose asa n''ifu y''igiti yitwa frass.'
      short: 'Ibimenyetso vy''inkongwa: ahantu hasa n''ikirahuri ku mababi, umutima w''ikimera wacagaguritse, amase atose asa n''ifu y''igiti mu mutima w''ikimera.'
      reviewed: false
    rw:
      claim: 'Nkongwa nto (fall armyworm) zihomboka amababi y''ibigori, zigasiga ahantu hato hasa n''ikirahure cy''idirishya. Nkongwa nkuru zihisha mu mutima w''igihingwa, zigacagagura amababi mato, kandi zigasiga amase atose asa n''ifu y''igiti yitwa frass.'
      short: 'Ibimenyetso bya nkongwa: ahantu hasa n''ikirahure ku mababi, umutima w''igihingwa wacagaguritse, amase atose asa n''ifu y''igiti mu mutima w''igihingwa.'
      reviewed: false
    bem:
      claim: 'Ifishishi ifinono fya mataba (fall armyworm) filapala amabula ya mataba, ukushiya utubala utunono nge cilolo ca pa windo. Ifishishi ifikalamba filabelama mu mutima wa cilimwa, filalepula amabula ayapya, kabili filashiya imyanda iyatalala nge lufu lwa muti iyo beta ati frass.'
      short: 'Ifishibilo fya fishishi fya mataba: utubala nge cilolo pa mabula, umutima wa cilimwa uwalepuka, imyanda iyatalala nge lufu lwa muti mu mutima.'
      reviewed: false
    ny:
      claim: 'Mbozi zazing''ono za chimanga (fall armyworm) zimakwangula masamba a chimanga, kusiya mawanga opyapyala ngati galasi la zenera. Mbozi zazikulu zimabisala mumtima wa mbewu, zimang''amba masamba atsopano, ndipo zimasiya ndowe zonyowa ngati utuchi zotchedwa frass.'
      short: 'Zizindikiro za mbozi za chimanga: mawanga ngati galasi pa masamba, mtima wa mbewu wong''ambika, ndowe zonyowa ngati utuchi mumtima wa mbewu.'
      reviewed: false
    sn:
      claim: 'Makonye madiki egonye rechibage (fall armyworm) anokwenya mashizha echibage, achisiya mavara matete akaita segirazi rewindo. Makonye makuru anovanda mumoyo wechirimwa, anobvarura mashizha matsva, uye anosiya tsvina nyoro yakaita seuswa hwemuti inonzi frass.'
      short: 'Zviratidzo zvegonye rechibage: mavara akaita segirazi pamashizha, moyo wechirimwa wakabvaruka, tsvina nyoro yakaita seuswa hwemuti mumoyo wechirimwa.'
      reviewed: false
    ts:
      claim: 'Swivungu swintsongo swa xivungu xa mavele (fall armyworm) swi kwecula matluka ya mavele, swi siya swivati swo ondza swo fana na nghilazi ya fasitere. Swivungu leswikulu swi tumbela embilwini ya ximila, swi handzula matluka lamantshwa, naswona swi siya nyanyu wa mati wo fana na ntshuri wa ntsandza lowu vitaniwaka frass.'
      short: 'Swikombiso swa xivungu xa mavele: swivati swo fana na nghilazi eka matluka, mbilu ya ximila leyi handzukeke, nyanyu wa mati wo fana na ntshuri wa ntsandza.'
      reviewed: false
    tn:
      claim: 'Diboko tse dinnye tsa seboko sa mmidi (fall armyworm) di gogola matlhare a mmidi, di tlogela matheba a a tshesane a a jaaka galase ya fensetere. Diboko tse dikgolo di iphitlha mo pelong ya semela, di gagola matlhare a masha, mme di tlogela masepa a metsi a a jaaka lorole lwa logong a a bidiwang frass.'
      short: 'Matshwao a seboko sa mmidi: matheba a a jaaka galase mo matlhareng, pelo ya semela e e gagogileng, masepa a metsi a a jaaka lorole lwa logong.'
      reviewed: false
    st:
      claim: 'Diboko tse nyane tsa seboko sa poone (fall armyworm) di hohla makgasi a poone, di siya matheba a tshesane a kang kgalase ya fensetere. Diboko tse kgolo di ipata pelong ya semela, di tabola makgasi a matjha, mme di siya mantle a metsi a kang lerole la lehong a bitswang frass.'
      short: 'Matshwao a seboko sa poone: matheba a kang kgalase makgasing, pelo ya semela e tabohileng, mantle a metsi a kang lerole la lehong.'
      reviewed: false
    af:
      claim: 'Jong herfsruspes skraap mielieblare en laat dun, vensteragtige kolle. Ouer ruspes kruip weg in die hart van die plant, skeur die jong blare en laat nat, saagselagtige mis wat frass genoem word.'
      short: 'Herfsruspe-tekens: vensteragtige kolle op blare, geskeurde plantharte, nat saagselagtige mis in die hart van die plant.'
      reviewed: false
    xh:
      claim: 'Izibungu zesibungu sombona (fall armyworm) ezincinci zikrwela amagqabi ombona, zishiye amabala amancinci afana neglasi yefestile. Izibungu ezindala zizimela entliziyweni yesityalo, zikrazula amagqabi amatsha, kwaye zishiya ilindle elimanzi elifana nomgubo womthi elibizwa ngokuba yi-frass.'
      short: 'Iimpawu zesibungu sombona: amabala afana neglasi kumagqabi, intliziyo yesityalo ekrazukileyo, ilindle elimanzi elifana nomgubo womthi.'
      reviewed: false
    zu:
      claim: 'Izibungu zesibungu sommbila (fall armyworm) ezisencane ziklwebha amaqabunga ommbila, zishiye amabala amancane afana nengilazi yefasitela. Izibungu ezindala zicasha enhliziyweni yesitshalo, zidabula amaqabunga amasha, futhi zishiya indle emanzi efana nomgubo wokhuni ebizwa ngokuthi yi-frass.'
      short: 'Izimpawu zesibungu sommbila: amabala afana nengilazi emaqabungeni, inhliziyo yesitshalo edabukile, indle emanzi efana nomgubo wokhuni.'
      reviewed: false
    pcm:
      claim: 'Young fall armyworm dey scrape maize leaf and leave thin spots like window glass. Big ones dey hide for the middle of the plant, dey tear the young leaves, and dey leave wet poo like sawdust wey dem dey call frass.'
      short: 'Armyworm signs: spots like window glass for leaf, torn middle of plant, wet poo like sawdust for the middle of plant.'
      reviewed: false
    ig:
      claim: 'Ikpuru ọka (fall armyworm) ndị na-eto eto na-akpacha akwụkwọ ọka, na-ahapụ ebe dị gịrịgịrị dịka iko windo. Ikpuru ndị tozuru etozu na-ezo n''etiti osisi, na-adọwa akwụkwọ na-eto eto, na-ahapụkwa nsị mmiri mmiri dịka ntụ osisi a na-akpọ frass.'
      short: 'Akara ikpuru ọka: ebe dịka iko windo n''akwụkwọ, etiti osisi adọwara adọwa, nsị mmiri mmiri dịka ntụ osisi n''etiti osisi.'
      reviewed: false
    yo:
      claim: 'Awọn idin kokoro agbado (fall armyworm) kekere n ha ewe agbado ti wọn si fi aaye tinrin bi gilaasi ferese silẹ. Awọn idin agba n fara pamọ si aarin ọgbin, wọn n fa awọn ewe ọdọ ya, wọn si n fi igbẹ tutu bi iyẹfun igi ti a n pe ni frass silẹ.'
      short: 'Ami kokoro agbado: aaye bi gilaasi ferese lori ewe, aarin ọgbin ti a fa ya, igbẹ tutu bi iyẹfun igi ni aarin ọgbin.'
      reviewed: false
    ha:
      claim: 'Ƙananan tsutsotsin masara (fall armyworm) suna kankare ganyen masara su bar wurare sirara kamar gilashin taga. Manyan tsutsotsi suna ɓoyewa a cikin tsakiyar shukar, suna yayyaga sabbin ganye kuma suna barin kashi mai danshi kamar garin katako da ake kira frass.'
      short: 'Alamun tsutsar masara: wurare kamar gilashin taga a kan ganye, tsakiyar shuka da aka yayyaga, kashi mai danshi kamar garin katako a tsakiyar shuka.'
      reviewed: false
  source: ICIPE, Fall armyworm identification, management and control; CIFOR-ICRAF, Fall Armyworm guide
