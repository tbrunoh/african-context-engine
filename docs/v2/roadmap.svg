  <text x="630.0" y="212" class="sans" font-size="13" fill="#56636A">Jun to Aug 2027</text>
  <circle cx="634.0" cy="239.5" r="3" fill="#364E3C"/>
  <text x="646.0" y="244" class="sans" font-size="13.5" fill="#3E4B52">Planting, soil, pests</text>
  <circle cx="634.0" cy="263.5" r="3" fill="#364E3C"/>
  <text x="646.0" y="268" class="sans" font-size="13.5" fill="#3E4B52">Prices, pregnancy care</text>
  <circle cx="634.0" cy="287.5" r="3" fill="#364E3C"/>
  <text x="646.0" y="292" class="sans" font-size="13.5" fill="#3E4B52">SIM swap, scam waves</text>
  <circle cx="634.0" cy="311.5" r="3" fill="#364E3C"/>
  <text x="646.0" y="316" class="sans" font-size="13.5" fill="#3E4B52">Grounding API, partner</text>
  <line x1="630.0" y1="342" x2="850.0" y2="342" stroke="#E8E2D9"/>
  <text x="630.0" y="366" class="sans" font-size="13.5" fill="#253239" font-weight="700">Gate: services beat the</text>
  <text x="630.0" y="386" class="sans" font-size="13" fill="#56636A">decision benchmark</text>
  <rect x="888.0" y="132" width="264.0" height="272" rx="14" fill="#EDF5F4" stroke="#006B69" stroke-opacity="0.8"/>
  <text x="910.0" y="162" class="mono" font-size="12" fill="#8F5E24" font-weight="700" letter-spacing="2">PHASE 4</text>
  <text x="910.0" y="190" class="sans" font-size="19" fill="#253239" font-weight="700">Reach</text>
  <text x="910.0" y="212" class="sans" font-size="13" fill="#56636A">Sep to Nov 2027</text>
  <circle cx="914.0" cy="239.5" r="3" fill="#BE823C"/>
  <text x="926.0" y="244" class="sans" font-size="13.5" fill="#3E4B52">French, Hausa, Yoruba</text>
  <circle cx="914.0" cy="263.5" r="3" fill="#BE823C"/>
  <text x="926.0" y="268" class="sans" font-size="13.5" fill="#3E4B52">Opt in alerts</text>
  <circle cx="914.0" cy="287.5" r="3" fill="#BE823C"/>
  <text x="926.0" y="292" class="sans" font-size="13.5" fill="#3E4B52">Health worker assist</text>
  <circle cx="914.0" cy="311.5" r="3" fill="#BE823C"/>
  <text x="926.0" y="316" class="sans" font-size="13.5" fill="#3E4B52">Partners live</text>
  <line x1="910.0" y1="342" x2="1130.0" y2="342" stroke="#E8E2D9"/>
  <text x="910.0" y="366" class="sans" font-size="13.5" fill="#253239" font-weight="700">Gate: V2 targets met</text>
  <text x="910.0" y="386" class="sans" font-size="13" fill="#56636A">V2.0 release</text>
  <line x1="48" y1="446" x2="1152" y2="446" stroke="#006B69" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M312.0 436 l10 10 l-10 10 l-10 -10 z" fill="#006B69"/>
  <text x="312.0" y="484" class="sans" font-size="13" fill="#56636A" text-anchor="middle">end Feb</text>
  <path d="M592.0 436 l10 10 l-10 10 l-10 -10 z" fill="#006B69"/>
  <text x="592.0" y="484" class="sans" font-size="13" fill="#56636A" text-anchor="middle">end May</text>
  <path d="M872.0 436 l10 10 l-10 10 l-10 -10 z" fill="#364E3C"/>
  <text x="872.0" y="484" class="sans" font-size="13" fill="#56636A" text-anchor="middle">end Aug</text>
  <path d="M1142.0 436 l10 10 l-10 10 l-10 -10 z" fill="#BE823C"/>
  <text x="1152" y="484" class="sans" font-size="13" fill="#253239" font-weight="700" text-anchor="end">V2.0, Nov</text>
