      short: 'Damu wakati wa ujauzito: nenda kituo cha afya mara moja. Inaweza kuua ndani ya saa chache.'
    fr:
      claim: Un saignement pendant la grossesse exige un transport immédiat vers un centre de santé. Une femme, surtout
        si elle est anémiée, peut mourir en quelques heures.
      short: 'Saignement pendant la grossesse : allez immédiatement au centre de santé. Il peut tuer en quelques heures.'
