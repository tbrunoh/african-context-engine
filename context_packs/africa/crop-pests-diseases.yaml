    om:
      claim: 'Firii timaatimii miidhame dafaatii buqqisaa balleessaa, biqiltuuwwan biroo ilbiisa kana keessummeessan naannoo maasii jiranis qulqulleessaa. Kiyyoon feeroomoonii ilbiisota kana qabata, oomishaaleen niimii ykn Bacillus thuringiensis irratti hundaa''anis gargaaruu danda''u. Biifamni idilee yeroo baay''ee hin hojjetu, sababni isaas ilmaan sun baala keessa nyaatu; ilbiisichis dafee qoricha ni dandamata; kanaaf biifuu dura ogeessa misooma qonnaa gaafadhaa.'
