- id: police-gbv-line
  claim: The Uganda Police free line for reporting gender based violence and violence against children is 0800 199 195.
  short: 'Gender based violence or a child at risk in Uganda: call police on 0800 199 195, free.'
  topic: emergency_contacts
  vertical: safety
  kind: action
  keywords:
  - violence
  - abuse
  - rape
  - assault
  - beaten
  - gbv
  - viol
  - violences
  - conjugale
  - dhuluma
  - ubakaji
  - kupigwa
  contacts:
  - label: Police GBV and child protection line
    number: 0800 199 195
    queues:
    - gbv
    - violence
    - child_protection
    free: true
  translations:
    sw:
      claim: Simu ya bure ya Polisi wa Uganda ya kuripoti dhuluma za kijinsia na ukatili dhidi ya watoto ni 0800 199
