<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="Five pillars on one foundation: decisions, voice, signed facts, Scam Shield 2 and grounding, on a foundation of measured safety.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#050B1C"/><stop offset="100%" stop-color="#0B2A3F"/></linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0E7490"/><stop offset="100%" stop-color="#1E40AF"/></linearGradient>
    <linearGradient id="enginev" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0E7490"/><stop offset="100%" stop-color="#1E40AF"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2DD4BF"/></marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 5 6; animation: f 10s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -110; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="470" rx="18" fill="url(#bg)"/>
  <text x="48" y="54" class="mono" font-size="12" fill="#2DD4BF" letter-spacing="3">V2 PILLARS</text>
  <text x="48" y="84" class="sans" font-size="22" fill="#FFFFFF" font-weight="700">Five pillars on one foundation make ACE useful and trusted.</text>
  <rect x="48" y="112" width="1104" height="56" rx="12" fill="url(#engine)"/>
  <text x="600" y="147" class="sans" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">The open decision layer between public models and people</text>
  <path d="M152.0 168 L152.0 188" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="48.0" y="188" width="208.0" height="176" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="68.0" y="218" class="mono" font-size="12" fill="#2DD4BF" font-weight="700" letter-spacing="1">01</text>
  <text x="68.0" y="246" class="sans" font-size="18" fill="#FFFFFF" font-weight="700">Decisions</text>
  <text x="68.0" y="276" class="sans" font-size="13" fill="#CBD5E1">Twelve services on</text>
  <text x="68.0" y="296" class="sans" font-size="13" fill="#CBD5E1">named public data</text>
  <rect x="68.0" y="324" width="64" height="22" rx="11" fill="#5EEAD4" fill-opacity="0.16" stroke="#5EEAD4" stroke-opacity="0.7"/>
  <text x="100.0" y="339" class="mono" font-size="11" fill="#5EEAD4" font-weight="700" text-anchor="middle" letter-spacing="1">USEFUL</text>
  <path d="M376.0 168 L376.0 188" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="272.0" y="188" width="208.0" height="176" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="292.0" y="218" class="mono" font-size="12" fill="#2DD4BF" font-weight="700" letter-spacing="1">02</text>
  <text x="292.0" y="246" class="sans" font-size="18" fill="#FFFFFF" font-weight="700">Voice</text>
  <text x="292.0" y="276" class="sans" font-size="13" fill="#CBD5E1">Swahili, Hausa, Yoruba,</text>
  <text x="292.0" y="296" class="sans" font-size="13" fill="#CBD5E1">French and English</text>
  <rect x="292.0" y="324" width="85" height="22" rx="11" fill="#5EEAD4" fill-opacity="0.16" stroke="#5EEAD4" stroke-opacity="0.7"/>
  <text x="334.5" y="339" class="mono" font-size="11" fill="#5EEAD4" font-weight="700" text-anchor="middle" letter-spacing="1">REACHABLE</text>
  <path d="M600.0 168 L600.0 188" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="496.0" y="188" width="208.0" height="176" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="516.0" y="218" class="mono" font-size="12" fill="#2DD4BF" font-weight="700" letter-spacing="1">03</text>
  <text x="516.0" y="246" class="sans" font-size="18" fill="#FFFFFF" font-weight="700">Signed facts</text>
  <text x="516.0" y="276" class="sans" font-size="13" fill="#CBD5E1">Signed by publishers,</text>
  <text x="516.0" y="296" class="sans" font-size="13" fill="#CBD5E1">rechecked and dated</text>
  <rect x="516.0" y="324" width="50" height="22" rx="11" fill="#5EEAD4" fill-opacity="0.16" stroke="#5EEAD4" stroke-opacity="0.7"/>
  <text x="541.0" y="339" class="mono" font-size="11" fill="#5EEAD4" font-weight="700" text-anchor="middle" letter-spacing="1">TRUE</text>
  <path d="M824.0 168 L824.0 188" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="720.0" y="188" width="208.0" height="176" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="740.0" y="218" class="mono" font-size="12" fill="#2DD4BF" font-weight="700" letter-spacing="1">04</text>
  <text x="740.0" y="246" class="sans" font-size="18" fill="#FFFFFF" font-weight="700">Scam Shield 2</text>
  <text x="740.0" y="276" class="sans" font-size="13" fill="#CBD5E1">SIM swap signal and</text>
  <text x="740.0" y="296" class="sans" font-size="13" fill="#CBD5E1">scam wave warnings</text>
  <rect x="740.0" y="324" width="50" height="22" rx="11" fill="#5EEAD4" fill-opacity="0.16" stroke="#5EEAD4" stroke-opacity="0.7"/>
  <text x="765.0" y="339" class="mono" font-size="11" fill="#5EEAD4" font-weight="700" text-anchor="middle" letter-spacing="1">TRUE</text>
  <path d="M1048.0 168 L1048.0 188" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="944.0" y="188" width="208.0" height="176" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="964.0" y="218" class="mono" font-size="12" fill="#2DD4BF" font-weight="700" letter-spacing="1">05</text>
  <text x="964.0" y="246" class="sans" font-size="18" fill="#FFFFFF" font-weight="700">Grounding</text>
  <text x="964.0" y="276" class="sans" font-size="13" fill="#CBD5E1">One API or MCP call,</text>
  <text x="964.0" y="296" class="sans" font-size="13" fill="#CBD5E1">signed citations</text>
  <rect x="964.0" y="324" width="64" height="22" rx="11" fill="#5EEAD4" fill-opacity="0.16" stroke="#5EEAD4" stroke-opacity="0.7"/>
  <text x="996.0" y="339" class="mono" font-size="11" fill="#5EEAD4" font-weight="700" text-anchor="middle" letter-spacing="1">SHARED</text>
  <rect x="48" y="384" width="1104" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="600" y="416" class="sans" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">Foundation: measured safety and decision benchmarks, published every release</text>
</svg>
