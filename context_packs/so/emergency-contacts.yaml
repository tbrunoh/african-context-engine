- id: national-emergency
  claim: 'In Somalia, the Somali Red Crescent runs a free number for all emergency services: 446. You can also call 999 for
    an ambulance, 888 for the police and 555 for the fire service, but these lines can be unreliable.'
  short: 'Emergency in Somalia: call 446, free. Ambulance 999, police 888, fire 555.'
