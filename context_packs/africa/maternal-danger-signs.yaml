  translations:
    sw:
      claim: 'Mpeleke mama mjamzito hospitalini au kituo cha afya mara moja akiwa na dalili yoyote kati ya hizi: kutokwa
        na damu ukeni, degedege, maumivu makali ya kichwa pamoja na kutoona vizuri, homa na udhaifu wa kushindwa kuamka
        kitandani, maumivu makali ya tumbo, au kupumua kwa haraka au kwa shida.'
      short: 'Nenda kituo cha afya SASA kwa: damu, degedege, kichwa kikali na kutoona vizuri, homa na udhaifu, tumbo
        kuuma sana.'
    fr:
      claim: 'Emmenez immédiatement une femme enceinte à l''hôpital ou au centre de santé si elle présente l''un de ces
        signes : saignements vaginaux, convulsions, maux de tête sévères avec vision trouble, fièvre avec une faiblesse
        qui l''empêche de se lever, douleurs abdominales sévères, ou respiration rapide ou difficile.'
      short: 'Centre de santé MAINTENANT si : saignements, convulsions, maux de tête et vision trouble, fièvre et grande
        faiblesse, fortes douleurs au ventre.'
    pt:
      claim: 'Leve imediatamente uma mulher grávida a um hospital ou centro de saúde se tiver algum destes sinais: sangramento vaginal, convulsões ou ataques, dor de cabeça forte com visão turva, febre e fraqueza que a impede de sair da cama, dor forte na barriga, ou respiração rápida ou difícil.'
      short: 'Vá a uma unidade de saúde JÁ se houver: sangramento, convulsões, dor de cabeça forte com visão turva, febre e muita fraqueza, dor forte na barriga.'
      reviewed: false
    ar:
      claim: 'خذ المرأة الحامل إلى مستشفى أو مركز صحي فورًا إذا ظهرت عليها أي من هذه العلامات: نزيف مهبلي، أو تشنجات ونوبات، أو صداع شديد مع تشوش الرؤية، أو حمى مع ضعف شديد يمنعها من النهوض من السرير، أو ألم شديد في البطن، أو تنفس سريع أو صعب.'
      short: 'اذهبي إلى مرفق صحي الآن عند: النزيف، أو التشنجات، أو صداع شديد مع تشوش الرؤية، أو حمى وضعف شديد، أو ألم شديد في البطن.'
      reviewed: false
    am:
      claim: 'ነፍሰ ጡር ሴት ከሚከተሉት ምልክቶች አንዱ ካለባት ወዲያውኑ ወደ ሆስፒታል ወይም ጤና ጣቢያ ይውሰዷት፡ ከብልት የሚፈስ ደም፣ መንቀጥቀጥ ወይም የሚጥል፣ ከደብዛዛ እይታ ጋር ከባድ ራስ ምታት፣ ትኩሳትና ከአልጋ መነሳት የማያስችል ድካም፣ ከባድ የሆድ ሕመም፣ ወይም ፈጣን ወይም አስቸጋሪ አተነፋፈስ።'
      short: 'አሁኑኑ ወደ ጤና ተቋም ይሂዱ፡ ደም መፍሰስ፣ መንቀጥቀጥ፣ ከደብዛዛ እይታ ጋር ከባድ ራስ ምታት፣ ትኩሳትና ከፍተኛ ድካም፣ ከባድ የሆድ ሕመም።'
      reviewed: false
    om:
      claim: 'Dubartii ulfaa mallattoolee kanneen keessaa tokko illee yoo qabaatte battaluma sanatti hospitaala ykn buufata fayyaatti geessaa: dhiiga qaama saalaa irraa dhangala''u, qaamni raafamuu ykn kufuu, mataa dhukkubbii cimaa ijji ifa dhabuu wajjin, ho''a qaamaa fi dadhabbii siree irraa ka''uu dhabsiisu, garaa dhukkubbii cimaa, ykn hafuura saffisaa ykn rakkisaa.'
      short: 'AMMA dhaabbata fayyaa deemaa: dhiiga dhangala''u, raafama qaamaa, mataa dhukkubbii cimaa ija ifa dhabuu wajjin, ho''a fi dadhabbii cimaa, garaa dhukkubbii cimaa.'
      reviewed: false
    so:
      claim: 'Haweeneyda uurka leh isla markiiba geey isbitaal ama xarun caafimaad haddii ay leedahay mid ka mid ah calaamadahan: dhiig ka imanaya xubinta taranka, gariir ama suuxdin, madax xanuun daran oo ay la socoto aragti cakiran, qandho iyo daciifnimo aysan sariirta uga kici karin, calool xanuun daran, ama neefsasho degdeg ah ama adag.'
      short: 'HADDA aad xarun caafimaad: dhiig bax, gariir ama suuxdin, madax xanuun daran oo aragti cakiran leh, qandho iyo daciifnimo daran, calool xanuun daran.'
      reviewed: false
