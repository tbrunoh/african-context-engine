templates:
  safety.OPENERS.self_harm: "Akkas sitti dhagahamuu isaatti baay'ee gaddeera. Amma deeggarsa argachuu qabda. {numbers}"
  safety.OPENERS.maternal: "Kun rakkoo hatattamaa ulfaa ta'uu danda'a. Amma dhaabbata fayyaa dhihoo jirutti deemi. {numbers}"
  safety.OPENERS.poisoning: "Kun summaa'uu fakkaata. Amma gargaarsa yaalaa barbaadi, qodaa isaas qabadhu. {numbers}"
  safety.OPENERS.child_protection: "Daa'immi tokko balaa keessa jiraachuu danda'a. Maaloo amma gargaarsa barbaadi. {numbers}"
  safety.OPENERS.gbv: "Wanti kun sirra ga'uu isaatti gaddeera. Amma gargaarsa argachuu dandeessa. {numbers}"
  safety.OPENERS.health_urgent: "Kun hatattamaa fakkaata. Amma gargaarsa yaalaa barbaadi. {numbers}"
  safety.CALL_WORD: "Bilbili {numbers}"
  safety.OR_WORD: "ykn"
  safety.EMERGENCY_WORD: "hatattamaa"
  safety.FALLBACK_NUMBERS: "Lakkoofsa hatattamaa naannoo keetti bilbili ykn dhaabbata fayyaa dhihoo jirutti deemi."

  commands.TEXTS.help: "ACE qajeelfama naannoo mirkanaa'e kenna. Gaaffii gaafadhu. Ajajoota: GOWWOOMSA + ergaa mirkaneessuuf, GORSA + gorsa kee, MADDA, DABALATA, AFAAN + koodii (fkn AFAAN EN), HAQI odeeffannoo kee haquuf."
  commands.TEXTS.help_short: "ACE gaaffii gaafadhu. GOWWOOMSA + ergaa ni mirkaneessa. HAQI odeeffannoo kee ni haqa."
  commands.TEXTS.forgotten: "Xumurameera. Wanti ACE lakkoofsa kana irratti qabu hundi haqameera."
  commands.TEXTS.stopped: "Yoo irra deebitee hin barreessine ACE irraa ergaan biraa sin ga'u. Odeeffannoo kee haquuf HAQI ergi."
  commands.TEXTS.language: "AFAAN fi koodii ergi:"
  commands.TEXTS.tip_thanks: "Galatoomi. Gorsi kee ogeessaan akka ilaalamuuf kuufameera. Hanga mirkanaa'utti hin qoodamu."
  commands.TEXTS.tip_usage: "GORSA jedhii gorsa kee ergi, fakkeenyaaf: GORSA baalli niimii raammoo midhaanii ni ittisa."
  commands.TEXTS.scam_usage: "GOWWOOMSA jedhii ergaa itti shakkitu ergi, ACE ni mirkaneessa."
  commands.TEXTS.no_sources: "Deebiin dura madda isaa agarsiisu hin jiru. Jalqaba gaaffii gaafadhu."
  commands.TEXTS.no_more: "Mata duree kana irratti kan ACE qabu kana qofa. Gaaffii biraa gaafadhu ykn GARGAARSA ergi."
  commands.TEXTS.clarify: "ACE waa'ee kanaa qajeelfama mirkanaa'e hin qabu. ACE kana irratti gargaaruu danda'a: {topics}. Beekumsa yaaduuf GORSA ergi."
  commands.TEXTS.unread: "ACE afaan kana ammallee hin dubbisu. Maaloo isaan kana keessaa tokkoon barreessaa: {languages}."

