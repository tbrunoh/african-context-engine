# Yoruba for Nigeria and Benin, in the standard Latin script with the dotted letters ẹ, ọ and ṣ. Tone marks are left
# out, as most people type Yoruba on phones. Drafted for ACE 2.3. Awaiting review by fluent speakers and, for the
# safety phrases, by clinicians.
