      short: 'Mosaic ya tute: takuli umuti uubundapa. Kuuleni, umisheni no kooca ifilimwa ifilwele; byaleni ifimuti fya filimwa ifyakosa; moneni cila mulungu.'
      reviewed: false
    ny:
      claim: 'Palibe mankhwala ochiza matenda a mosaic a chinangwa. Yang''anani mbewu sabata iliyonse m''miyezi iwiri kapena itatu yoyambirira. Zulani mbewu zodwala, zichotseni m''munda, ziumitseni padzuwa ndi kuziwotcha, ndipo m''malo mwake ikani timitengo ta chinangwa tathanzi totalika 15 mpaka 20 cm kuchokera ku mbewu zopanda zizindikiro. Musabzale chinangwa pafupi ndi munda wodwala.'
      short: 'Mosaic ya chinangwa: palibe mankhwala ochiza. Zulani, umitsani ndi kuwotcha mbewu zodwala; bzalani timitengo ta mbewu zathanzi; yang''anani sabata iliyonse.'
      reviewed: false
    sn:
      claim: 'Hapana kemikari inorapa chirwere chemosaic chemufarinya. Ongorora zvirimwa vhiki rega rega mumwedzi miviri kusvika mitatu yekutanga. Dzura zvirimwa zvine chirwere, zvibvise mumunda, zviomese muzuva wozvipisa, uye uzvitsive nemadzinde emufarinya ane utano akareba 15 kusvika 20 cm kubva kuzvirimwa zvisingaratidzi zviratidzo. Usadyara mufarinya pedyo nemunda une chirwere.'
      short: 'Mosaic yemufarinya: hapana kemikari inoirapa. Dzura, omesa upise zvirimwa zvine chirwere; dyara madzinde ezvirimwa zvine utano; ongorora vhiki rega rega.'
      reviewed: false
    ts:
      claim: 'A ku na khemikhali leyi tshungulaka vuvabyi bya mosaic bya mufaki. Kambela swimila vhiki na vhiki eka tin''hweti timbirhi ku ya eka tinharhu to sungula. Tsuvula swimila leswi vabyaka, u swi humesa epurasini, u swi omisa exidzedzeni u swi hisa, u swi siva hi swirhabyani swa mufaki leswi hanyeke kahle swa vulehi bya 15 ku ya eka 20 cm ku suka eka swimila leswi nga kombisiki swikombiso. U nga byali mufaki ekusuhi na nsimu leyi nga na vuvabyi.'
      short: 'Mosaic ya mufaki: a ku na khemikhali leyi byi tshungulaka. Tsuvula u hisa swimila leswi vabyaka; byala swirhabyani swa swimila leswi hanyeke; kambela vhiki.'
      reviewed: false
    tn:
      claim: 'Ga go na khemikale e e alafang bolwetse jwa mosaic jwa kasava. Tlhatlhoba dijalo beke le beke mo dikgweding di le pedi go ya go tharo tsa ntlha. Ntsha dijalo tse di lwalang, o di ntshe mo tshimong, o di omise mo letsatsing morago o di fise, mme o di emisetse ka dikutu tse di itekanetseng tsa kasava tsa boleele jwa 15 go ya go 20 cm go tswa mo dijalong tse di sa bontsheng matshwao. O se ka wa jala kasava gaufi le tshimo e e nang le bolwetse.'
      short: 'Mosaic ya kasava: ga go na khemikale e e e alafang. Ntsha, omisa o fise dijalo tse di lwalang; jala ka dikutu tsa dijalo tse di itekanetseng; tlhatlhoba.'
      reviewed: false
    st:
      claim: 'Ha ho khemikhale e phekolang lefu la mosaic la kasava. Hlahloba dimela beke le beke dikgweding tse pedi ho isa ho tse tharo tsa pele. Ntsha dimela tse kulang, o di ntshe polasing, o di omise letsatsing ebe o a di tjhesa, mme o di nkele sebaka ka dikutu tse phetseng hantle tsa kasava tse bolelele ba 15 ho isa ho 20 cm ho tswa dimeleng tse sa bontsheng matshwao. O se ke wa jala kasava haufi le tshimo e nang le lefu.'
      short: 'Mosaic ya kasava: ha ho khemikhale e e phekolang. Ntsha, omisa o tjhese dimela tse kulang; jala ka dikutu tsa dimela tse phetseng hantle; hlahloba beke le beke.'
      reviewed: false
    af:
      claim: 'Geen chemikalie genees kassawe-mosaïeksiekte nie. Kyk elke week na die plante vir die eerste twee tot drie maande. Trek siek plante uit, neem dit uit die land, droog dit in die son en verbrand dit, en vervang dit met gesonde kassawestingels van 15 tot 20 cm van plante sonder tekens. Moenie kassawe langs ''n besmette land plant nie.'
      short: 'Kassawe-mosaïek: geen chemikalie genees dit nie. Trek siek plante uit, droog en verbrand dit; herplant met stingels van gesonde plante; kyk elke week.'
      reviewed: false
    xh:
      claim: 'Akukho khemikhali inyanga isifo se-mosaic somdumbula. Hlola izityalo veki nganye kwiinyanga ezimbini ukuya kwezintathu zokuqala. Nyothula izityalo ezinesifo, uzikhuphe efama, uzomise elangeni uze uzitshise, kwaye uzithathele indawo ngeziqu zomdumbula eziphilileyo ezili-15 ukuya kuma-20 cm ubude ezivela kwizityalo ezingabonisi mpawu. Musa ukutyala umdumbula kufutshane nentsimi enesifo.'
      short: 'I-mosaic yomdumbula: akukho khemikhali eyinyangayo. Nyothula, womise utshise izityalo ezinesifo; tyala iziqu ezivela kwizityalo eziphilileyo; hlola veki nganye.'
      reviewed: false
    zu:
      claim: 'Alikho ikhemikhali elelapha isifo se-mosaic somdumbula. Hlola izitshalo masonto onke ezinyangeni ezimbili kuya kwezintathu zokuqala. Siphule izitshalo ezinesifo, uzikhiphe epulazini, uzomise elangeni bese uyazishisa, futhi uzithathele indawo ngeziqu zomdumbula eziphilile ezingu-15 kuya ku-20 cm ubude ezivela ezitshalweni ezingakhombisi zimpawu. Ungatshali umdumbula eduze kwensimu enesifo.'
      short: 'I-mosaic yomdumbula: alikho ikhemikhali eyelaphayo. Siphule ushise izitshalo ezinesifo; tshala iziqu ezivela ezitshalweni eziphilile; hlola masonto onke.'
      reviewed: false
    pcm:
      claim: 'No chemical dey cure cassava mosaic disease. Check the plants every week for the first two to three months. Pull out sick plants, carry them comot from the farm, dry them for sun and burn them, and replace them with healthy cassava stem wey long 15 to 20 cm from plant wey no show sign. No plant cassava near farm wey get the disease.'
      short: 'Cassava mosaic: no chemical fit cure am. Pull out, dry and burn sick plants; plant again with stem from healthy plant; check every week.'
      reviewed: false
    ig:
      claim: 'Ọ dịghị ọgwụ kemịkal na-agwọ ọrịa mosaic akpụ. Lelee osisi kwa izu n''ime ọnwa abụọ ruo atọ mbụ. Fopụta osisi nwere ọrịa, buru ha pụọ n''ugbo, kpọnwụọ ha n''anyanwụ ma kpọọ ha ọkụ, ma jiri osisi akpụ dị mma dị ogologo 15 ruo 20 cm site na osisi na-egosighi akara dochie ha. Akụla akpụ n''akụkụ ugbo nwere ọrịa ahụ.'
      short: 'Mosaic akpụ: ọ dịghị kemịkal na-agwọ ya. Fopụta, kpọnwụọ ma kpọọ osisi nwere ọrịa ọkụ; kụgharịa site na osisi dị mma; lelee kwa izu.'
      reviewed: false
    yo:
      claim: 'Ko si oogun kẹmika ti o n ṣẹgun arun mosaic gbaguda. Ṣayẹwo awọn ọgbin ni gbogbo ọsẹ fun oṣu meji si mẹta akọkọ. Fa awọn ọgbin ti o ni arun tu, gbe wọn jade kuro ninu oko, sa wọn ninu oorun ki o si sun wọn, ki o si fi igi gbaguda ti o ni ilera ti o gun to 15 si 20 cm lati inu ọgbin ti ko fi ami han rọpo wọn. Ma ṣe gbin gbaguda lẹgbẹẹ oko ti o ni arun naa.'
      short: 'Mosaic gbaguda: ko si kẹmika ti o wo o. Fa tu, sa ki o sun ọgbin ti o ni arun; tun gbin pẹlu igi lati ọgbin ti o ni ilera; ṣayẹwo ni ọsẹ kọọkan.'
      reviewed: false
    ha:
      claim: 'Babu maganin sinadari da ke kawar da cutar mosaic ta rogo. Ku duba shuke-shuke kowane mako a watanni biyu zuwa uku na farko. Ku tumɓuke shuke-shuke marasa lafiya, ku fitar da su daga gona, ku shanya su a rana ku ƙone su, sannan ku maye gurbinsu da yankan kara masu lafiya tsawon 15 zuwa 20 cm daga shukar da ba ta nuna alamu ba. Kada ku shuka rogo kusa da gonar da ke da cutar.'
      short: 'Mosaic na rogo: babu maganin sinadari. Ku tumɓuke, ku shanya ku ƙone shukar da ta kamu; ku shuka yankan kara daga shuka mai lafiya; ku duba kowane mako.'
      reviewed: false
