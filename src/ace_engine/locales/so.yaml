  safety.EMERGENCY_WORD: "degdeg"
  safety.FALLBACK_NUMBERS: "Wac lambarka degdegga ee deegaankaaga ama aad xarunta caafimaadka ee kuugu dhow."

  commands.TEXTS.help: "ACE wuxuu bixiyaa hagid maxalli ah oo la hubiyay. Su'aal weydii. Amarrada: KHIYAANO + fariin si loo hubiyo, TALO + taladaada, ILAHA, WAXBADAN, LUQAD + koodh (tusaale LUQAD EN), TIRTIR si xogtaada loo tirtiro."
  commands.TEXTS.help_short: "ACE su'aal weydii. KHIYAANO + fariin waa la hubiyaa. TIRTIR xogtaada ayuu tirtiraa."
  commands.TEXTS.forgotten: "Waa la dhammeeyay. Wax kasta oo ACE ka hayay lambarkan waa la tirtiray."
  commands.TEXTS.stopped: "Fariimo kale kama heli doontid ACE ilaa aad mar kale qorto. Dir TIRTIR si xogtaada loo tirtiro."
  commands.TEXTS.language: "Dir LUQAD iyo koodh:"
  commands.TEXTS.tip_thanks: "Mahadsanid. Taladaada waa la kaydiyay si khabiir u eego. Lama wadaagi doono ilaa la hubiyo."
  commands.TEXTS.tip_usage: "Dir TALO kadibna taladaada, tusaale: TALO caleenta geedka neem waxay ka hortagtaa dirxiga."
  commands.TEXTS.scam_usage: "Dir KHIYAANO kadibna fariinta aad ka shakisan tahay, ACE ayaa hubin doona."
  commands.TEXTS.no_sources: "Ma jiro jawaab hore oo ilaheeda la tusi karo. Marka hore su'aal weydii."
  commands.TEXTS.no_more: "Taasi waa waxa ACE ka hayo mawduucan hadda. Su'aal kale weydii ama dir CAAWIMAAD."
  commands.TEXTS.clarify: "ACE weli ma hayo hagid la hubiyay oo ku saabsan taas. ACE wuxuu ka caawin karaa: {topics}. Dir TALO si aad aqoon u soo jeediso."

