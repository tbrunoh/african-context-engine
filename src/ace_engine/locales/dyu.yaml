# Jula (Dyula) for Côte d'Ivoire and Burkina Faso, in the standard spelling with ɛ, ɔ, ɲ and ŋ, which SMS folds
# to e, o, ny and ng. Drafted for ACE 2.3 with lower confidence than most added languages: fluent speakers and, for
# the safety phrases, clinicians must review it first. Many speakers mix Jula with French, and the French safety
# phrases still apply to those messages.
