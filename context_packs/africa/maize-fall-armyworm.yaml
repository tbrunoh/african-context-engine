    am:
      claim: 'የፎል አርሚዎርም እጭ በራሱ ላይ የተገለበጠ Y ምልክት፣ ከመጨረሻው በፊት ባለው የሰውነቱ ክፍል ላይ ደግሞ በካሬ ቅርጽ የተደረደሩ አራት ጥቁር ነጥቦች አሉት።'
      short: 'የተምቹ እጭ፡ በራሱ ላይ የተገለበጠ Y፣ ከጭራው አጠገብ በካሬ ቅርጽ አራት ጥቁር ነጥቦች።'
      reviewed: false
    om:
      claim: 'Ilmaan raammoo loltuu mataa isaa irratti mallattoo Y garagalfame, kutaa qaamaa isaa isa dhumaa duraa irratti immoo tuqaalee dukkanaa''oo afur bifa roga afurii qindaa''an qaba.'
      short: 'Ilmaan raammoo loltuu: Y garagalfame mataa irratti, tuqaa dukkanaa''aa afur bifa roga afurii eegee bira.'
      reviewed: false
    so:
      claim: 'Dirxiga fall armyworm wuxuu madaxa ku leeyahay calaamad Y ah oo rogan, iyo afar dhibcood oo madow oo afargeesle ahaan u habaysan qaybta jirkiisa ee ka horreysa tan ugu dambaysa.'
