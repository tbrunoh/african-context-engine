    pcm:
      claim: 'Tomato leaf miner worms dey dig wide shiny silver paths inside tomato leaf, wey go turn brown and dry. Dem also dey bore inside the stem and fruit, and dem dey leave exit hole for the fruit. The worms be green to pink, long reach 9 mm, with black line behind the head. Garden egg, pepper and Irish potato fit also catch am.'
      short: 'Tomato leaf miner signs: shiny silver paths for leaf wey turn brown, holes for fruit, small green to pink worm with black line.'
