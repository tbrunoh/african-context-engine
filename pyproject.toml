[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ace-engine"
version = "2.4.1"
description = "The African Context Engine: checked, local, citable knowledge for Africa on any phone (USSD, SMS/RCS, voice, WhatsApp and MCP), with six decision services, for 34 African countries in 32 languages"
readme = "README.md"
license = "Apache-2.0 AND CC-BY-4.0 AND CC-BY-SA-4.0 AND ODbL-1.0"  # code; packs; language profiles; ODbL snapshots (see NOTICE)
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Tom Bruno" }]
keywords = ["africa", "ussd", "sms", "rcs", "whatsapp", "voice", "mcp", "context", "agriculture", "health", "weather", "early warning", "market prices", "mpesa", "swahili", "french", "portuguese", "arabic", "amharic", "oromo", "somali", "hausa", "yoruba", "igbo", "zulu", "xhosa", "afrikaans", "shona", "kinyarwanda", "lingala", "twi", "ewe", "wolof", "tigrinya", "speech", "text to speech", "waxal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Natural Language :: French",
  "Natural Language :: Portuguese",
  "Natural Language :: Arabic",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.2", "uvicorn>=0.30"]
google = ["google-auth[requests]>=2.20"]
serve = ["gunicorn>=23"]
cloud = ["google-cloud-firestore>=2.16"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/tbrunoh/african-context-engine"
Issues = "https://github.com/tbrunoh/african-context-engine/issues"

[project.scripts]
ace = "ace_engine.cli:main"
ace-demo = "ace_engine.cli:demo_main"
ace-mcp = "ace_engine.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ace_engine"]

[tool.hatch.build.targets.wheel.force-include]
"context_packs" = "ace_engine/context_packs"
"snapshots" = "ace_engine/data/snapshots"

[tool.hatch.build.targets.sdist]
exclude = ["PUBLISH.sh", "benchmark/.waxal_cache", "benchmark/langid/.cache", "tips.jsonl", ".env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
