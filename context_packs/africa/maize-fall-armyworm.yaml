- id: life-cycle
  claim: The fall armyworm life cycle takes about four weeks, so one maize season can be hit by three generations. Keep
    scouting through the season.
  short: Armyworm life cycle is about 4 weeks, so one season can bring 3 generations. Keep scouting.
