    ar:
      claim: 'اقلع نباتات الذرة المصابة بالنخر المميت واحرقها. لا تطعمها للحيوانات ولا تحتفظ ببذورها. ازرع بذورًا معتمدة، وازرع بعد الذرة الفاصوليا أو محصولًا آخر غير الذرة، واترك شهرين بلا ذرة، ونظف أدواتك وأزل الأعشاب. اسأل مكتب الزراعة قبل رش الحشرات التي تنقله.'
      short: 'النخر المميت: اقلع النباتات المريضة واحرقها، ولا تطعمها للحيوانات ولا تحفظ بذورها. ازرع بذورًا معتمدة، وناوب مع الفاصوليا، واسأل مكتب الزراعة.'
      reviewed: false
    am:
      claim: 'በበቆሎ ገዳይ ኒክሮሲስ የተያዙ የበቆሎ ተክሎችን ነቅለው ያቃጥሉ። ለእንስሳት አይመግቡ፣ ዘራቸውንም አያስቀምጡ። የተረጋገጠ ዘር ይዝሩ፣ ከበቆሎ በኋላ ባቄላ ወይም ሌላ በቆሎ ያልሆነ ሰብል ይዝሩ፣ ለሁለት ወራት በቆሎ ሳይዘሩ ይቆዩ፣ መሣሪያዎችዎን ያጽዱ እና አረሞችን ያስወግዱ። በሽታውን የሚያስተላልፉትን ነፍሳት ከመርጨትዎ በፊት የግብርና ቢሮዎን ይጠይቁ።'
      short: 'MLN፡ የታመሙ ተክሎችን ነቅለው ያቃጥሉ፤ ለእንስሳት አይመግቡ፣ ዘራቸውንም አያስቀምጡ። የተረጋገጠ ዘር ይጠቀሙ፣ ከባቄላ ጋር ያፈራርቁ፣ የግብርና ቢሮን ይጠይቁ።'
      reviewed: false
    om:
      claim: 'Biqiltuu boqqolloo dhukkuba MLN qaban buqqisaa gubaa. Horiif hin kenninaa, sanyii isaanii hin kuusinaa. Sanyii mirkanaa''e facaasaa, boqqolloo booda baaqelaa ykn midhaan biraa boqqolloo hin taane facaasaa, ji''a lama boqqolloo malee turaa, meeshaalee keessan qulqulleessaa aramas balleessaa. Ilbiisota dhukkuba kana daddabarsan biifuu dura waajjira qonnaa gaafadhaa.'
      short: 'MLN: biqiltuu dhukkubsate buqqisaa gubaa; horiif hin kenninaa, sanyii hin kuusinaa. Sanyii mirkanaa''e fayyadamaa, baaqelaan jijjiiraa, qonna gaafadhaa.'
      reviewed: false
    so:
      claim: 'Ka saar oo gub geedaha galleyda ee qaba cudurka dila galleyda. Ha siin xoolaha, hana kaydsan iniintooda. Beer abuur shahaado leh, galleyda kadib beer digir ama dalag kale oo aan galley ahayn, ka tag laba bilood oo aan galley lahayn, nadiifi qalabkaaga oo saar haramaha. Weydii xafiiska beeraha ka hor intaadan buufin cayayaanka faafiya.'
      short: 'MLN: ka saar oo gub geedaha jiran; ha siin xoolaha, hana kaydsan iniintooda. Isticmaal abuur shahaado leh, ku beddel digir, weydii xafiiska beeraha.'
      reviewed: false
    ti:
      claim: 'MLN ዘርኢ ዝኾነ ተኽሊ ዕፉን ምንቀሎን ኣንድዶን። ንእንስሳ ኣይትሃቦ ዘርኡውን ኣይተዕቍብ። ዝተረጋገጸ ዘርኢ ዝራእ፣ ድሕሪ ዕፉን ባልደንጓ ወይ ካልእ ዕፉን ዘይኮነ ዘርኢ ዝራእ፣ ክልተ ኣዋርሕ ብዘይ ዕፉን ግደፍ፣ መሳርሕኻ ኣጽሪ ሳዕሪ ድማ ኣልግስ። ነቶም ዘስፋሕፍሑ ባልዕ ቅድሚ ምንጻግካ ቤት ጽሕፈት ሕርሻኻ ሕተት።'
      short: 'MLN: ዝሓመመ ተኽሊ ምንቀሎ ኣንድዶ፤ ንእንስሳ ኣይትሃብ ዘርኢ ኣይተዕቍብ። ዝተረጋገጸ ዘርኢ ተጠቐም፣ ምስ ባልደንጓ ቀያይር፣ ቤት ጽሕፈት ሕርሻ ሕተት።'
      reviewed: false
    fuf:
      claim: 'Ittu kala lekki makka hollirɗo MLN, sunnaa ɗum. Wata ñaamnu ɗum kulle, wata resu aawdi mum. Aawu aawdi teeŋtinaandi, aawu ñebbe walla huunde goɗɗum nde wonaa makka caggal makka, accu lebbi ɗiɗi alaa makka, laɓɓin kuutorɗe maa e ittude huɗo. Naamnu biro ndema maa ado mbuuftaa lekki e ɓowɗi saakooɗi ñawu oo.'
      short: 'MLN: ittu lekki ñawɗo, sunnaa ɗum; wata ñaamnu kulle walla resude aawdi. Huutoro aawdi teeŋtinaandi, waylu e ñebbe, naamnu biro ndema.'
      reviewed: false
    mos:
      claim: 'Vuk kamaan kood ninga fãa sẽn wilgd MLN la y yõog-a. Ra kõ rũms ye, la ra bĩng a buulã ye. Bud buul sẽn kiisa, bud benga bi kood a to sẽn pa kamaan ye kamaan poore, bas kiuug a yiib ti kamaan ka be, peeg y tuum-teedo la y vuk moodo. Sok y koodb biro reng ti y sãag tiim yoyã sẽn yaood bãagã zugu.'
      short: 'MLN: vuk kood sẽn bãad la y yõog-a; ra kõ rũms bi y bĩng buul ye. Tum ne buul sẽn kiisa, toeem ne benga, sok koodb biro.'
      reviewed: false
    dyu:
      claim: 'Kaba sɛnɛfɛn o sɛnɛfɛn min bɛ MLN jira, a bɔ ka a jeni. I kana a di baganw ma, i kana a kisɛ mara. Si sɛmɛntiyalen dan, sɔsɔ walima sɛnɛfɛn wɛrɛ min tɛ kaba ye dan kaba kɔfɛ, kalo fila to kaba tɛ, i ka baarakɛminɛnw saniya ka binw bɔ. I ka sɛnɛ biro ɲininka sani i ka fura fiyɛ binkɛnɛ minnu bɛ a jɛnsɛn.'
      short: 'MLN: sɛnɛfɛn banabagatɔ bɔ ka a jeni; i kana a di baganw ma walima ka a si mara. Si sɛmɛntiyalen ta, a falen sɔsɔ ye, sɛnɛ biro ɲininka.'
      reviewed: false
    wo:
      claim: 'Bëtal te lakk bépp garu mbóq gu wone MLN. Bul ko jox jur te bul denc jiwam. Jiil jiwu bu ñu dëggal, jiil ñebbe walla beneen gàncax gu dul mbóq ginnaaw mbóq, bàyyil ñaari weer te amul mbóq, setal say jumtukaay te dindi ñax mi. Laajal sa biiro mbay bala ngay saq garab ci gunóor yiy wasaare feebar bi.'
      short: 'MLN: bëtal te lakk gàncax gu feebar; bul ko jox jur walla denc jiw. Jëfandikoo jiw bu ñu dëggal, soppi ak ñebbe, laajal biiro mbay.'
      reviewed: false
    ee:
      claim: 'Ho bli ɖesiaɖe si ɖe MLN fia eye nàtɔ dzoe. Mègana lãwo naɖui o eye mègadzra eƒe kuwo ɖo o. De ku siwo ŋu woɖo kpe, de ayi alo nukuku bubu si menye bli o le bli megbe, na ɣleti eve nato bli manɔmee, klɔ wò dɔwɔnuwo eye nàɖe gbe ɖa. Bia wò agbledede ɔfis hafi nàƒu atike ɖe nudzodzoe siwo kakaa dɔlélé la dzi.'
      short: 'MLN: ho nukuku si le dɔ lém eye nàtɔ dzoe; mègana lãwo o alo nàdzra kuwo ɖo o. Zã ku siwo ŋu woɖo kpe, trɔ kple ayi, bia agbledede ɔfis.'
      reviewed: false
    ak:
      claim: 'Tu aburow dua biara a ɛda MLN adi na hyew. Mfa mma mmoa nnwe na nkora n''aba. Dua aba a wɔasi so dua, dua adua anaa afifide foforo a ɛnyɛ aburow wɔ aburow akyi, ma abosome abien nkɔ a aburow nni hɔ, popa wo nnwinnade ho na yi wura no. Bisa wo kuadwuma ɔfese ansa na woapete aduru agu mmoa a ɛtrɛw no so.'
      short: 'MLN: tu afifide a ɛyare na hyew; mfa mma mmoa anaa nkora n''aba. Fa aba a wɔasi so dua yɛ adwuma, sesa ne adua, bisa kuadwuma ɔfese.'
      reviewed: false
    ln:
      claim: 'Pikola mpe tumba bilona nyonso ya masango oyo emonisi MLN. Koleisa yango banyama te mpe kobomba mboto na yango te. Lona mboto oyo endimami, lona madesu to bilona mosusu oyo ezali masango te sima ya masango, tika sanza mibale kozanga masango, sukola bisaleli na yo mpe longola matiti. Tuna biro ya bilanga liboso obwaka nkisi na banyama oyo epalanganisaka yango.'
      short: 'MLN: pikola mpe tumba bilona ya maladi; koleisa banyama te to kobomba mboto te. Salela mboto oyo endimami, bongola na madesu, tuna biro ya bilanga.'
      reviewed: false
    lg:
      claim: 'Simbula era wokye buli kirime kya kasooli ekiraga MLN. Tokiriisa bisolo era totereka nsigo zaakyo. Simba ensigo ezakakasibwa, simba ebijanjaalo oba ekirime ekirala ekitali kasooli oluvannyuma lwa kasooli, leka emyezi ebiri nga tewali kasooli, yoza ebikozesebwa byo era oggyewo omuddo. Buuza ofiisi y''ebyobulimi nga tonnafuuyira biwuka ebibusaasaanya.'
      short: 'MLN: simbula wokye ekirime ekirwadde; tokiriisa bisolo oba okutereka ensigo. Kozesa ensigo ezakakasibwa, kyusakyusa n''ebijanjaalo, buuza ofiisi y''ebyobulimi.'
      reviewed: false
    rn:
      claim: 'Randura kandi uturire ikimera c''ibigori cose kigaragaza MLN. Ntukigaburire amatungo kandi ntubike imbuto zaco. Tera imbuto zemewe, tera ibiharage canke ikindi kimera kitari ibigori inyuma y''ibigori, umare amezi abiri ata bigori, wozeze ibikoresho vyawe kandi ukure ivyatsi. Baza ibiro vy''uburimyi imbere yo kumisha umuti udukoko tuyikwiragiza.'
      short: 'MLN: randura uturire ikimera kirwaye; ntukigaburire amatungo canke ngo ubike imbuto. Koresha imbuto zemewe, subiranya n''ibiharage, baza ibiro vy''uburimyi.'
      reviewed: false
    rw:
      claim: 'Randura kandi utwike igihingwa cy''ibigori cyose kigaragaza MLN. Ntukigaburire amatungo kandi ntuzigame imbuto zacyo. Tera imbuto zemewe, tera ibishyimbo cyangwa ikindi gihingwa kitari ibigori nyuma y''ibigori, umare amezi abiri nta bigori, usukure ibikoresho byawe kandi ukure ibyatsi. Baza ibiro by''ubuhinzi mbere yo gutera umuti udukoko tuyikwirakwiza.'
      short: 'MLN: randura utwike igihingwa kirwaye; ntukigaburire amatungo cyangwa ngo uzigame imbuto. Koresha imbuto zemewe, simburanya n''ibishyimbo, baza abajyanama.'
      reviewed: false
    bem:
      claim: 'Kuuleni no kooca icilimwa conse ica mataba icilelanga MLN. Mwilaacilisha ku nama kabili mwilasunga imbuto shaciko. Byaleni imbuto ishashininkishiwa, byaleni ifyumbu fya cilemba nangu icilimwa cimbi icishili mataba pa numa ya mataba, sheni imyeshi ibili ukwabula amataba, sambeni ifibombelo fyenu no kufumyamo amasote. Ipusheni ofesi yenu iya bulimi ilyo tamulaasansa umuti ku fishishi ifyasalanganya ubulwele.'
      short: 'MLN: kuuleni mooce icilimwa icilwele; mwilaacilisha ku nama nangu ukusunga imbuto. Byaleni imbuto ishashininkishiwa, ipusheni ofesi ya bulimi.'
      reviewed: false
    ny:
      claim: 'Zulani ndi kuwotcha mbewu iliyonse ya chimanga yomwe ikuonetsa MLN. Musadyetse ziweto ndipo musasunge mbewu zake. Bzalani mbewu zotsimikizika, bzalani nyemba kapena mbewu ina yosakhala chimanga pambuyo pa chimanga, siyani miyezi iwiri popanda chimanga, tsukani zida zanu ndi kuchotsa udzu. Funsani ofesi yanu ya zaulimi musanapopere tizilombo tofalitsa matendawa.'
      short: 'MLN: zulani ndi kuwotcha mbewu zodwala; musadyetse ziweto kapena kusunga mbewu. Bzalani mbewu zotsimikizika, sinthanitsani ndi nyemba, funsani alangizi.'
      reviewed: false
    sn:
      claim: 'Dzura uye upise chirimwa chipi zvacho chechibage chinoratidza MLN. Usachipa mhuka uye usachengeta mbeu yacho. Dyara mbeu yakasimbiswa, dyara bhinzi kana chimwe chirimwa chisiri chibage mushure mechibage, siya mwedzi miviri usina chibage, chenesa maturusi ako uye ubvise sora. Bvunza hofisi yako yeAgritex usati wapfapfaidza zvipembenene zvinochiparadzira.'
      short: 'MLN: dzura upise chirimwa chirwere; usachipa mhuka kana kuchengeta mbeu. Shandisa mbeu yakasimbiswa, chinjana nebhinzi, bvunza hofisi yeAgritex.'
      reviewed: false
    ts:
      claim: 'Tsuvula u hisa ximila xin''wana na xin''wana xa mavele lexi kombisaka MLN. U nga xi nyiki swifuwo naswona u nga hlayisi mbewu ya xona. Byala mbewu leyi tiyisisiweke, byala tinyawa kumbe ximila xin''wana lexi nga riki mavele endzhaku ka mavele, tshika tin''hweti timbirhi handle ka mavele, basisa switirho swa wena u susa nhova. Vutisa hofisi ya wena ya vurimi u nga si fafazela swifuwo leswi byi hangalasaka.'
      short: 'MLN: tsuvula u hisa ximila lexi vabyaka; u nga xi nyiki swifuwo kumbe ku hlayisa mbewu. Tirhisa mbewu leyi tiyisisiweke, cinca na tinyawa, vutisa vurimi.'
      reviewed: false
    tn:
      claim: 'Ntsha mme o fise semela sengwe le sengwe sa mmidi se se bontshang MLN. O se ka wa se fepa diphologolo mme o se ka wa boloka peo ya sone. Jala peo e e netefaditsweng, jala dinawa kgotsa sejalo se sengwe se e seng mmidi morago ga mmidi, tlogela dikgwedi di le pedi kwa ntle ga mmidi, phepafatsa didirisiwa tsa gago mme o tlose mefero. Botsa ofisi ya gago ya temo pele o gasetsa ditshenekegi tse di bo anamisang.'
      short: 'MLN: ntsha o fise semela se se lwalang; o se ka wa fepa diphologolo kgotsa wa boloka peo. Dirisa peo e e netefaditsweng, fapanya le dinawa, botsa ofisi ya temo.'
      reviewed: false
    st:
      claim: 'Ntsha mme o tjhese semela sefe kapa sefe sa poone se bontshang MLN. O se ke wa se fepa diphoofolo mme o se ke wa boloka peo ya sona. Jala peo e netefaditsweng, jala dinawa kapa sejalo se seng seo e seng poone kamora poone, tlohela dikgwedi tse pedi ntle le poone, hlwekisa disebediswa tsa hao mme o tlose mofoka. Botsa ofisi ya hao ya temo pele o fafatsa dikokonyana tse le hasanyang.'
      short: 'MLN: ntsha o tjhese semela se kulang; o se ke wa fepa diphoofolo kapa wa boloka peo. Sebedisa peo e netefaditsweng, fapanya le dinawa, botsa ofisi ya temo.'
      reviewed: false
    af:
      claim: 'Trek enige mielieplant wat MLN toon uit en verbrand dit. Moenie dit vir diere voer nie en hou nie die saad nie. Plant gesertifiseerde saad, plant bone of ''n ander gewas wat nie mielies is nie na mielies, laat twee maande sonder mielies, maak jou gereedskap skoon en verwyder onkruid. Vra jou landboukantoor voordat jy spuit teen die insekte wat dit versprei.'
      short: 'MLN: trek siek plante uit en verbrand dit; moenie dit vir diere voer of die saad hou nie. Gebruik gesertifiseerde saad, wissel met bone af, vra raad.'
      reviewed: false
    xh:
      claim: 'Nyothula uze utshise nasiphi na isityalo sombona esibonisa i-MLN. Musa ukusinika izilwanyana kwaye musa ukugcina imbewu yaso. Tyala imbewu eqinisekisiweyo, tyala iimbotyi okanye esinye isityalo esingesosombona emva kombona, shiya iinyanga ezimbini ngaphandle kombona, coca izixhobo zakho uze ususe ukhula. Buza iofisi yakho yezolimo phambi kokutshiza izinambuzane eziwusasazayo.'
      short: 'MLN: nyothula utshise isityalo esinesifo; musa ukusinika izilwanyana. Sebenzisa imbewu eqinisekisiweyo, tshintshisa neembotyi, buza iofisi yezolimo.'
      reviewed: false
    zu:
      claim: 'Siphule futhi usishise noma yisiphi isitshalo sommbila esibonisa i-MLN. Ungasiphi izilwane futhi ungagcini imbewu yaso. Tshala imbewu egunyaziwe, tshala ubhontshisi noma esinye isitshalo esingesiyo ummbila emva kommbila, shiya izinyanga ezimbili ngaphandle kommbila, hlanza amathuluzi akho futhi uhlanze ukhula. Buza ihhovisi lakho lezolimo ngaphambi kokufafaza izinambuzane eziwusabalalisayo.'
      short: 'MLN: siphule usishise isitshalo esinesifo; ungasiphi izilwane. Sebenzisa imbewu egunyaziwe, shintshanisa nobhontshisi, buza ihhovisi lezolimo.'
      reviewed: false
    pcm:
      claim: 'Pull out and burn any maize plant wey show MLN. No give am to animals and no keep the seed. Plant certified seed, plant beans or another crop wey no be maize after maize, leave two months without maize, clean your tools and clear the weed. Ask your agriculture office before you spray for the insects wey dey spread am.'
      short: 'MLN: pull out and burn sick plant; no give animals or keep the seed. Use certified seed, rotate with beans, ask your agriculture office.'
      reviewed: false
    ig:
      claim: 'Fopụta ma kpọọ osisi ọka ọ bụla nwere ọrịa MLN ọkụ. Enyela ụmụ anụmanụ ha, echekwakwala mkpụrụ ha. Kụọ mkpụrụ a kwadoro, kụọ agwa ma ọ bụ ihe ọkụkụ ọzọ na-abụghị ọka mgbe ọka gasịrị, hapụ ọnwa abụọ na-enweghị ọka, sachaa ngwa ọrụ gị ma wepụ ahịhịa. Jụọ ụlọ ọrụ ugbo gị tupu ị gbaa ọgwụ megide ụmụ ahụhụ na-ebufe ya.'
      short: 'MLN: fopụta osisi nwere ọrịa ma kpọọ ya ọkụ; enyela anụmanụ ma ọ bụ chekwaa mkpụrụ ya. Jiri mkpụrụ a kwadoro, gbanwee na agwa, jụọ ụlọ ọrụ ugbo.'
      reviewed: false
    yo:
      claim: 'Fa ọgbin agbado ti o fi arun MLN han tu ki o si sun wọn. Ma ṣe fi wọn bọ ẹran, ma si ṣe tọju irugbin wọn. Gbin irugbin ti a fọwọsi, gbin ẹwa tabi irugbin miiran ti kii ṣe agbado lẹhin agbado, fi oṣu meji silẹ laisi agbado, nu awọn irinṣẹ rẹ ki o si ko koriko kuro. Beere lọwọ ọfiisi iṣẹ-ogbin rẹ ki o to fun oogun si awọn kokoro ti n tan an kalẹ.'
      short: 'MLN: fa ọgbin ti o ni arun tu ki o sun un; ma fi bọ ẹran tabi tọju irugbin rẹ. Lo irugbin ti a fọwọsi, yi pada pẹlu ẹwa, beere lọwọ ọfiisi iṣẹ-ogbin.'
      reviewed: false
    ha:
      claim: 'Ku tumɓuke ku ƙone shukar masara da ke nuna cutar MLN. Kada ku ba dabbobi su ci, kuma kada ku ajiye irinta. Ku shuka iri da aka tabbatar, ku shuka wake ko wani amfanin gona da ba masara ba bayan masara, ku bar watanni biyu ba masara, ku tsaftace kayan aikinku kuma ku cire ciyawa. Ku tambayi ofishin noma kafin ku fesa magani kan ƙwarin da ke yaɗa ta.'
      short: 'MLN: ku tumɓuke ku ƙone shukar da ta kamu; kada ku ba dabbobi ko ku ajiye irinta. Ku shuka iri da aka tabbatar, ku musanya da wake, ku tambayi ofishin noma.'
      reviewed: false
