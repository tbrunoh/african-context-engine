templates:
  safety.OPENERS.self_harm: "Ndine urombo chaizvo kuti uri kunzwa saizvozvi. Unofanira kuwana rutsigiro izvozvi. {numbers}"
  safety.OPENERS.maternal: "Iyi inogona kuva njodzi yepamuviri. Enda kuchipatara chiri pedyo izvozvi. {numbers}"
  safety.OPENERS.poisoning: "Izvi zvinonzwika sechepfu. Tsvaga rubatsiro rwachiremba izvozvi, utore bhodhoro. {numbers}"
  safety.OPENERS.child_protection: "Mwana anogona kunge ari munjodzi. Ndapota tsvaga rubatsiro izvozvi. {numbers}"
  safety.OPENERS.gbv: "Ndine urombo kuti izvi zviri kuitika kwauri. Unogona kuwana rubatsiro izvozvi. {numbers}"
  safety.OPENERS.health_urgent: "Izvi zvinonzwika sezvinokurumidzira. Tsvaga rubatsiro rwachiremba izvozvi. {numbers}"
  safety.CALL_WORD: "Fonera {numbers}"
  safety.OR_WORD: "kana"
  safety.EMERGENCY_WORD: "njodzi"
  safety.FALLBACK_NUMBERS: "Fonera nhamba yenjodzi yenzvimbo yako kana kuenda kuchipatara chiri pedyo."

  commands.TEXTS.help: "ACE inopa mazano enzvimbo akaongororwa. Bvunza nemutauro wako. Mirairo: KUBIRIDZIRA + meseji kuongorora meseji, ZANO + zano rako kugovera ruzivo, MANYUKO, ZVIMWE, MUTAURO + kodhi (semuenzaniso MUTAURO EN), DZIMA kudzima ruzivo rwako."
  commands.TEXTS.help_short: "Bvunza ACE nemutauro wako. KUBIRIDZIRA + meseji inoiongorora. DZIMA inodzima ruzivo rwako."
  commands.TEXTS.forgotten: "Zvaitwa. ACE yadzima zvese zvayaive nazvo pamusoro penhamba iyi."
  commands.TEXTS.stopped: "Hauchazowana mameseji kubva kuACE kunze kwekunge wanyora zvakare. Tumira DZIMA kudzima ruzivo rwako."
  commands.TEXTS.language: "Pindura neMUTAURO nekodhi:"
  commands.TEXTS.tip_thanks: "Tatenda. Zano rako rachengetwa kuti riongororwe nenyanzvi. Haridzi kugoverwa risati raongororwa."
  commands.TEXTS.tip_usage: "Tumira ZANO nezano rako, semuenzaniso: ZANO mashizha eneem anobatsira pagonye rechibage muMasvingo."
  commands.TEXTS.scam_usage: "Tumira KUBIRIDZIRA nemeseji yausingavimbi nayo, ACE ichaiongorora."
  commands.TEXTS.no_sources: "Hapana mhinduro yapfuura ingaratidzwa kwayakabva. Bvunza mubvunzo kutanga."
  commands.TEXTS.no_more: "Ndizvo zvese ACE yainazvo pamusoro penyaya iyi parizvino. Bvunza umwe mubvunzo kana tumira RUBATSIRO."
  commands.TEXTS.clarify: "ACE haisati yava nemazano akaongororwa pamusoro paizvozvo. ACE inogona kukubatsira ne: {topics}. Tumira ZANO kuwedzera ruzivo."
  commands.TEXTS.unread: "ACE haisati yakwanisa kuverenga mutauro uyu. Ndapota nyora mune mumwe weiyi: {languages}."

