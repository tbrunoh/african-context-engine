  translations:
    sw:
      claim: Kutokwa na damu wakati wa ujauzito kunahitaji usafiri wa haraka hadi kituo cha afya. Mwanamke, hasa mwenye
        upungufu wa damu, anaweza kufariki ndani ya saa chache.
      short: 'Damu wakati wa ujauzito: nenda kituo cha afya mara moja. Inaweza kuua ndani ya saa chache.'
    fr:
      claim: Un saignement pendant la grossesse exige un transport immédiat vers un centre de santé. Une femme, surtout
        si elle est anémiée, peut mourir en quelques heures.
      short: 'Saignement pendant la grossesse : allez immédiatement au centre de santé. Il peut tuer en quelques heures.'
    pt:
      claim: 'Um sangramento na gravidez exige transporte imediato para uma unidade de saúde. Uma mulher, sobretudo com anemia, pode morrer em poucas horas.'
      short: 'Sangramento na gravidez: vá já para uma unidade de saúde. Pode matar em poucas horas.'
      reviewed: false
    ar:
      claim: 'النزيف أثناء الحمل يتطلب نقلًا فوريًا إلى مرفق صحي. قد تموت المرأة خلال ساعات، خاصة إذا كانت مصابة بفقر الدم.'
      short: 'النزيف في الحمل: اذهبي إلى مرفق صحي فورًا. قد يقتل خلال ساعات.'
      reviewed: false
    am:
      claim: 'በእርግዝና ወቅት የሚፈስ ደም ወዲያውኑ ወደ ጤና ተቋም መጓጓዝን ይጠይቃል። አንዲት ሴት፣ በተለይም የደም ማነስ ያለባት፣ በሰዓታት ውስጥ ልትሞት ትችላለች።'
      short: 'በእርግዝና ደም መፍሰስ፡ ወዲያውኑ ወደ ጤና ተቋም ይሂዱ። በሰዓታት ውስጥ ሊገድል ይችላል።'
      reviewed: false
    om:
      claim: 'Dhiigni yeroo ulfaa dhangala''u battaluma sanatti gara dhaabbata fayyaatti geessuu barbaachisa. Dubartiin, keessumaa ishee dhiigni itti hir''ate, sa''aatii muraasa keessatti du''uu dandeessi.'
      short: 'Dhiiga yeroo ulfaa: battaluma dhaabbata fayyaa deemaa. Sa''aatii muraasa keessatti ajjeesuu danda''a.'
      reviewed: false
    so:
      claim: 'Dhiig baxa uurka wuxuu u baahan yahay in isla markiiba la geeyo xarun caafimaad. Haweeney, gaar ahaan mid dhiig yaraan qabta, waxay ku dhiman kartaa saacado gudahood.'
      short: 'Dhiig bax uurka: isla markiiba aad xarun caafimaad. Wuxuu dili karaa saacado gudahood.'
      reviewed: false
