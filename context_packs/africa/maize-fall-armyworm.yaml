# Fall armyworm in maize: identification, scouting and low cost control. Applies in every covered country.
# Sources are FAO guidance notes, ICIPE and CIFOR-ICRAF field guides. Push-pull is scoped to the
# countries where ICIPE has disseminated it. Next step: review by national extension services.
spec_version: '1.0'
id: africa-maize-fall-armyworm
title: Fall armyworm in maize
description: How smallholder maize farmers can recognise fall armyworm, scout for it and manage it with low cost methods.
  Pesticide advice is deliberately excluded until a licensed reviewer adds it for each county.
