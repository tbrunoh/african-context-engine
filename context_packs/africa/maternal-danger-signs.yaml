    am:
      claim: 'ከወለዱ በኋላ ለከባድ ደም መፍሰስ ወይም ትላልቅ የደም ርጋታዎች፣ ለቀሉ ወይም ላበጡ እግሮች፣ ለማይለቅ ራስ ምታት፣ ለከፍተኛ ትኩሳት ወይም ማስመለስ፣ ለደረት ሕመም፣ ለመተንፈስ ችግር፣ ወይም ለመንቀጥቀጥ ወዲያውኑ እርዳታ ይፈልጉ።'
      short: 'ከወሊድ በኋላ አሁኑኑ እርዳታ ያግኙ፡ ከባድ ደም መፍሰስ ወይም ርጋታ፣ ያበጡ እግሮች፣ የማይለቅ ራስ ምታት፣ ከፍተኛ ትኩሳት፣ የደረት ሕመም፣ መንቀጥቀጥ።'
