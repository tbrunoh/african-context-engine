    mos:
      claim: 'Vuk la y sãam tomaat buul nins zãngã sẽn kẽ tao-tao, la y vuk kood a taab nins yoy kãens sẽn viimd b zugu puugã kĩngã. Pheromone tĩnsã yõkda yoy nins sẽn yikdẽ, la bũmb nins b sẽn maan ne neem bi Bacillus thuringiensis tõe n sõnga. Tiim sãagr sẽn yaa rog-n-miki pa tõe n tum sõma naoor wusg ye, bala zãnsã ritda vãadã pugẽ la yoyã tõe n ning tiimã tao-tao, rẽ n so ti y sok koodb sagl-soab reng ti y sãag tiim.'
