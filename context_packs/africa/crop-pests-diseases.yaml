- id: cmd-action
  claim: No chemical controls cassava mosaic disease. Check plants every week for the first two to three months. Uproot
    sick plants, carry them out of the field, dry them in the sun and burn them, and replace them with healthy cuttings
    15 to 20 cm long from plants that show no signs. Do not plant cassava next to a field that has the disease.
  short: 'Cassava mosaic: no chemical cures it. Uproot, dry and burn sick plants; replant with cuttings from healthy plants;
    check weekly.'
  topic: crop_disease
  vertical: agriculture
  kind: action
  subjects:
  - cassava
  keywords: [cassava, mosaic, uproot, cuttings, control, muhogo, mihogo, vipandikizi, kung'oa, manioc, boutures,
             arracher, mandioca, mosaico, كسافا, فسيفساء, ካሳቫ, ሞዛይክ, kaasaavaa, mosaayikii, kasaafo, kasaafada,
             moosayg]
  translations:
    sw:
      claim: Hakuna dawa inayotibu batobato ya muhogo. Kagua mimea kila wiki kwa miezi miwili hadi mitatu ya kwanza.
        Ng'oa mimea yenye ugonjwa, ipeleke nje ya shamba, ikaushe juani na uichome, kisha panda vipandikizi vyenye afya vya
        sentimita 15 hadi 20 kutoka mimea isiyo na dalili. Usipande muhogo karibu na shamba lenye ugonjwa.
      short: 'Batobato ya muhogo: hakuna dawa. Ng''oa, kausha na uchome mimea yenye ugonjwa; panda vipandikizi vyenye afya;
        kagua kila wiki.'
    fr:
      claim: Aucun produit chimique ne traite la mosaïque du manioc. Inspectez les plants chaque semaine pendant les deux à
        trois premiers mois. Arrachez les plants malades, sortez-les du champ, séchez-les au soleil et brûlez-les, puis
        remplacez-les par des boutures saines de 15 à 20 cm prises sur des plants sans symptômes. Ne plantez pas à côté d'un
        champ atteint.
