    sw:
      claim: Mbinu ya push-pull hupunguza viwavijeshi vamizi. Panda Desmodium kati ya mistari ya mahindi ili kuwafukuza
        nondo, na majani ya Napier au Brachiaria kuzunguka mpaka wa shamba ili kuwavuta mbali. Desmodium pia hudhibiti
        gugu la Striga, na mimea yote miwili ni lishe nzuri ya mifugo.
      short: 'Push-pull: Desmodium kati ya mistari ya mahindi, Napier au Brachiaria mpakani. Hupunguza viwavijeshi.'
    fr:
      claim: La technique push-pull réduit la chenille légionnaire d'automne. Semez du Desmodium entre les rangs de maïs
        pour repousser les papillons, et de l'herbe à éléphant (Napier) ou du Brachiaria autour du champ pour les attirer
        ailleurs. Le Desmodium combat aussi le Striga, et les deux plantes sont un bon fourrage.
      short: 'Push-pull : Desmodium entre les rangs de maïs, Napier ou Brachiaria en bordure. Réduit la chenille légionnaire.'
  source: ICIPE, Managing the fall armyworm threat using push-pull technology; CIFOR-ICRAF, Fall Armyworm guide
