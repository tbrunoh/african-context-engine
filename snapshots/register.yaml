# The licence register: every outside source ACE uses (connectors, the benchmark and optional providers), with the credit and terms it requires.
# A snapshot whose source_id is not listed here fails the tests. ODbL snapshots live in snapshots/odbl/.
# Checked on 24 November 2026; the 2.1 sources, WAXAL and Google Cloud speech on 25 November 2026.
sources:
  - id: geoboundaries
    name: geoBoundaries gbOpen, first level administrative areas
    publisher: William & Mary geoLab, with the national and open sources named in each snapshot
    url: https://www.geoboundaries.org/
    licence: Varies by country, recorded in each places snapshot (public domain, CC BY 4.0, CC BY 3.0 IGO, CC BY-SA 2.0 or ODbL 1.0)
    attribution: Boundaries from geoBoundaries (Runfola et al. 2020), with the source named in each snapshot.
    share_alike: true
    terms: Tanzania and Togo come from OpenStreetMap under ODbL 1.0 and are kept in snapshots/odbl. Botswana and Ghana are CC BY-SA 2.0.
  - id: ocha_cod_ab
    name: OCHA Common Operational Datasets, administrative boundaries (COD-AB)
    publisher: UN OCHA, with the national statistics or mapping office of each country, named in each places snapshot
    url: https://data.humdata.org/dataset/cod-ab-uga
    licence: CC BY-IGO
    attribution: Administrative boundaries from OCHA COD-AB on HDX, sourced from the national statistics office.
    terms: Used for Uganda, Namibia and the 21 countries added in 2.1. Each layer is the newest the national office has endorsed, so recent reforms (the five provinces of Burundi in 2025, the 17 regions of Burkina Faso) are in; Algeria, Angola and Morocco still show their earlier divisions, and Morocco's layer leaves out the territory of Western Sahara. Angola's layer is published by OCHA under CC BY-IGO and, as its metadata states, draws on GADM and INE Angola.
  - id: open_meteo
    name: ECMWF IFS ensemble forecast, open data, served by the Open-Meteo Ensemble API
    publisher: ECMWF (forecast data); Open-Meteo (API)
    url: https://open-meteo.com/en/docs/ensemble-api
    licence: CC BY 4.0
    attribution: Weather data by Open-Meteo.com, from ECMWF open data.
    terms: The free Open-Meteo API is for non-commercial use, under 10,000 calls a day. A commercial deployment needs an Open-Meteo subscription or its own ECMWF open data pipeline.
  - id: cap
    name: Official CAP warnings from national alerting authorities listed in the WMO Register of Alerting Authorities
    publisher: The national meteorological service of each country, named in each warnings snapshot
    url: https://alertingauthority.wmo.int/
    licence: Official public warnings; terms set by each authority
    attribution: Each warning is credited to the authority that issued it, in the authority's own words.
    terms: Public warnings are published for redistribution to the public. ACE passes them on unchanged and never rewrites the authority's text.
  - id: wfp_prices
    name: WFP Price Database, food prices by market, per country
    publisher: World Food Programme, published on the Humanitarian Data Exchange
    url: https://data.humdata.org/organization/wfp
    licence: CC BY-IGO
    attribution: Food prices from the World Food Programme, via HDX.
  - id: public_health_facilities
    name: A spatial database of health facilities managed by the public health sector in sub Saharan Africa
    publisher: Maina J, Ouma PO, Macharia PM et al., KEMRI-Wellcome Trust Research Programme (Scientific Data 6, 134, 2019)
    url: https://data.humdata.org/dataset/health-facilities-in-sub-saharan-africa
    licence: CC BY 4.0
    attribution: Public health facilities from Maina et al. (2019), Scientific Data 6, 134, via HDX.
    terms: The list names public facilities only and dates from 2019. It has no phone numbers, hours or services. It covers sub-Saharan Africa, so North Africa is a stated gap. ACE leaves out the 2,611 facilities whose position is wrong (2,217 sit at latitude 0, longitude 0) and lists them in each snapshot.
  - id: national_facility_registry
    name: National health facility registries of Malawi and Zambia
    publisher: Malawi Ministry of Health (Malawi Health Facility Registry); Zambia Ministry of Health (Zambia Health Facility Registry)
    url: https://zipatala.health.gov.mw/
    licence: Not stated; held until each ministry confirms reuse in writing
    attribution: Health facilities from the national facility registry of the Ministry of Health.
    cleared: false
    terms: Both registries publish positions and phone numbers openly but state no licence. ACE holds its connector until each ministry confirms reuse in writing, and serves the 2019 list in the meantime.
  - id: waxal
    name: WAXAL, a multilingual African speech corpus (ASR and TTS)
    publisher: Google Research, with Makerere University, the University of Ghana, Digital Umuganda, Media Trust, Loud and Clear and AIMS Senegal
    url: https://huggingface.co/datasets/google/WaxalNLP
    licence: CC BY 4.0 for the University of Ghana sets; CC BY-SA 4.0 for every other set
    attribution: Speech text from WAXAL (Google Research and partners, arXiv 2602.02734), dataset card revision 5f4d8ca.
    share_alike: true
    terms: Used only by benchmark/waxal.py, which fetches the text at run time and commits counts, never sentences or audio. Partners keep ownership of their recordings. Any model or file derived from a CC BY-SA set must carry the same licence.
  - id: google_cloud_speech
    name: Google Cloud Speech-to-Text V2, Text-to-Speech and Cloud Translation, and Gemini TTS
    publisher: Google Cloud
    url: https://cloud.google.com/speech-to-text
    licence: Commercial service under the Google Cloud terms of the operator's own account
    attribution: Speech recognition, voices and back translations by Google Cloud.
    terms: Optional and off by default. The operator brings a Google Cloud project and credentials, and a Gemini API key for Gemini TTS; ACE stores no key. Translation drafts help reviewers and are never served to people. Preview models carry no service level agreement.
