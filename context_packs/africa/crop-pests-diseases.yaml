- id: tuta-signs
  claim: Tomato leaf miner larvae dig wide, silvery tunnels in tomato leaves that turn brown and dry out. They also bore
    into stems and fruit, leaving exit holes in the fruit. The caterpillars are green to pink, up to 9 mm long, with a
    black band behind the head. Eggplant, pepper and potato can also be attacked.
  short: 'Tomato leaf miner signs: silvery tunnels in leaves that turn brown, holes in fruit, small green to pink caterpillars
    with a black band.'
  topic: pest
  vertical: agriculture
  kind: sign
  subjects:
  - tomato
  keywords: [tomato, tuta, leaf, miner, leafminer, tunnels, mines, holes, nyanya, kantangaze, tomate, mineuse,
             galeries, traça, طماطم, حافرة, ቲማቲም, ቆፋሪ, timaatimii, yaanyo, yaanyada]
  translations:
    sw:
      claim: Viwavi wa Tuta absoluta huchimba mifereji mipana inayong'aa kama fedha ndani ya majani ya nyanya, nayo hubadilika
        kahawia na kukauka. Pia hutoboa mashina na matunda, wakiacha matundu kwenye tunda. Viwavi ni wa kijani hadi pinki,
        hadi milimita 9, na mstari mweusi nyuma ya kichwa. Biringanya, pilipili na viazi navyo hushambuliwa.
      short: 'Tuta absoluta: mifereji inayong''aa kwenye majani inayogeuka kahawia, matundu kwenye nyanya, viwavi wadogo wa
        kijani hadi pinki.'
    fr:
      claim: Les larves de la mineuse de la tomate creusent de larges galeries argentées dans les feuilles, qui brunissent et
        sèchent. Elles percent aussi les tiges et les fruits, en laissant des trous de sortie. Les chenilles sont vertes à
        roses, jusqu'à 9 mm, avec une bande noire derrière la tête. L'aubergine, le poivron et la pomme de terre peuvent
        aussi être attaqués.
      short: 'Mineuse de la tomate : galeries argentées dans les feuilles qui brunissent, trous dans les fruits, petites
        chenilles vertes à roses.'
    pt:
      claim: 'As larvas da traça-do-tomateiro abrem galerias largas e prateadas nas folhas do tomate, que ficam castanhas e secam. Também furam caules e frutos, deixando orifícios de saída nos frutos. As lagartas são verdes a rosadas, com até 9 mm, e têm uma faixa preta atrás da cabeça. A beringela, o pimento e a batata também podem ser atacados.'
      short: 'Sinais da traça-do-tomateiro: galerias prateadas nas folhas que ficam castanhas, furos nos frutos, pequenas lagartas verdes a rosadas com faixa preta.'
      reviewed: false
    ar:
      claim: 'تحفر يرقات حافرة أوراق الطماطم أنفاقًا واسعة فضية في أوراق الطماطم فتتحول إلى البني وتجف. كما تثقب السيقان والثمار وتترك فيها ثقوب خروج. اليرقات خضراء إلى وردية، طولها حتى 9 مم، وخلف رأسها شريط أسود. قد تصيب أيضًا الباذنجان والفلفل والبطاطس.'
      short: 'علامات حافرة أوراق الطماطم: أنفاق فضية في الأوراق تصير بنية، ثقوب في الثمار، يرقات صغيرة خضراء إلى وردية بشريط أسود.'
      reviewed: false
    am:
      claim: 'የቲማቲም ቅጠል ቆፋሪ እጮች በቲማቲም ቅጠሎች ውስጥ ሰፊ፣ ብርማ ዋሻዎችን ይቆፍራሉ፤ ቅጠሎቹም ቡናማ ሆነው ይደርቃሉ። ግንዶችንና ፍሬዎችንም ይበሳሉ፣ በፍሬው ላይ መውጫ ቀዳዳዎችን ይተዋሉ። አባጨጓሬዎቹ ከአረንጓዴ እስከ ሮዝ ቀለም ያላቸው፣ እስከ 9 ሚ.ሜ የሚረዝሙ፣ ከራሳቸው ጀርባ ጥቁር መስመር ያላቸው ናቸው። ቃሪያ፣ ድንች እና ኤግፕላንትም ሊጠቁ ይችላሉ።'
      short: 'የቲማቲም ቅጠል ቆፋሪ ምልክቶች፡ ቡናማ የሚሆኑ ብርማ ዋሻዎች በቅጠል፣ በፍሬ ላይ ቀዳዳ፣ ጥቁር መስመር ያላቸው ትናንሽ አረንጓዴ እስከ ሮዝ አባጨጓሬዎች።'
      reviewed: false
    om:
      claim: 'Ilmaan ilbiisa baala timaatimii qotu baala timaatimii keessatti daandii bal''aa bifa meetii qabu qotu; baalli sun magaala ta''ee goga. Akkasumas qaama fi firii timaatimii uru, firii irrattis boolla bahiinsaa dhiisu. Raammoleen sun magariisa hanga roozii, dheerinni isaanii hanga mm 9, mataa isaanii duubaan sarara gurraacha qabu. Baadingaanaan, barbareen fi dinnichis miidhamuu danda''u.'
      short: 'Mallattoo ilbiisa baala timaatimii: daandii meetii fakkaatu baala keessa, boolla firii irra, raammolee xiqqaa magariisa hanga roozii sarara gurraacha qaban.'
      reviewed: false
    so:
      claim: 'Dirxiga duqsiga caleenta yaanyada wuxuu caleemaha yaanyada ka qodaa tuunelo ballaaran oo lacag u eg, caleemahaas oo bunni noqda oo engega. Wuxuu sidoo kale daloolaa jirridda iyo midhaha, isagoo midhaha uga taga godad laga baxo. Dirxigu waa cagaar ilaa casaan khafiif ah, dhererkiisuna waa ilaa 9 mm, madaxa gadaashiisana waxaa ku yaal xariiq madow. Bidinjaanka, basbaaska iyo baradhada ayaa sidoo kale la weerari karaa.'
      short: 'Calaamadaha duqsiga caleenta yaanyada: tuunelo lacag u eg oo caleemaha bunni ka dhiga, godad midhaha ku yaal, dirxi yar oo cagaar ilaa casaan leh xariiq madow.'
      reviewed: false
    ti:
      claim: 'ሓሰኻ ቆጽሊ ኮምደረ ኣብ ቆጽሊ ኮምደረ ከም ብሩር ዝበርቁ ሰፋሕቲ መገድታት ይኹዕቱ፣ እዚኦም ቡናዊ ኮይኖም ይነቕጹ። ጉንድን ፍረን እውን ይነቱ፣ ኣብ ፍረ ናይ ምውጻእ ነቓጻት ይገድፉ። እቶም ሓሰኻ ካብ ቀጠልያ ክሳብ ሮዛ፣ ክሳብ 9 mm ዝንውሓቶም፣ ድሕሪ ርእሶም ጸሊም መስመር ዘለዎም እዮም። ኣሕምልቲ ከም ስልጣን፣ በርበረን ድንሽን እውን ክጥቅዑ ይኽእሉ።'
      short: 'ምልክታት ሓሰኻ ቆጽሊ ኮምደረ: ኣብ ቡናዊ ቆጽሊ ዝበርቁ መገድታት፣ ኣብ ፍረ ነቓጻት፣ ጸሊም መስመር ዘለዎም ካብ ቀጠልያ ክሳብ ሮዛ ንኣሽቱ ሓሰኻ።'
      reviewed: false
    fuf:
      claim: 'Ɓowɗi haakoo tomati ina asa laabi yaajɗi jalbooji no kaalis daneejo nder haakoo tomati, ɗi wontata ɓoɗeeji yoora. Ɗi ina ŋatta kadi lekki e ɓiɓɓe, ina acca luulɗe yaltirɗe e ɓiɓɓe. Ɓowɗi ɗii ko haakeeji haa rose, juuteendi mum ina hewta 9 mm, ina jogii daral ɓaleewal caggal hoore. Ɓantaame, kaani e pomu tere kadi ina waawi heɓude ɗum.'
      short: 'Maandeeji ɓowɗi haakoo tomati: laabi jalbooji nder haakoo ɓoɗeejo, luulɗe e ɓiɓɓe, ɓowɗi tokooɗi haakeeji haa rose jogiiɗi daral ɓaleewal.'
      reviewed: false
    mos:
      claim: 'Tomaat vãad zãnse kotda sor-yalens sẽn yẽesd wa wanzur peelg tomaat vãadã pugẽ, sẽn lebgd zẽe la b kuum. B le bogda tiigã la buulã, n bas yiib bogdo buulã pugẽ. Zãnsã yaa vers n tãag ros, b wogr tõe n ta 9 mm, la b tara mor-sabelg b zugã poore. Kõlb-sãbga, kipari la pom-tɛɛr me tõe n paam yel-beed kãngã.'
      short: 'Tomaat vãad zãnga bãnde: sor sẽn yẽesd vãad sẽn lebg zẽe pugẽ, bogdo buulã pugẽ, zãns bilf sẽn yaa vers n tãag ros la b tara mor-sabelga.'
      reviewed: false
    dyu:
      claim: 'Tamati furaw tumuw bɛ sira belebelew sɔgɔ minnu bɛ manamana iko wari jɛman tamati furaw la, minnu bɛ wulen ka ja. U bɛ yiri ni denw fana sɔgɔ, ka bɔli wolow to denw na. Tumuw ye binkɛnɛman ye ka se rose ma, u janya bɛ se 9 mm ma, sira finman bɛ u kunkolo kɔfɛ. Ntɔrɔ, foronto ani pɔmutɛri fana bɛ se ka minɛ.'
      short: 'Tamati furaw tumuw taamashiyɛnw: sira manamanalenw furaw wulennenw kɔnɔ, wolow denw na, tumu fitininw binkɛnɛman ka se rose ma sira finman bɛ minnu na.'
      reviewed: false
    wo:
      claim: 'Sóobooy xob tamaate dañuy gas yoon yu yaatu yuy leer ni xaalis ci xobu tamaate, yuy soppiku ruus te wow. Dañuy tukkiti itam ci bant bi ak doom yi, bàyyi pax yu génn ci doom yi. Sóoboo yi wert lañu ba ci rose, seen guddaay mën na tollu ci 9 mm, am nañu rëdd bu ñuul ci ginnaaw bopp bi. Batanse, kaani ak pómmu tééré itam mën nañu ko dal.'
      short: 'Màndargay sóobooy xob tamaate: yoon yuy leer ci xob yu ruus, pax ci doom yi, sóoboo yu ndaw yu wert ba rose yu am rëdd bu ñuul.'
      reviewed: false
    ee:
      claim: 'Timati aŋgba ƒe ŋɔwo ɖea mɔ gãwo siwo keklẽ abe klosalo ene le timati aŋgbawo me, siwo zua kɔ eye woƒuna. Wodoa do ɖe ati kple kuawo hã me, eye wogblea do siwo me wodona to le kuawo me. Ŋɔawo nye gbemumu va se ɖe pink, wodidi va se ɖe 9 mm, eye fli yibɔ le wo ta megbe. Agbitsa, atadi kple anagbe hã ate ŋu akpɔ kuxi.'
      short: 'Timati aŋgba ƒe ŋɔ ƒe dzesiwo: mɔ siwo keklẽ le aŋgba siwo zua kɔ me, do le kuawo me, ŋɔ suewo siwo nye gbemumu va se ɖe pink eye fli yibɔ le wo ŋu.'
      reviewed: false
    ak:
      claim: 'Ntoosi nhaban mmoa tutu akwan a ɛtrɛw na ɛhyerɛn te sɛ dwetɛ wɔ ntoosi nhaban mu, a ɛdan dodowa na ewo. Wɔtutu dua ne aba no nso mu, na wogyaw ntokuru a wɔfa mu pue wɔ aba no mu. Mmoa no yɛ ahabammono kosi pink, ne tenten du 9 mm, na ɔwɔ ntɛm tuntum wɔ ne ti akyi. Nyaadewa, mako ne abrɔdwoma nso betumi ahu ɔhaw.'
      short: 'Ntoosi nhaban mmoa nsɛnkyerɛnne: akwan a ɛhyerɛn wɔ nhaban a ɛdan dodowa mu, ntokuru wɔ aba mu, mmoa nketewa ahabammono kosi pink a ntɛm tuntum wɔ ne ho.'
      reviewed: false
    ln:
      claim: 'Banzoto ya nkasa ya tomati etimolaka banzela minene oyo engengaka lokola palata na nkasa ya tomati, oyo ekomaka langi ya mabele mpe ekaukaka. Etobolaka mpe nzete mpe mbuma, etikaka mabulu ya kobima na mbuma. Banzoto ezali ya langi ya matiti tii rose, ekokaka 9 mm na bolai, ezali na molongo ya moindo nsima ya motó. Biringanya, pilipili mpe mbala ekoki mpe kobebisama.'
