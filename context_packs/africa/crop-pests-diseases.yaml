    dyu:
      claim: 'Fura si tɛ namasa jali bana (Xanthomonas) la. Ni sɛnɛfɛn dɔ ye taamashiyɛn jira dɔrɔn, a tigɛ dugu ma ka namasa kɛnɛmanw to namasa ka jɛkulu kɔnɔ. Baarakɛminɛn saniya tigɛli kelen kelen bɛɛ kɔfɛ ni a minɛ tasuma na miniti kelen walima k''a ko ni safinɛ ni ji walima jawɛli ye. Ni namasa bolo laban bɔra, cɛman fiyɛrɛ bɔ ni yiri ye min bolo ye fila ye, ka sɛnɛfɛnw lajɛ waati bɛɛ.'
      short: 'Namasa jali: fura si t''a la. Sɛnɛfɛn banabagatɔ tigɛ dugu ma, baarakɛminɛn saniya ni tasuma walima safinɛ ye, cɛman fiyɛrɛ bɔ ni yiri ye.'
      reviewed: false
    wo:
      claim: 'Amul garab ngir feebaru wow bu banaana (Xanthomonas). Bu gàncax wonee màndarga, dagg ko ci suuf si te bàyyi gàncax yu wér yi ci mbooloo banaana bi. Setal jumtukaay bi ginnaaw dagg bu nekk ci jàpp ko ci safara benn simili walla raxas ko ak saabu ak ndox walla jawel. Bu loxo banaana bu mujj bi génnee, dindi tóor-tóor bu góor bi ak bant bu am ñaari car, te seetal gàncax yi saa su nekk.'
      short: 'Wow bu banaana: amul garab. Dagg gàncax gu feebar ci suuf, setal jumtukaay ak safara walla saabu, dindi tóor-tóor bu góor ak bant.'
      reviewed: false
    ee:
      claim: 'Atike aɖeke meli na akɔɖu ƒe ƒuƒu dɔlélé (Xanthomonas) o. Ne nukuku ɖe dzesiwo fia ko la, lã eɖe anyigba eye nàgble nukuku lãmesẽtɔwo ɖe akɔɖu ƒe ƒome la me. Klɔ dɔwɔnu la ɣesiaɣi si nèlã nu kpɔ to elé ɖe dzo me miniti ɖeka alo to eklɔklɔ kple adzale kple tsi alo chlorine me. Ne akɔɖu ƒe asi mamlɛtɔ do ko la, ɖe ŋutsu ƒe sekpɔ la ɖa kple ati si alɔ eve le, eye nàkpɔ nukukuwo ɣesiaɣi.'
      short: 'Akɔɖu ƒe ƒuƒu: atike aɖeke meli o. Lã nukuku si le dɔ lém ɖe anyigba, klɔ dɔwɔnu kple dzo alo adzale, ɖe ŋutsu ƒe sekpɔ ɖa kple ati.'
      reviewed: false
    ak:
      claim: 'Aduru biara nni hɔ ma kwadu nkyenkyem yare (Xanthomonas). Sɛ afifide bi da nsɛnkyerɛnne adi pɛ a, twa no wɔ fam na gyaw afifide a ɛyɛ den no wɔ kwadu kuw no mu. Popa adwinnade no ho bere biara a woatwa denam so a wode bɛkura ogya mu simma baako anaa wode samina ne nsuo anaa chlorine bɛhohoro. Sɛ kwadu nsa a etwa to no apue a, yi ɔbarima nhwiren no denam dua a ɛwɔ mman abien so, na hwɛ afifide no daa.'
      short: 'Kwadu nkyenkyem: aduru biara nni hɔ. Twa afifide a ɛyare wɔ fam, popa adwinnade ho ogya anaa samina mu, yi ɔbarima nhwiren denam dua so.'
      reviewed: false
    ln:
      claim: 'Nkisi moko te mpo na bokono ya kokauka ya makemba (Xanthomonas). Soki bilona emonisi bilembo, kata yango na mabele mpe tika bilona malamu na lisanga ya makemba. Sukola esaleli sima ya kokata nyonso na kosimba yango na moto mpo na miniti moko to na kosukola yango na sabuni mpe mai to javel. Soki loboko ya suka ya makemba ebimi, longola fololo ya mobali na nzete oyo ezali na bitape mibale, mpe tala bilona tango nyonso.'
      short: 'Kokauka ya makemba: nkisi te. Kata bilona ya maladi na mabele, sukola esaleli na moto to sabuni, longola fololo ya mobali na nzete.'
      reviewed: false
    lg:
      claim: 'Tewali ddagala lya bulwadde bwa kiwotoka obw''amatooke (Xanthomonas). Ekirime bwe kiraga obubonero, kitemere ku ttaka era oleke ebirime ebirungi mu kiwagu ky''amatooke. Yoza ekikozesebwa oluvannyuma lwa buli kutema ng''okikwata mu muliro okumala eddakiika emu oba ng''okyoza na ssabbuuni n''amazzi oba chlorine. Ekitooke ekisembayo bwe kimala okuvaayo, ggyawo empumumpu ng''okozesa omuti oguliko amatabi abiri, era kebera ebirime buli kiseera.'
      short: 'Kiwotoka: tewali ddagala. Temera ku ttaka ekirime ekirwadde, yoza ekikozesebwa mu muliro oba na ssabbuuni, ggyawo empumumpu n''omuti.'
      reviewed: false
    rn:
      claim: 'Nta muti w''indwara yumisha insina (Xanthomonas). Ikimera nikimara kugaragaza ibimenyetso, gitemere ku gitaka kandi usige ibimera bizima mu gisaka c''insina. Wozeze igikoresho inyuma ya buri gutema ugifata mu muriro umunota umwe canke ukoresheje isabuni n''amazi canke chlorine. Iyo igitoke ca nyuma kimaze gusohoka, kuraho ururabo rw''igitsina gabo ukoresheje igiti gifise amashami abiri, kandi usuzume ibimera kenshi.'
      short: 'Indwara yumisha insina: nta muti. Temera ku gitaka ikimera kirwaye, wozeze igikoresho mu muriro canke n''isabuni, kuraho ururabo rw''igitsina gabo.'
      reviewed: false
    rw:
      claim: 'Nta muti wa kirabiranya y''urutoki (Xanthomonas). Igihingwa nikimara kugaragaza ibimenyetso, gitemere ku butaka kandi usige ibihingwa bizima mu gihuru cy''urutoki. Sukura igikoresho nyuma ya buri gutema ugifata mu muriro umunota umwe cyangwa ukoze isabune n''amazi cyangwa chlorine. Iyo igitoki cya nyuma kimaze gusohoka, kuraho ururabyo rw''ingabo ukoresheje igiti gifite amashami abiri, kandi ugenzure ibihingwa buri gihe.'
      short: 'Kirabiranya: nta muti. Temera ku butaka igihingwa kirwaye, sukura igikoresho mu muriro cyangwa n''isabune, kuraho ururabyo rw''ingabo ukoresheje igiti.'
      reviewed: false
    bem:
      claim: 'Takuli umuti wa bulwele bwa kuuma kwa nkonde (Xanthomonas). Ilyo fye icilimwa calanga ifishibilo, ciputuleni pa mushili no kushiya ifilimwa ifyakosa mu cikuni ca nkonde. Sambeni icibombelo cila lyonse mwaputula ukupitila mu kucikata mu mulilo pa minuti imo nangu ukucisamba ne sopo na menshi nangu chlorine. Ilyo icikasa ca kulekelesha ica nkonde cafuma, fumyeni iluba lya mwaume no muti uwakwata imisambo ibili, kabili moneni ifilimwa lyonse.'
      short: 'Ukuuma kwa nkonde: takuli umuti. Putuleni icilimwa icilwele pa mushili, sambeni icibombelo mu mulilo nangu ne sopo, fumyeni iluba lya mwaume no muti.'
      reviewed: false
    ny:
      claim: 'Palibe mankhwala a matenda ofota nthochi (Xanthomonas). Mbewu ikangoonetsa zizindikiro, idulani pansi pa nthaka ndipo siyani mbewu zathanzi m''tchire la nthochi. Tsukani chida mutadula kulikonse poyika pamoto kwa mphindi imodzi kapena kuchitsuka ndi sopo ndi madzi kapena chlorine. Chikamba chomaliza cha nthochi chikatuluka, chotsani duwa lachimuna ndi ndodo ya nthambi ziwiri, ndipo yang''anani mbewu nthawi zonse.'
      short: 'Kufota nthochi: palibe mankhwala. Dulani mbewu yodwala pansi, tsukani chida ndi moto kapena sopo, chotsani duwa lachimuna ndi ndodo.'
      reviewed: false
    sn:
      claim: 'Hapana mushonga wechirwere chekusvava kwemabhanana (Xanthomonas). Kana chirimwa chikaratidza zviratidzo, chicheke pavhu uye usiye zvirimwa zvine utano mudanga remabhanana. Chenesa chishandiso mushure mekucheka kwega kwega nekuchibata mumoto kweminiti imwe kana kuchigeza nesipo nemvura kana chlorine. Kana ruoko rwekupedzisira rwemabhanana rwabuda, bvisa ruva rechirume netsvimbo ine mapazi maviri, uye ongorora zvirimwa nguva dzose.'
      short: 'Kusvava kwemabhanana: hapana mushonga. Cheka chirimwa chine chirwere pavhu, chenesa chishandiso nemoto kana sipo, bvisa ruva rechirume netsvimbo.'
      reviewed: false
    ts:
      claim: 'A ku na vutshunguri bya vuvabyi byo vuna ka mabanana (Xanthomonas). Loko ximila xi kombisa swikombiso, xi tsema ehansi emisaveni u siya swimila leswi hanyeke eka ntlawa wa mabanana. Basisa xitirho endzhaku ka ku tsema kun''wana na kun''wana hi ku xi khoma endzilweni nimimiti yin''we kumbe ku xi hlantswa hi xipolo na mati kumbe hi chlorine. Loko voko ro hetelela ra mabanana ri humile, susa xiluva xa xinuna hi nhonga leyi nga na marhavi mambirhi, u kambela swimila nkarhi na nkarhi.'
      short: 'Ku vuna ka mabanana: a ku na vutshunguri. Tsema ximila lexi vabyaka ehansi, basisa xitirho hi ndzilo kumbe xipolo, susa xiluva xa xinuna hi nhonga.'
      reviewed: false
    tn:
      claim: 'Ga go na kalafi ya bolwetse jwa go swaba ga banana (Xanthomonas). Fa semela se bontsha matshwao, se kgaole fa mmung mme o tlogele dijalo tse di itekanetseng mo setlhopheng sa banana. Phepafatsa sedirisiwa morago ga go kgaola gongwe le gongwe ka go se tshwara mo molelong motsotso o le mongwe kgotsa ka go se tlhatswa ka molora le metsi kgotsa ka chlorine. Fa seatla sa bofelo sa banana se setse se tswile, tlosa sethunya se se tona ka thupa e e nang le dikala di le pedi, mme o tlhatlhobe dijalo ka metlha.'
      short: 'Go swaba ga banana: ga go na kalafi. Kgaola semela se se lwalang fa fatshe, phepafatsa sedirisiwa ka molelo kgotsa molora, tlosa sethunya se se tona ka thupa.'
      reviewed: false
    st:
      claim: 'Ha ho phekolo ya lefu la ho swaba ha banana (Xanthomonas). Hang ha semela se bontsha matshwao, se rengwe boemong ba mobu mme o tlohele dimela tse phetseng hantle sehlopheng sa banana. Hlwekisa sesebediswa kamora ho kgaola ho hong le ho hong ka ho se tshwara mollong motsotso o le mong kapa ka ho se hlatsuwa ka sesepa le metsi kapa ka chlorine. Ha letsoho la ho qetela la banana le se le hlahile, tlosa palesa e tona ka thupa e nang le makala a mabedi, mme o hlahlobe dimela kamehla.'
      short: 'Ho swaba ha banana: ha ho phekolo. Rema semela se kulang fatshe, hlwekisa sesebediswa ka mollo kapa sesepa, tlosa palesa e tona ka thupa.'
      reviewed: false
    af:
      claim: 'Daar is geen geneesmiddel vir piesang-Xanthomonas-verwelking nie. Sodra ''n plant tekens toon, sny dit op grondvlak af en laat die gesonde plante in die bos staan. Maak die gereedskap na elke snit skoon deur dit een minuut in ''n vlam te hou of met seep en water of chloor te was. Wanneer die laaste hand van die tros uit is, breek die manlike blom af met ''n gevurkte stok, en kyk gereeld na die plante.'
      short: 'Piesangverwelking: geen geneesmiddel nie. Sny siek plante op grondvlak af, maak gereedskap met vlam of seep skoon, breek die manlike blom met ''n stok af.'
      reviewed: false
    xh:
      claim: 'Akukho kunyanga kwesifo sokubuna kwebhanana (Xanthomonas). Xa isityalo sibonisa iimpawu, sinqumle emhlabeni uze ushiye izityalo eziphilileyo kwisihlahla sebhanana. Coca isixhobo emva kokusika ngakunye ngokusibamba emlilweni umzuzu omnye okanye ngokusihlamba ngesepha namanzi okanye nge-chlorine. Xa isandla sokugqibela sebhanana siphumile, susa intyatyambo eyindoda ngentonga enamasebe amabini, kwaye uhlole izityalo rhoqo.'
      short: 'Ukubuna kwebhanana: akukho kunyanga. Sika isityalo esinesifo emhlabeni, coca isixhobo ngomlilo okanye ngesepha, susa intyatyambo eyindoda ngentonga.'
      reviewed: false
    zu:
      claim: 'Alukho ukwelashwa kwesifo sokubuna kukabhanana (Xanthomonas). Lapho isitshalo sibonisa izimpawu, sisike ezingeni lomhlabathi futhi ushiye izitshalo eziphilile esixukwini sikabhanana. Hlanza ithuluzi emva kokusika ngakunye ngokulibamba emlilweni umzuzu owodwa noma ngokuligeza ngensipho namanzi noma nge-chlorine. Lapho isandla sokugcina sikabhanana sesivelile, susa imbali yeduna ngenduku enamagatsha amabili, futhi uhlole izitshalo njalo.'
      short: 'Ukubuna kukabhanana: alukho ukwelashwa. Sika isitshalo esinesifo phansi, hlanza ithuluzi ngomlilo noma ngensipho, susa imbali yeduna ngenduku.'
      reviewed: false
    pcm:
      claim: 'No cure dey for banana Xanthomonas wilt. Once one plant show sign, cut that plant for ground level and leave the healthy plants for the same banana family. Clean the tool after every cut, hold am for fire for one minute or wash am with soap and water or chlorine. When the last banana hand don comot, remove the male flower with stick wey get two branches, and dey check the plants every time.'
      short: 'Banana wilt: no cure. Cut sick plant for ground, clean tool with fire or soap after every cut, remove male flower with forked stick.'
      reviewed: false
    ig:
      claim: 'Ọ dịghị ọgwụgwọ maka ọrịa nkụ unere (Xanthomonas). Ozugbo osisi gosiri akara, bee osisi ahụ n''ala ma hapụ osisi ndị dị mma n''ezinụlọ unere ahụ. Sachaa ngwa ọrụ ahụ mgbe ọ bụla ị bechara site n''ijide ya n''ọkụ maka otu nkeji ma ọ bụ iji ncha na mmiri ma ọ bụ kemịkal chlorine saa ya. Mgbe aka unere ikpeazụ pụtara, wepụ okooko nwoke site n''iji osisi nwere alaka abụọ, ma na-elele osisi mgbe niile.'
      short: 'Nkụ unere: ọ dịghị ọgwụgwọ. Bee osisi nwere ọrịa n''ala, sachaa ngwa n''ọkụ ma ọ bụ ncha mgbe ọ bụla ị bechara, wepụ okooko nwoke site n''iji osisi alaka.'
      reviewed: false
    yo:
      claim: 'Ko si iwosan fun arun gbigbẹ ọgẹdẹ (Xanthomonas). Ni kete ti ọgbin kan ba fi ami han, ge ọgbin naa ni ipele ilẹ ki o si fi awọn ọgbin ti o ni ilera silẹ ninu idile ọgẹdẹ naa. Nu irinṣẹ naa lẹhin gige kọọkan nipa didimu u ninu ina fun iṣẹju kan tabi fifọ ọ pẹlu ọṣẹ ati omi tabi kẹmika chlorine. Nigbati ọwọ ọgẹdẹ to kẹhin ba ti jade, yọ ododo akọ kuro pẹlu igi ti o ni ẹka meji, ki o si maa ṣayẹwo awọn ọgbin nigbagbogbo.'
      short: 'Gbigbẹ ọgẹdẹ: ko si iwosan. Ge ọgbin ti o ni arun ni ilẹ, nu irinṣẹ ninu ina tabi pẹlu ọṣẹ lẹhin gige kọọkan, yọ ododo akọ kuro pẹlu igi ẹlẹka.'
      reviewed: false
    ha:
      claim: 'Babu maganin cutar bushewar ayaba (Xanthomonas). Da zarar shuka ta nuna alamu, ku sare ta a matakin ƙasa ku bar shuke-shuke masu lafiya a cikin kurmin. Ku tsaftace kayan aiki bayan kowane sara ta riƙe shi a wuta har zuwa minti ɗaya ko ku wanke shi da sabulu da ruwa ko sinadarin chlorine. Da zarar hannun ayaba na ƙarshe ya fito, ku cire furen namiji da sanda mai reshe biyu, kuma ku riƙa duba shuke-shuke akai-akai.'
      short: 'Bushewar ayaba: babu magani. Ku sare shukar da ta kamu a ƙasa, ku tsaftace kayan aiki a wuta ko da sabulu bayan kowane sara, ku cire furen namiji da sanda.'
      reviewed: false
