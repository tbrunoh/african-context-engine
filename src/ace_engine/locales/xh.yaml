templates:
  safety.OPENERS.self_harm: "Ndiyaxolisa kakhulu ukuba uziva ngolu hlobo. Ufanele ukufumana inkxaso ngoku. {numbers}"
  safety.OPENERS.maternal: "Oku kunokuba yingxakeko yokukhulelwa. Yiya esibhedlele esikufutshane ngoku. {numbers}"
