- id: eight-contacts
  claim: WHO recommends at least eight antenatal care contacts with a health worker in every pregnancy. The first should
    be in the first 12 weeks, then at 20, 26, 30, 34, 36, 38 and 40 weeks.
  short: 'WHO advises 8 antenatal checks: by 12 weeks, then at 20, 26, 30, 34, 36, 38 and 40 weeks.'
  topic: antenatal_care
  vertical: health
  kind: action
  subjects:
  - pregnancy
  keywords: [antenatal, clinic, checkup, check, visit, weeks, pregnant, pregnancy, kliniki, ujauzito, mjamzito, wiki,
             prenatale, consultation, visite, semaines, enceinte, grossesse, pré-natal, consulta, consultas, grávida,
             gravidez, semanas, حامل, الحمل, زيارة, زيارات, متابعة, أسابيع, እርጉዝ, ነፍሰ, ጡር, እርግዝና, ክትትል, ሳምንት, ulfaa,
             hordoffii, torban, uur, uurka, booqasho, toddobaad]
  translations:
    sw:
      claim: WHO inapendekeza angalau mara nane za kliniki ya ujauzito na mhudumu wa afya katika kila ujauzito. Ya kwanza
        iwe ndani ya wiki 12 za kwanza, kisha wiki ya 20, 26, 30, 34, 36, 38 na 40.
      short: 'WHO inashauri kliniki mara 8: kabla ya wiki 12, kisha wiki ya 20, 26, 30, 34, 36, 38 na 40.'
    fr:
      claim: L'OMS recommande au moins huit contacts prénatals avec un agent de santé à chaque grossesse. Le premier au cours
        des 12 premières semaines, puis à 20, 26, 30, 34, 36, 38 et 40 semaines.
      short: 'L''OMS conseille 8 visites prénatales : avant 12 semaines, puis à 20, 26, 30, 34, 36, 38 et 40 semaines.'
    pt:
      claim: 'A OMS recomenda pelo menos oito contactos de cuidados pré-natais com um profissional de saúde em cada gravidez. O primeiro deve ser nas primeiras 12 semanas, depois às 20, 26, 30, 34, 36, 38 e 40 semanas.'
      short: 'A OMS aconselha 8 consultas pré-natais: até às 12 semanas, depois às 20, 26, 30, 34, 36, 38 e 40 semanas.'
      reviewed: false
    ar:
      claim: 'توصي منظمة الصحة العالمية بثماني زيارات على الأقل للرعاية السابقة للولادة مع عامل صحي في كل حمل. تكون الأولى خلال أول 12 أسبوعًا، ثم في الأسابيع 20 و26 و30 و34 و36 و38 و40.'
      short: 'توصي منظمة الصحة العالمية بـ8 زيارات حمل: قبل الأسبوع 12، ثم في الأسابيع 20 و26 و30 و34 و36 و38 و40.'
      reviewed: false
    am:
      claim: 'የዓለም ጤና ድርጅት በእያንዳንዱ እርግዝና ከጤና ባለሙያ ጋር ቢያንስ ስምንት የቅድመ ወሊድ ክትትሎችን ይመክራል። የመጀመሪያው በመጀመሪያዎቹ 12 ሳምንታት ውስጥ፣ ከዚያም በ20፣ 26፣ 30፣ 34፣ 36፣ 38 እና 40 ሳምንታት።'
      short: 'የዓለም ጤና ድርጅት 8 የቅድመ ወሊድ ክትትሎችን ይመክራል፡ እስከ 12 ሳምንት፣ ከዚያም በ20፣ 26፣ 30፣ 34፣ 36፣ 38 እና 40 ሳምንት።'
      reviewed: false
    om:
      claim: 'Dhaabbanni Fayyaa Addunyaa (WHO) ulfa hunda keessatti yoo xiqqaate al saddeet hordoffii da''umsa duraa ogeessa fayyaa wajjin akka taasifamu gorsa. Inni jalqabaa torbanoota 12 jalqabaa keessatti, achiis torban 20, 26, 30, 34, 36, 38 fi 40tti.'
      short: 'WHO hordoffii da''umsa duraa al 8 gorsa: torban 12 dura, achiis torban 20, 26, 30, 34, 36, 38 fi 40tti.'
      reviewed: false
    so:
      claim: 'Ururka Caafimaadka Adduunka (WHO) wuxuu ku talinayaa ugu yaraan siddeed booqasho oo daryeel dhalmo ka hor ah oo lala yeesho shaqaale caafimaad uur kasta. Midda koowaad waa inay ahaato 12-ka toddobaad ee ugu horreeya, kadibna toddobaadyada 20, 26, 30, 34, 36, 38 iyo 40.'
      short: 'WHO waxay ku talisaa 8 booqasho uur: ka hor toddobaadka 12, kadib toddobaadyada 20, 26, 30, 34, 36, 38 iyo 40.'
      reviewed: false
    ti:
      claim: 'WHO ሓንቲ ሰበይቲ ኣብ ነፍሲ ወከፍ ጥንሲ ብውሑዱ ሸሞንተ ግዜ ሰራሕተኛ ጥዕና ክትርኢ ትመክር። እቲ ቀዳማይ ኣብ ውሽጢ ቀዳሞት 12 ሰሙናት ክኸውን ኣለዎ፣ ድሕሪኡ ኣብ ሰሙን 20፣ 26፣ 30፣ 34፣ 36፣ 38ን 40ን።'
      short: 'WHO 8 ምርመራታት ጥንሲ ትመክር: ቅድሚ ሰሙን 12፣ ድሕሪኡ ኣብ ሰሙን 20፣ 26፣ 30፣ 34፣ 36፣ 38ን 40ን።'
      reviewed: false
    fuf:
      claim: 'OMS ina wasiya debbo yiyda e golloowo cellal laabi jeetati ɓuri famɗude e kala reedu. Arandeere nde haani wonde nder yontaaji 12 arandeeji, caggal ɗuum e yontaaji 20, 26, 30, 34, 36, 38 e 40.'
      short: 'OMS ina wasiya ndaarol reedu laabi 8: ado yontere 12 hewtude, caggal ɗuum e yontaaji 20, 26, 30, 34, 36, 38 e 40.'
      reviewed: false
    mos:
      claim: 'OMS yeta ti pagb fãa segd n yã laafi tuumd-soab naoor a nii, puga fãa pugẽ. A pipi wã segd n yaa semen 12 a pipi pugẽ, la poor semen 20, 26, 30, 34, 36, 38 la 40.'
      short: 'OMS yeta ti puga gesg naoor 8: reng ti semen 12 ta, la poor semen 20, 26, 30, 34, 36, 38 la 40.'
      reviewed: false
    dyu:
      claim: 'OMS b''a fɔ ko muso ka kan ka kɛnɛya baarakɛla ye siɲɛ seegin dɔgɔmanba la kɔnɔ kelen kelen bɛɛ la. Fɔlɔ ka kan ka kɛ dɔgɔkun 12 fɔlɔw kɔnɔ, o kɔfɛ dɔgɔkun 20, 26, 30, 34, 36, 38 ani 40 la.'
      short: 'OMS b''a fɔ kɔnɔ lajɛli 8: sani dɔgɔkun 12 ka se, o kɔfɛ dɔgɔkun 20, 26, 30, 34, 36, 38 ani 40 la.'
      reviewed: false
    wo:
      claim: 'OMS dafa ne jigéen ju nekk ci ëmb na gis liggéeykatu wér-gi-yaram juróom ñett yoon lu tuuti ci ëmb bu nekk. Bu njëkk bi war na nekk ci biir 12 ayu-bés yu njëkk yi, ginnaaw ci ayu-bés 20, 26, 30, 34, 36, 38 ak 40.'
      short: 'OMS dafa ne saytu ëmb 8: bala ayu-bés 12, ginnaaw ci ayu-bés 20, 26, 30, 34, 36, 38 ak 40.'
      reviewed: false
    ee:
      claim: 'WHO ɖo aɖaŋu be nyɔnu nakpɔ lãmesẽdɔwɔla zi enyi ya teti le fuɖeɖe ɖesiaɖe me. Gbãtɔ la nanɔ kwasiɖa 12 gbãtɔwo me, emegbe le kwasiɖa 20, 26, 30, 34, 36, 38 kple 40 dzi.'
      short: 'WHO ɖo aɖaŋu fuɖeɖe ƒe dodokpɔ 8: hafi kwasiɖa 12 naɖo, emegbe le kwasiɖa 20, 26, 30, 34, 36, 38 kple 40 dzi.'
      reviewed: false
    ak:
      claim: 'WHO ka sɛ ɔbea biara nhu apɔwmuden adwumayɛfo mprɛnwɔtwe kakra koraa wɔ nyinsɛn biara mu. Nea edi kan no nyɛ nnawɔtwe 12 a edi kan no mu, na afei nnawɔtwe 20, 26, 30, 34, 36, 38 ne 40.'
      short: 'WHO ka sɛ nyinsɛn nhwehwɛmu 8: ansa na nnawɔtwe 12 adu, na afei nnawɔtwe 20, 26, 30, 34, 36, 38 ne 40.'
      reviewed: false
    ln:
      claim: 'OMS elobi ete mwasi amona mosali ya bokolongono mbala mwambe na moke mpo na kobatelama na zemi moko na moko. Ya liboso esengeli kozala na kati ya baposo 12 ya liboso, sima na baposo 20, 26, 30, 34, 36, 38 mpe 40.'
      short: 'OMS elobi botaleli ya zemi mbala 8: liboso ya poso ya 12, sima na baposo 20, 26, 30, 34, 36, 38 mpe 40.'
      reviewed: false
    lg:
      claim: 'WHO ewa amagezi omukazi okulaba omukozi w''ebyobulamu waakiri emirundi munaana okulabirirwa mu buli lubuto. Omulundi ogusooka gulina okuba mu wiiki 12 ezisooka, oluvannyuma ku wiiki 20, 26, 30, 34, 36, 38 ne 40.'
      short: 'WHO ewa amagezi okukeberebwa olubuto emirundi 8: nga wiiki 12 tezinnatuuka, oluvannyuma ku wiiki 20, 26, 30, 34, 36, 38 ne 40.'
      reviewed: false
    rn:
      claim: 'OMS isaba ko umugore abonana n''umukozi w''amagara nibura incuro umunani kugira yitwararikwe muri buri mbanyi. Ubwa mbere butegerezwa kuba mu ndwi 12 za mbere, hanyuma ku ndwi 20, 26, 30, 34, 36, 38 na 40.'
      short: 'OMS isaba kwisuzumisha imbanyi incuro 8: imbere y''indwi ya 12, hanyuma ku ndwi 20, 26, 30, 34, 36, 38 na 40.'
      reviewed: false
    rw:
      claim: 'OMS isaba ko umugore abonana n''umukozi w''ubuzima nibura inshuro umunani kugira ngo yitabweho kuri buri nda. Ubwa mbere bugomba kuba mu byumweru 12 bya mbere, hanyuma ku byumweru 20, 26, 30, 34, 36, 38 na 40.'
      short: 'OMS isaba kwisuzumisha inda inshuro 8: mbere y''icyumweru cya 12, hanyuma ku byumweru 20, 26, 30, 34, 36, 38 na 40.'
      reviewed: false
    bem:
      claim: 'WHO ilafunda ukuti umwanakashi amone kabomba wa bumi imiku cine konse limo ukusungwa mu fumo lyonse. Ukwa ntanshi kulingile ukuba mukati ka milungu 12 iya ntanshi, lyena pa milungu 20, 26, 30, 34, 36, 38 na 40.'
      short: 'WHO ilafunda ukupimwa kwa fumo imiku 8: ilyo umulungu wa 12 taulafika, lyena pa milungu 20, 26, 30, 34, 36, 38 na 40.'
      reviewed: false
    ny:
      claim: 'WHO imalangiza kuti mayi aziwonana ndi wogwira ntchito ya zaumoyo kasanu ndi katatu pa mimba iliyonse kuti alandire chisamaliro. Koyamba kuyenera kukhala m''masabata 12 oyambirira, kenako pa masabata 20, 26, 30, 34, 36, 38 ndi 40.'
      short: 'WHO imalangiza kuyezetsa mimba ka 8: sabata 12 lisanafike, kenako pa masabata 20, 26, 30, 34, 36, 38 ndi 40.'
      reviewed: false
    sn:
      claim: 'WHO inokurudzira kuti mukadzi aone mushandi wezveutano kanokwana kasere kuti achengetwe panguva yepamuviri pega pega. Kwekutanga kunofanira kuve mukati memavhiki 12 ekutanga, wozoita pamavhiki 20, 26, 30, 34, 36, 38 ne40.'
      short: 'WHO inokurudzira ongororo 8 dzepamuviri: vhiki 12 isati yasvika, wozoita pamavhiki 20, 26, 30, 34, 36, 38 ne40.'
      reviewed: false
    ts:
      claim: 'WHO yi tsundzuxa leswaku wansati a vona mutirhi wa rihanyo kan''we hi nhungu ku nyikiwa nhlayiso eka vutikari byin''wana na byin''wana. Ro sungula ri fanele ku va endzeni ka mavhiki ya 12 yo sungula, kutani eka mavhiki ya 20, 26, 30, 34, 36, 38 na 40.'
      short: 'WHO yi tsundzuxa minkambelo ya 8 ya vutikari: emahlweni ka vhiki ra 12, kutani eka mavhiki ya 20, 26, 30, 34, 36, 38 na 40.'
      reviewed: false
    tn:
      claim: 'WHO e gakolola gore mosadi a bone modiredi wa boitekanelo bonnye gangwe ga robedi go bona tlhokomelo ya boimana mo boimaneng bongwe le bongwe. Ya ntlha e tshwanetse go nna mo teng ga dibeke di le 12 tsa ntlha, morago mo dibekeng tsa 20, 26, 30, 34, 36, 38 le 40.'
      short: 'WHO e gakolola ditlhatlhobo di le 8 tsa boimana: pele ga beke ya 12, morago mo dibekeng tsa 20, 26, 30, 34, 36, 38 le 40.'
      reviewed: false
    st:
      claim: 'WHO e eletsa hore mosadi a bone mosebeletsi wa bophelo bonyane makgetlo a robedi bakeng sa tlhokomelo ya boimana boimaneng bo bong le bo bong. Ya pele e lokela ho ba ka hara dibeke tse 12 tsa pele, ebe dibekeng tsa 20, 26, 30, 34, 36, 38 le 40.'
      short: 'WHO e eletsa ditlhahlobo tse 8 tsa boimana: pele ho beke 12, ebe dibekeng tsa 20, 26, 30, 34, 36, 38 le 40.'
      reviewed: false
    af:
      claim: 'Die WHO beveel aan dat ''n vrou in elke swangerskap minstens agt keer ''n gesondheidswerker vir voorgeboortelike sorg sien. Die eerste besoek moet binne die eerste 12 weke wees, en dan by 20, 26, 30, 34, 36, 38 en 40 weke.'
      short: 'Die WHO beveel 8 voorgeboortelike ondersoeke aan: voor week 12, dan by week 20, 26, 30, 34, 36, 38 en 40.'
      reviewed: false
    xh:
      claim: 'I-WHO icebisa ukuba umfazi abone umsebenzi wezempilo ubuncinane kasibhozo ukuze akhathalelwe ngexesha lokukhulelwa ngalunye. Ukuqala kufanele kube kwiiveki zokuqala ezili-12, emva koko kwiiveki ezingama-20, 26, 30, 34, 36, 38 nama-40.'
      short: 'I-WHO icebisa uhlolo lokukhulelwa olusi-8: phambi kweveki 12, emva koko kwiiveki 20, 26, 30, 34, 36, 38 no-40.'
      reviewed: false
    zu:
      claim: 'I-WHO yeluleka ukuthi owesifazane abone isisebenzi sezempilo okungenani kasishiyagalombili ukuze anakekelwe ngesikhathi sokukhulelwa ngakunye. Okokuqala kufanele kube emasontweni okuqala angu-12, bese kuba emasontweni angu-20, 26, 30, 34, 36, 38 no-40.'
      short: 'I-WHO yeluleka ukuhlolwa kokukhulelwa okungu-8: ngaphambi kwesonto 12, bese emasontweni angu-20, 26, 30, 34, 36, 38 no-40.'
      reviewed: false
    pcm:
      claim: 'WHO talk say woman suppose see health worker at least eight times for antenatal care for every belle. The first one suppose happen inside the first 12 weeks, then for week 20, 26, 30, 34, 36, 38 and 40.'
      short: 'WHO advise 8 antenatal checks: before week 12, then for week 20, 26, 30, 34, 36, 38 and 40.'
      reviewed: false
    ig:
      claim: 'WHO na-adụ ọdụ ka nwanyị hụ onye ọrụ ahụike ma ọ dịkarịa ala ugboro asatọ maka nlekọta afọ ime n''oge afọ ime ọ bụla. Nke mbụ kwesịrị ịbụ n''ime izu 12 mbụ, wee sochie n''izu 20, 26, 30, 34, 36, 38 na 40.'
      short: 'WHO na-adụ ọdụ nyocha afọ ime 8: tupu izu 12, wee n''izu 20, 26, 30, 34, 36, 38 na 40.'
      reviewed: false
    yo:
      claim: 'WHO gba ni imọran pe ki obinrin ri oṣiṣẹ ilera o kere ju igba mẹjọ fun itọju oyun ni gbogbo oyun. Akọkọ yẹ ki o wa laarin ọsẹ 12 akọkọ, lẹhinna ni ọsẹ 20, 26, 30, 34, 36, 38 ati 40.'
      short: 'WHO gba ni imọran ayẹwo oyun 8: ṣaaju ọsẹ 12, lẹhinna ni ọsẹ 20, 26, 30, 34, 36, 38 ati 40.'
      reviewed: false
    ha:
      claim: 'WHO ta ba da shawarar a ga ma''aikacin lafiya akalla sau takwas don gwajin ciki a kowane ciki. Na farko ya kasance cikin makonni 12 na farko, sannan a makonni 20, 26, 30, 34, 36, 38 da 40.'
      short: 'WHO ta ba da shawarar gwajin ciki 8: kafin makonni 12, sannan a makonni 20, 26, 30, 34, 36, 38 da 40.'
      reviewed: false
  source: WHO, New guidelines on antenatal care for a positive pregnancy experience (7 November 2016)
