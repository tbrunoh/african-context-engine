facts:
- id: go-now
  claim: 'Take a pregnant woman to a hospital or health centre immediately if she has any of these signs: vaginal bleeding,
    convulsions or fits, severe headache with blurred vision, fever and too weak to get out of bed, severe abdominal
    pain, or fast or difficult breathing.'
  short: 'Go to a facility NOW for: bleeding, fits, severe headache with blurred vision, fever and very weak, severe
    belly pain.'
