  review_status: sourced
- id: why-eight
  claim: Eight or more antenatal care contacts can reduce deaths of babies around birth by up to 8 per 1,000 births,
    compared with 4 visits, because problems are found and treated earlier.
  short: Eight or more antenatal checks can prevent up to 8 baby deaths per 1,000 births, compared with 4 visits.
  topic: antenatal_care
  vertical: health
  kind: info
  subjects:
  - pregnancy
  keywords: [antenatal, eight, visits, why, kliniki, ujauzito, prenatale, visites, pré-natal, consulta, consultas,
             grávida, gravidez, semanas, حامل, الحمل, زيارة, زيارات, متابعة, أسابيع, እርጉዝ, ነፍሰ, ጡር, እርግዝና, ክትትል,
             ሳምንት, ulfaa, hordoffii, torban, uur, uurka, booqasho, toddobaad]
  translations:
    sw:
      claim: Kliniki ya ujauzito mara nane au zaidi inaweza kupunguza vifo vya watoto wakati wa kuzaliwa kwa hadi 8 kwa kila
        vizazi 1,000, ukilinganisha na mara 4, kwa sababu matatizo hugunduliwa na kutibiwa mapema.
      short: Kliniki mara nane au zaidi inaweza kuzuia hadi vifo 8 vya watoto kwa kila vizazi 1,000, ukilinganisha na mara 4.
    fr:
      claim: Huit contacts prénatals ou plus peuvent réduire les décès de bébés autour de la naissance de jusqu'à 8 pour 1 000
        naissances, par rapport à 4 visites, car les problèmes sont détectés et traités plus tôt.
      short: Huit visites prénatales ou plus peuvent éviter jusqu'à 8 décès de bébés pour 1 000 naissances, par rapport à 4.
    pt:
      claim: 'Oito ou mais contactos pré-natais podem reduzir as mortes de bebés à volta do parto em até 8 por cada 1000 nascimentos, em comparação com 4 consultas, porque os problemas são detetados e tratados mais cedo.'
      short: 'Oito ou mais consultas pré-natais podem evitar até 8 mortes de bebés por 1000 nascimentos, em comparação com 4 consultas.'
      reviewed: false
    ar:
      claim: 'ثماني زيارات أو أكثر للرعاية السابقة للولادة يمكن أن تخفض وفيات المواليد حول الولادة بما يصل إلى 8 لكل 1000 ولادة، مقارنة بأربع زيارات، لأن المشكلات تُكتشف وتُعالج مبكرًا.'
      short: 'ثماني زيارات حمل أو أكثر قد تمنع حتى 8 وفيات مواليد لكل 1000 ولادة، مقارنة بأربع زيارات.'
      reviewed: false
    am:
      claim: 'ስምንት ወይም ከዚያ በላይ የቅድመ ወሊድ ክትትሎች ከ4 ጉብኝቶች ጋር ሲነጻጸሩ በወሊድ አካባቢ የሚሞቱ ሕፃናትን በ1,000 ወሊዶች እስከ 8 ሊቀንሱ ይችላሉ፤ ምክንያቱም ችግሮች ቀድመው ተገኝተው ይታከማሉ።'
      short: 'ስምንት ወይም ከዚያ በላይ ክትትሎች ከ4 ጉብኝቶች ጋር ሲነጻጸሩ በ1,000 ወሊዶች እስከ 8 የሕፃናት ሞትን ሊከላከሉ ይችላሉ።'
      reviewed: false
    om:
      claim: 'Hordoffiin da''umsa duraa al saddeet ykn isaa ol, al 4 wajjin yoo wal bira qabamu, du''a daa''immanii yeroo da''umsaa da''umsa 1,000 keessaa hanga 8 hir''isuu danda''a, sababni isaas rakkoowwan dafanii argamanii yaalamu.'
      short: 'Hordoffiin al saddeet ykn isaa ol, al 4 wajjin yoo wal bira qabamu, da''umsa 1,000 keessaa du''a daa''immanii hanga 8 ittisuu danda''a.'
      reviewed: false
    so:
      claim: 'Siddeed booqasho ama ka badan oo daryeel dhalmo ka hor ah waxay hoos u dhigi karaan dhimashada ilmaha agagaarka dhalmada ilaa 8 dhalmo kasta oo 1,000 ah, marka la barbar dhigo 4 booqasho, sababtoo ah dhibaatooyinka goor hore ayaa la ogaadaa oo la daaweeyaa.'
      short: 'Siddeed booqasho uur ama ka badan waxay ka hortagi karaan ilaa 8 dhimasho ilmo 1,000 dhalmo kasta, marka loo eego 4 booqasho.'
      reviewed: false
  source: WHO, Pregnant women must be able to access the right care at the right time (7 November 2016)
