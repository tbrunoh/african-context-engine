    fuf:
      claim: 'Lekki alaa ngam ñawu yoorugol banaana (Xanthomonas). Si lekki hollii maandeeji tan, taƴ ɗum e leydi accu ko aawi cellunde e mbaydi banaana ndii. Laɓɓin kuutorgal ngal kala nde taƴɗaa e jogaade ngal e yiite hojom gooto walla lootude ngal e saabunde e ndiyam walla jawel. Si jungo banaana sakkitiingo yaltii, ittu fuloore gorko e lekki jogiiɗo caltuɗe ɗiɗi, ndaar ko aawi sahaa kala.'
      short: 'Yoorugol banaana: lekki alaa. Taƴ lekki ñawɗo e leydi, laɓɓin kuutorgal e yiite walla saabunde, ittu fuloore gorko e lekki.'
