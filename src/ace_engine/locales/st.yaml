templates:
  safety.OPENERS.self_harm: "Ke maswabi haholo hore o ikutlwa tjena. O tshwanetse ho fumana tshehetso hona joale. {numbers}"
  safety.OPENERS.maternal: "Ena e ka ba tshohanyetso ya boimana. Eya sepetlele se haufi hona joale. {numbers}"
  safety.OPENERS.poisoning: "Sena se utlwahala jwalo ka chefo. Fumana thuso ya ngaka hona joale, o nke botlolo. {numbers}"
  safety.OPENERS.child_protection: "Ngwana a ka ba kotsing. Ka kopo fumana thuso hona joale. {numbers}"
  safety.OPENERS.gbv: "Ke maswabi hore sena se o etsahalla. O ka fumana thuso hona joale. {numbers}"
  safety.OPENERS.fire: "Sena se bonahala e le mollo. Ntshetsang batho bohle ka ntle jwale, le se ke la kgutlela ka hare. {numbers}"
  safety.OPENERS.health_urgent: "Sena se utlwahala se potlakile. Fumana thuso ya ngaka hona joale. {numbers}"
  safety.CALL_WORD: "Letsetsa {numbers}"
  safety.OR_WORD: "kapa"
  safety.EMERGENCY_WORD: "tshohanyetso"
  safety.FALLBACK_NUMBERS: "Letsetsa nomoro ya tshohanyetso ya sebakeng sa hao kapa o ye sepetlele se haufi."

  commands.TEXTS.help: "ACE e fana ka keletso ya sebaka e hlahlobilweng. Botsa ka puo ya hao. Ditaelo: BOMENEMENE + molaetsa ho hlahloba molaetsa, KELETSO + keletso ya hao ho arolelana tsebo, MEHLODI, HAPE, PUO + khoutu (mohlala PUO EN), HLAKOLA ho hlakola dintlha tsa hao."
  commands.TEXTS.help_short: "Botsa ACE ka puo ya hao. BOMENEMENE + molaetsa e a o hlahloba. HLAKOLA e hlakola dintlha tsa hao."
  commands.TEXTS.forgotten: "Ho entswe. ACE e hlakotse tsohle tseo e neng e na le tsona ka nomoro ena."
  commands.TEXTS.stopped: "O ke ke wa hlola o fumana melaetsa ho tswa ho ACE ntle le haeba o ngola hape. Romela HLAKOLA ho hlakola dintlha tsa hao."
  commands.TEXTS.language: "Araba ka PUO le khoutu:"
  commands.TEXTS.tip_thanks: "Re a leboha. Keletso ya hao e bolokilwe hore setsebi se e hlahlobe. E ke ke ya arolelanwa pele e hlahlojwa."
  commands.TEXTS.tip_usage: "Romela KELETSO le keletso ya hao, mohlala: KELETSO makgasi a neem a thusa kgahlanong le seboko sa poone Foreisetata."
  commands.TEXTS.scam_usage: "Romela BOMENEMENE le molaetsa oo o sa o tsheptheng, ACE e tla o hlahloba."
  commands.TEXTS.no_sources: "Ha ho karabo ya pele eo ho ka bontshwang mohlodi wa yona. Botsa potso pele."
  commands.TEXTS.no_more: "Ke tsohle tseo ACE e nang le tsona ka taba ena hajwale. Botsa potso e nngwe kapa o romele THUSO."
  commands.TEXTS.clarify: "ACE ha e eso be le tataiso e hlahlobilweng ka seo. ACE e ka o thusa ka: {topics}. Romela KELETSO ho eketsa tsebo."
  commands.TEXTS.unread: "ACE ha e so kgone ho bala puo ena. Ka kopo ngola ka e nngwe ya tsena: {languages}."

