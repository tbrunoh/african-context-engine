# Afrikaans for South Africa and Namibia, in standard spelling. It shares short words such as is and my with
# English, so its own marker words count double (marker_weight). Drafted for ACE 2.3. Awaiting review by fluent
# speakers and, for the safety phrases, by clinicians.
