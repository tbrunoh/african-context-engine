  translations:
    sw:
      claim: 'Mpeleke mama mjamzito hospitalini au kituo cha afya mara moja akiwa na dalili yoyote kati ya hizi: kutokwa
        na damu ukeni, degedege, maumivu makali ya kichwa pamoja na kutoona vizuri, homa na udhaifu wa kushindwa kuamka
        kitandani, maumivu makali ya tumbo, au kupumua kwa haraka au kwa shida.'
      short: 'Nenda kituo cha afya SASA kwa: damu, degedege, kichwa kikali na kutoona vizuri, homa na udhaifu, tumbo
        kuuma sana.'
    fr:
      claim: 'Emmenez immédiatement une femme enceinte à l''hôpital ou au centre de santé si elle présente l''un de ces
        signes : saignements vaginaux, convulsions, maux de tête sévères avec vision trouble, fièvre avec une faiblesse
        qui l''empêche de se lever, douleurs abdominales sévères, ou respiration rapide ou difficile.'
      short: 'Centre de santé MAINTENANT si : saignements, convulsions, maux de tête et vision trouble, fièvre et grande
        faiblesse, fortes douleurs au ventre.'
    pt:
      claim: 'Leve imediatamente uma mulher grávida a um hospital ou centro de saúde se tiver algum destes sinais: sangramento vaginal, convulsões ou ataques, dor de cabeça forte com visão turva, febre e fraqueza que a impede de sair da cama, dor forte na barriga, ou respiração rápida ou difícil.'
      short: 'Vá a uma unidade de saúde JÁ se houver: sangramento, convulsões, dor de cabeça forte com visão turva, febre e muita fraqueza, dor forte na barriga.'
      reviewed: false
    ar:
      claim: 'خذ المرأة الحامل إلى مستشفى أو مركز صحي فورًا إذا ظهرت عليها أي من هذه العلامات: نزيف مهبلي، أو تشنجات ونوبات، أو صداع شديد مع تشوش الرؤية، أو حمى مع ضعف شديد يمنعها من النهوض من السرير، أو ألم شديد في البطن، أو تنفس سريع أو صعب.'
      short: 'اذهبي إلى مرفق صحي الآن عند: النزيف، أو التشنجات، أو صداع شديد مع تشوش الرؤية، أو حمى وضعف شديد، أو ألم شديد في البطن.'
      reviewed: false
    am:
      claim: 'ነፍሰ ጡር ሴት ከሚከተሉት ምልክቶች አንዱ ካለባት ወዲያውኑ ወደ ሆስፒታል ወይም ጤና ጣቢያ ይውሰዷት፡ ከብልት የሚፈስ ደም፣ መንቀጥቀጥ ወይም የሚጥል፣ ከደብዛዛ እይታ ጋር ከባድ ራስ ምታት፣ ትኩሳትና ከአልጋ መነሳት የማያስችል ድካም፣ ከባድ የሆድ ሕመም፣ ወይም ፈጣን ወይም አስቸጋሪ አተነፋፈስ።'
      short: 'አሁኑኑ ወደ ጤና ተቋም ይሂዱ፡ ደም መፍሰስ፣ መንቀጥቀጥ፣ ከደብዛዛ እይታ ጋር ከባድ ራስ ምታት፣ ትኩሳትና ከፍተኛ ድካም፣ ከባድ የሆድ ሕመም።'
      reviewed: false
    om:
      claim: 'Dubartii ulfaa mallattoolee kanneen keessaa tokko illee yoo qabaatte battaluma sanatti hospitaala ykn buufata fayyaatti geessaa: dhiiga qaama saalaa irraa dhangala''u, qaamni raafamuu ykn kufuu, mataa dhukkubbii cimaa ijji ifa dhabuu wajjin, ho''a qaamaa fi dadhabbii siree irraa ka''uu dhabsiisu, garaa dhukkubbii cimaa, ykn hafuura saffisaa ykn rakkisaa.'
      short: 'AMMA dhaabbata fayyaa deemaa: dhiiga dhangala''u, raafama qaamaa, mataa dhukkubbii cimaa ija ifa dhabuu wajjin, ho''a fi dadhabbii cimaa, garaa dhukkubbii cimaa.'
      reviewed: false
    so:
      claim: 'Haweeneyda uurka leh isla markiiba geey isbitaal ama xarun caafimaad haddii ay leedahay mid ka mid ah calaamadahan: dhiig ka imanaya xubinta taranka, gariir ama suuxdin, madax xanuun daran oo ay la socoto aragti cakiran, qandho iyo daciifnimo aysan sariirta uga kici karin, calool xanuun daran, ama neefsasho degdeg ah ama adag.'
      short: 'HADDA aad xarun caafimaad: dhiig bax, gariir ama suuxdin, madax xanuun daran oo aragti cakiran leh, qandho iyo daciifnimo daran, calool xanuun daran.'
      reviewed: false
    ti:
      claim: 'ነፍሰ ጾር ሰበይቲ ካብዞም ምልክታት ሓደ እንተሃልይዋ ብቕልጡፍ ናብ ሆስፒታል ወይ ጣቢያ ጥዕና ውሰዳ: ካብ ብልታ ደም ምፍሳስ፣ ምንፍርፋር ወይ ምንቅጥቃጥ፣ ብርቱዕ ቃንዛ ርእሲ ምስ ዘይንጹር ራእይ፣ ካብ ዓራት ክትትንስእ ዘየፍቅደላ ረስንን ድኻምን፣ ብርቱዕ ቃንዛ ከብዲ፣ ወይ ቅልጡፍ ወይ ከቢድ ምትንፋስ።'
      short: 'ሕጂ ናብ ሆስፒታል ኪድ: ደም ምፍሳስ፣ ምንፍርፋር፣ ብርቱዕ ቃንዛ ርእሲ ምስ ዘይንጹር ራእይ፣ ረስንን ብርቱዕ ድኻምን፣ ብርቱዕ ቃንዛ ከብዲ።'
      reviewed: false
    fuf:
      claim: 'Naŋ debbo jogiiɗo reedu yah lopitaal law si o jogii gooto e maandeeji ɗii: ƴiiƴam yaltooɗam e debbeere, jallo walla siwnude, hoore muusooɗo no feewi e gite ngi yiyataa no moƴƴi, wulnde e lohre haɗoore mo immaade e leeso, reedu muusooɗo no feewi, walla foofaade law walla e caɗeele.'
      short: 'Yah lopitaal JOONI si ƴiiƴam ina yalta, jallo, hoore muusooɗo no feewi e gite ngi yiyataa, wulnde e lohre mawnde, reedu muusooɗo no feewi.'
      reviewed: false
    mos:
      claim: 'Tall pagb sẽn tar puga n kẽng logtoeeg tao-tao a sã n tar bãnd-kãens a ye: zĩim sẽn yit a pagb-zĩigẽ, kiirsa bi zẽgdo, zugu sẽn zabd wusg la nin sẽn pa ne sõma, tool la yalemd sẽn pa kõt-a sor t''a yik gãnã zugu, pug zabd kãsenga, bi vuusg tao-tao bi toogo.'
      short: 'Kẽng logtoeeg MASÃ zĩim sã n yitẽ, kiirsa, zugu sẽn zabd wusg la nin sẽn pa ne, tool la yalemd kãsenga, pug zabd kãsenga.'
      reviewed: false
    dyu:
      claim: 'Muso kɔnɔma ta ka taa dɔgɔtɔrɔso la joona ni nin taamashiyɛnw dɔ b''a la: joli bɔli muso yɔrɔ la, kirikirimasiyɛn walima yɛrɛyɛrɛ, kunkolo dimi gɛlɛn ni ɲɛ min tɛ fɛn ye ka ɲɛ, farigan ni fanga dɔgɔya min t''a to a ka wuli dalan kan, kɔnɔ dimi gɛlɛn, walima ninakili teliman walima gɛlɛn.'
      short: 'Taa dɔgɔtɔrɔso la SISAN ni joli bɔli, kirikirimasiyɛn, kunkolo dimi gɛlɛn ni ɲɛ min tɛ fɛn ye, farigan ni fanga dɔgɔya ba, kɔnɔ dimi gɛlɛn bɛ yen.'
      reviewed: false
    wo:
      claim: 'Yóbbul jigéen ju ëmb ci opitaal ci gaaw bu amee benn ci màndarga yii: deret buy rot ci jigéenam, lox walla daanu, bopp buy metti lool ak bët yu gisul bu baax, tàng ak tayel bu ko tere jóg ci lal bi, biir buy metti lool, walla noyyi ci gaaw walla ci coono.'
      short: 'Demal ci opitaal LÉEGI bu amee deret buy rot, lox, bopp buy metti lool ak bët yu gisul, tàng ak tayel bu réy, biir buy metti lool.'
      reviewed: false
    ee:
      claim: 'Kplɔ nyɔnu si fɔ fu yi kɔdzi kaba ne dzesi siawo dometɔ ɖeka le esi: ʋu dodo tso nyɔnu ƒe akpa me, dzidzi alo dzodzo, ta veve sesẽ kple ŋku si mekpɔ nu nyuie o, ŋdɔdzɔ kple gbɔdzɔgbɔdzɔ si mena wòte ŋu fɔna le aba dzi o, dɔme veve sesẽ, alo ya gbɔgbɔ kaba alo kple sesẽ.'
      short: 'Yi kɔdzi FIFIA ne ʋu dodo, dzidzi, ta veve sesẽ kple ŋku si mekpɔ nu o, ŋdɔdzɔ kple gbɔdzɔgbɔdzɔ gã, dɔme veve sesẽ le eme.'
      reviewed: false
    ak:
      claim: 'Fa ɔbea a ɔwɔ nyinsɛn kɔ ayaresabea ntɛm ara sɛ ɔwɔ nsɛnkyerɛnne yi mu baako: mogya a efi ne mmaa fa mu, ɔsono anaa wosow, tirim yaw kɛse ne aniwa a enhu ade yiye, atiridii ne mmerɛwyɛ a ɛmma ontumi nsɔre mfi mpa so, yafunu yaw kɛse, anaa ɔhome ntɛm anaa ɛyɛ den.'
      short: 'Kɔ ayaresabea SEESEI sɛ mogya reba, ɔsono, tirim yaw kɛse ne aniwa a enhu ade, atiridii ne mmerɛwyɛ kɛse, yafunu yaw kɛse.'
      reviewed: false
    ln:
      claim: 'Mema mwasi ya zemi na lopitalo noki soki azali na elembo moko kati na oyo: kobima makila na nzoto ya mwasi, kifafa to koningana, motó ezali kobeta makasi mpe miso ezali komona malamu te, fievre mpe bolembu oyo epekisi ye kotelema na mbeto, mpasi makasi na libumu, to kopema noki to na mpasi.'
      short: 'Kende na lopitalo SIKAWA soki kobima makila, kifafa, motó ezali kobeta makasi mpe miso emoni te, fievre mpe bolembu makasi, libumu ezali koyoka mpasi makasi.'
      reviewed: false
    lg:
      claim: 'Twala omukazi ali olubuto mu ddwaaliro oba mu kiraliniki mangu ddala bw''aba n''akamu ku bubonero buno: okuvaamu omusaayi mu bitundu by''ekyama, ensimbu oba okukankana, omutwe ogumuluma ennyo n''amaaso agatalaba bulungi, omusujja n''obunafu obutamuganya kusituka ku kitanda, obulumi obw''amaanyi mu lubuto, oba okussa amangu oba mu buzibu.'
      short: 'Genda mu ddwaaliro KAAKANO bwe wabaawo okuvaamu omusaayi, ensimbu, omutwe ogumuluma ennyo n''amaaso agatalaba, omusujja n''obunafu obungi, olubuto olulumwa ennyo.'
      reviewed: false
    rn:
      claim: 'Jana umugore afise imbanyi ku bitaro canke ku ivuriro ningaho nimba afise kimwe muri ibi bimenyetso: kuva amaraso mu gihimba c''irondoka, igicuri canke kujugumira, umutwe urababaza cane n''amaso atabona neza, ubushuhe n''intege nke zituma adashobora kuva mu buriri, kubabara cane mu nda, canke guhema vuba canke bigoye.'
      short: 'Ja ku bitaro UBU NYENE nimba hari kuva amaraso, igicuri, umutwe urababaza cane n''amaso atabona, ubushuhe n''intege nke cane, kubabara cane mu nda.'
      reviewed: false
    rw:
      claim: 'Jyana umugore utwite ku bitaro cyangwa ku kigo nderabuzima ako kanya niba afite kimwe muri ibi bimenyetso: kuva amaraso mu gitsina, igicuri cyangwa gutitira, umutwe urababara cyane n''amaso atabona neza, umuriro n''intege nke zituma adashobora kuva mu buriri, kubabara cyane mu nda, cyangwa guhumeka vuba cyangwa bigoranye.'
      short: 'Jya ku bitaro UBU niba hari kuva amaraso, igicuri, umutwe urababara cyane n''amaso atabona, umuriro n''intege nke cyane, kubabara cyane mu nda.'
      reviewed: false
    bem:
      claim: 'Sendeni umwanakashi uli ne fumo ku cipatala bwangu nga akwete icishibilo cimo pali ifi: ukufuma umulopa mu fya bukashi, ifisushi nangu ukututuma, umutwe ukukalipa sana na menso ayashilemona bwino, icikabilila no bunake ubushilemusuminisha ukwima pa busanshi, ukukalipa kwa maka mu mala, nangu ukupema bwangu nangu ukupema ku bukose.'
      short: 'Kabiyeni ku cipatala NOMBA nga kuli ukufuma umulopa, ifisushi, umutwe ukukalipa sana na menso ayashilemona, icikabilila no bunake, amala ayalekalipa sana.'
      reviewed: false
    ny:
      claim: 'Tengani mayi woyembekezera kuchipatala nthawi yomweyo ngati ali ndi chizindikiro chilichonse mwa izi: kutuluka magazi kumaliseche, khunyu kapena kunjenjemera, mutu wopweteka kwambiri ndi maso osaona bwino, malungo ndi kufooka kosamulola kudzuka pabedi, kupweteka kwambiri m''mimba, kapena kupuma mofulumira kapena movutikira.'
      short: 'Pitani kuchipatala TSOPANO ngati pali kutuluka magazi, khunyu, mutu wopweteka kwambiri ndi maso osaona, malungo ndi kufooka kwakukulu, mimba yopweteka kwambiri.'
      reviewed: false
    sn:
      claim: 'Endesa mukadzi ane pamuviri kuchipatara kana kukiriniki ipapo ipapo kana aine chimwe chezviratidzo izvi: kubuda ropa panhengo yechikadzi, kugwinha kana kudedera, musoro unorwadza zvakanyanya nemaziso asingaone zvakanaka, fivha neutera zvisingamutenderi kumuka pamubhedha, kurwadza kukuru kwedumbu, kana kufema nekukurumidza kana zvakaoma.'
      short: 'Enda kuchipatara IZVOZVI kana pane kubuda ropa, kugwinha, musoro unorwadza zvakanyanya nemaziso asingaone, fivha neutera hukuru, dumbu rinorwadza zvakanyanya.'
      reviewed: false
    ts:
      claim: 'Yisa wansati la tikeke exibedlhele kumbe exivandleni xa rihanyo hi xihatla loko a ri na xin''wana xa swikombiso leswi: ku huma ngati eswirhweni swa xisati, xifafa kumbe ku rhurhumela, ku vava ka nhloko ngopfu na mahlo lama nga voniki kahle, fivhara na ku tsana loku nga n''wi pfumeleriki ku pfuka emubedweni, ku vava loku tiyeke ka khwiri, kumbe ku hefemula hi ku hatlisa kumbe hi ku tika.'
      short: 'Famba exibedlhele SWESWI eka: ku huma ngati, xifafa, ku vava ka nhloko ngopfu na mahlo lama nga voniki, fivhara na ku tsana lokukulu, khwiri leri vavaka ngopfu.'
      reviewed: false
    tn:
      claim: 'Isa mosadi yo o imileng kwa bookelong kgotsa kwa kokelwaneng ka bonako fa a na le lengwe la matshwao a: go tswa madi mo setlhong sa bosadi, sethoathoa kgotsa go roroma, tlhogo e e botlhoko thata le matlho a a sa boneng sentle, fefere le bokoa jo bo sa mo letleleng go tsoga mo bolaong, botlhoko jo bogolo jwa mpa, kgotsa go hema ka bonako kgotsa ka bokete.'
      short: 'Ya kwa bookelong JAANONG ka ntlha ya: go tswa madi, sethoathoa, tlhogo e e botlhoko thata le matlho a a sa boneng, fefere le bokoa, mpa e e botlhoko thata.'
      reviewed: false
    st:
      claim: 'Isa mosadi ya imileng sepetlele kapa setsing sa bophelo hang hang haeba a na le leha e le lefe la matshwao ana: ho tswa madi setho sa botona, sethoathoa kapa ho thothomela, hlooho e bohloko haholo le mahlo a sa boneng hantle, feberu le bofokodi bo sa mo dumelleng ho tsoha betheng, bohloko bo matla ba mpa, kapa ho hema kapele kapa ka thata.'
      short: 'Eya sepetlele HONA JOALE bakeng sa: ho tswa madi, sethoathoa, hlooho e bohloko haholo le mahlo a sa boneng, feberu le bofokodi bo boholo, mpa e bohloko haholo.'
