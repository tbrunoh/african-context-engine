    ti:
      claim: 'ንሕማም ምንቕፋፍ ባናና (Xanthomonas) ፈውሲ የለን። ተኽሊ ምልክት ምስ ኣርኣየ፣ ኣብ ደረጃ መሬት ቁረጾ ጥዑያት ኣትኽልቲ ድማ ኣብቲ ጉጅለ ባናና ግደፎም። ድሕሪ ነፍሲ ወከፍ ምቑራጽ ነቲ መሳርሒ ንሓንቲ ደቒቕ ኣብ ሓዊ ብምሓዝ ወይ ብሳሙናን ማይን ወይ ብበረኪና ብምሕጻብ ኣጽርዮ። እታ ናይ መወዳእታ ኢድ ባናና ምስ ወጸት፣ ነታ ተባዕታይ ዕምባባ ብክልተ ጨንፈር ዘለዎ በትሪ ኣልግሳ፣ ኣትኽልቲ ድማ ኩሉ ግዜ ተመልከት።'
