  safety.OR_WORD: "okanye"
  safety.EMERGENCY_WORD: "ingxakeko"
  safety.FALLBACK_NUMBERS: "Tsalela inombolo yengxakeko yendawo yakho okanye uye esibhedlele esikufutshane."

  commands.TEXTS.help: "I-ACE inika iingcebiso zendawo ezihloliweyo. Buza ngolwimi lwakho. Imiyalelo: UBUQHETSEBA + umyalezo ukuze uhlole umyalezo, ICEBO + icebo lakho ukwabelana ngolwazi, IMITHOMBO, NGAKUMBI, ULWIMI + ikhowudi (umz. ULWIMI EN), CIMA ukucima iinkcukacha zakho."
  commands.TEXTS.help_short: "Buza i-ACE ngolwimi lwakho. UBUQHETSEBA + umyalezo iyawuhlola. CIMA icima iinkcukacha zakho."
  commands.TEXTS.forgotten: "Kwenziwe. I-ACE icime yonke into ebinayo ngale nombolo."
  commands.TEXTS.stopped: "Akusayi kufumana miyalezo kwi-ACE ngaphandle kokuba ubhala kwakhona. Thumela CIMA ukucima iinkcukacha zakho."
  commands.TEXTS.language: "Phendula ngo-ULWIMI nekhowudi:"
  commands.TEXTS.tip_thanks: "Enkosi. Icebo lakho ligciniwe ukuze lihlolwe yingcali. Alizukwabelwana lingekahlolwa."
  commands.TEXTS.tip_usage: "Thumela ICEBO necebo lakho, umz.: ICEBO amagqabi e-neem ayanceda kwisibungu sombona eMpuma Koloni."
  commands.TEXTS.scam_usage: "Thumela UBUQHETSEBA nomyalezo ongawuthembiyo, i-ACE iza kuwuhlola."
  commands.TEXTS.no_sources: "Akukho mpendulo yangaphambili enokubonisa umthombo wayo. Buza umbuzo kuqala."
  commands.TEXTS.no_more: "Yiloo nto kuphela i-ACE enayo ngalo mbandela okwangoku. Buza omnye umbuzo okanye uthumele UNCEDO."
  commands.TEXTS.clarify: "I-ACE ayikabi nasikhokelo sihloliweyo ngoko. I-ACE inokukunceda nge: {topics}. Thumela ICEBO ukongeza ulwazi."
  commands.TEXTS.unread: "I-ACE ayikakwazi ukufunda olu lwimi. Nceda ubhale ngolunye kwezi: {languages}."

