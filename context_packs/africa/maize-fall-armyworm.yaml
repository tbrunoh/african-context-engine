  translations:
    sw:
      claim: Tembelea mahindi yako mara kwa mara kuyakagua. Kagua mimea 50 kwa kutembea kwa umbo la W shambani, ukisimama
        sehemu tano na kuangalia katikati ya kilele cha mimea kumi katika kila sehemu.
      short: 'Kagua mara kwa mara: tembea kwa umbo la W, simama sehemu 5, angalia kilele cha mimea 10 kila sehemu.'
    fr:
      claim: 'Visitez souvent votre champ de maïs pour le surveiller. Examinez 50 plants en traversant le champ en forme
        de W : arrêtez-vous en cinq points et regardez dans le cornet de dix plants à chaque point.'
      short: 'Surveillez souvent : traversez le champ en W, arrêtez-vous en 5 points, examinez le cornet de 10 plants
        à chacun.'
    pt:
      claim: 'Visite o seu milho com frequência para vigiar. Verifique 50 plantas, percorrendo o campo em forma de W, parando em cinco pontos e olhando para o cartucho de dez plantas em cada ponto.'
      short: 'Vigie com frequência: percorra o campo em W, pare em 5 pontos e veja o cartucho de 10 plantas em cada um.'
      reviewed: false
    ar:
      claim: 'زر حقل الذرة كثيرًا للاستكشاف. افحص 50 نبتة بالمشي على شكل حرف W عبر الحقل، والتوقف عند خمس نقاط، والنظر في قلوب عشر نباتات عند كل نقطة.'
      short: 'استكشف كثيرًا: امشِ على شكل W عبر الحقل، وتوقف عند 5 نقاط، وافحص قلب 10 نباتات عند كل نقطة.'
      reviewed: false
    am:
      claim: 'ለመቃኘት የበቆሎ ማሳዎን በተደጋጋሚ ይጎብኙ። በማሳው ላይ W ቅርጽ እየተጓዙ፣ በአምስት ቦታዎች ቆመው በእያንዳንዱ ቦታ የአሥር ተክሎችን እንብርት በማየት 50 ተክሎችን ይፈትሹ።'
      short: 'በተደጋጋሚ ይቃኙ፡ በማሳው ላይ W ቅርጽ ይጓዙ፣ በ5 ቦታዎች ቆመው በእያንዳንዱ የ10 ተክሎችን እንብርት ይፈትሹ።'
      reviewed: false
    om:
      claim: 'Sakatta''uuf maasii boqqolloo keessanii yeroo baay''ee daawwadhaa. Maasii keessa bifa W deemuun, bakka shanitti dhaabbachuun, bakka tokkoon tokkoon isaatti handhuura biqiltuu kudhanii ilaaluun biqiltuu 50 sakatta''aa.'
      short: 'Yeroo baay''ee sakatta''aa: maasii keessa bifa W deemaa, bakka 5tti dhaabbadhaa, bakka hundatti handhuura biqiltuu 10 ilaalaa.'
