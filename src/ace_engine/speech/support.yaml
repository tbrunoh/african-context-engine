# What exists today to hear and speak each ACE language, and to translate it.
# speak.say is a Google Cloud Text-to-Speech voice, the kind the Africa's Talking Say action reads with.
# speak.play is a Gemini TTS model: ACE synthesises the audio and the call plays it with the Play action.
# Every line was checked against the source named in `sources` on 26 November 2026. Preview means the provider
# has not made the model generally available. Re-check before launching a voice line; providers add languages
# without notice. `ace voice languages` prints this table.
checked_on: "2026-11-26"
sources:
  google_stt: https://docs.cloud.google.com/speech-to-text/docs/models/chirp-3
  google_stt_languages: https://cloud.google.com/speech-to-text/v2/docs/speech-to-text-supported-languages
  google_tts: https://docs.cloud.google.com/text-to-speech/docs/chirp3-hd
  google_tts_voices: https://docs.cloud.google.com/text-to-speech/docs/voices
  google_translate: https://docs.cloud.google.com/translate/docs/languages
  gemini_tts: https://ai.google.dev/gemini-api/docs/speech-generation
  gemini_transcribe: https://ai.google.dev/gemini-api/docs/models/gemini-3.5-transcribe
  africastalking_say: https://developers.africastalking.com/docs/voice/actions/say
  waxal: https://huggingface.co/datasets/google/WaxalNLP

languages:
  en:
    hear: {provider: "google_stt", model: "chirp_3", locale: "en-US", stage: "GA"}
    speak:
      say: {provider: "google_tts", locale: "en-US", voices: "Chirp 3 HD, Neural2, WaveNet, Standard"}
      play: {provider: "gemini_tts", model: "gemini-3.8-flash-tts"}
    translate: {provider: "google_translate", model: "NMT and Translation LLM"}
    waxal: null
  sw:
    hear: {provider: "google_stt", model: "chirp_3", locale: "sw-KE", stage: "Preview", note: "Gemini 3.5 Transcribe also lists sw-KE"}
    speak:
      say: {provider: "google_tts", locale: "sw-KE", voices: "Chirp 3 HD"}
      play: {provider: "gemini_tts", model: "gemini-3.8-flash-tts", note: "Not in Gemini 3.8 Flash-Lite TTS"}
    translate: {provider: "google_translate", model: "NMT and Translation LLM"}
    waxal: {tts_utterances: 1778, note: "Voice scripts from Makerere University and Loud and Clear; no transcribed speech"}
  fr:
    hear: {provider: "google_stt", model: "chirp_3", locale: "fr-FR", stage: "GA", note: "No African French locale"}
    speak:
      say: {provider: "google_tts", locale: "fr-FR", voices: "Chirp 3 HD, Neural2, WaveNet, Standard", note: "No African French voice"}
      play: {provider: "gemini_tts", model: "gemini-3.8-flash-tts"}
    translate: {provider: "google_translate", model: "NMT and Translation LLM"}
    waxal: null
  pt:
    hear: {provider: "google_stt", model: "chirp_3", locale: "pt-PT", stage: "GA", note: "No Mozambican or Angolan locale"}
    speak:
      say: {provider: "google_tts", locale: "pt-PT", voices: "WaveNet, Standard"}
      play: {provider: "gemini_tts", model: "gemini-3.8-flash-tts"}
    translate: {provider: "google_translate", model: "NMT and Translation LLM"}
    waxal: null
  ar:
    hear: {provider: "google_stt", model: "chirp_3", locale: "ar-EG", stage: "Preview", note: "Algeria, Egypt, Morocco and Tunisia locales; none for Libya, Sudan or Chad"}
    speak:
      say: {provider: "google_tts", locale: "ar-XA", voices: "Chirp 3 HD, WaveNet, Standard", note: "Modern Standard Arabic"}
      play: {provider: "gemini_tts", model: "gemini-3.8-flash-tts", note: "Standard Arabic and Egyptian Arabic"}
    translate: {provider: "google_translate", model: "NMT and Translation LLM"}
    waxal: null
  am:
    hear: {provider: "google_stt", model: "chirp_3", locale: "am-ET", stage: "Preview", note: "Gemini 3.5 Transcribe also lists am-ET"}
    speak:
      say: null
      play: {provider: "gemini_tts", model: "gemini-3.8-flash-tts"}
    translate: {provider: "google_translate", model: "NMT; Translation LLM experimental"}
    waxal: {asr_hours: 219.9, asr_utterances: 44354, note: "Transcribed speech from Digital Umuganda; no voice scripts"}
  om:
    hear: {provider: "google_stt", model: "chirp_2", locale: "om-ET", stage: "Listed", note: "Checked 26 November 2026; regional model, us-central1"}
    speak:
      say: null
      play: null
    translate: {provider: "google_translate", model: "NMT"}
    waxal: {asr_hours: 222.7, asr_utterances: 45045, note: "Transcribed speech from Digital Umuganda; no voice scripts"}
  so:
