templates:
  safety.OPENERS.self_harm: "Birambabaje cane kubona wiyumva gutyo. Ukwiye kuronka imfashanyo ubu nyene. {numbers}"
  safety.OPENERS.maternal: "Ibi vyoshobora kuba ingorane yihuta y'imbanyi. Ja ku bitaro biri hafi ubu nyene. {numbers}"
