  commands.TEXTS.help: "ACE dafay joxe ndigal yu ñu saytu ci sa gox. Laajal ci sa làkk. Ndigal: NAXE + bataaxal ngir saytu bataaxal, DIGLE + sa digle ngir séddoo xam-xam, JÓGEWAAY, YENEEN, LÀKK + kood (ni LÀKK EN), FATTE ngir far sa xibaar."
  commands.TEXTS.help_short: "Laajal ACE ci sa làkk. NAXE + bataaxal dina ko saytu. FATTE dina far sa xibaar."
  commands.TEXTS.forgotten: "Def nañu ko. ACE far na lépp lu mu amoon ci nimero bii."
  commands.TEXTS.stopped: "Doo jot bataaxal ACE ba nga bindaat. Yónnee FATTE ngir far sa xibaar."
  commands.TEXTS.language: "Tontul LÀKK ak kood:"
  commands.TEXTS.tip_thanks: "Jërëjëf. Sa digle denc nañu ko ngir boroom xam-xam saytu ko. Duñu ko séddoo bala ñu koy saytu."
  commands.TEXTS.tip_usage: "Yónnee DIGLE ak sa digle, ni: DIGLE xobu neem dafay dimbali ci sóoboo mbóq ci Kaolack."
  commands.TEXTS.scam_usage: "Yónnee NAXE ak bataaxal bi nga gëmul, ACE dina ko saytu."
  commands.TEXTS.no_sources: "Amul tontu bu jiitu bu ñu man a won fu mu jóge. Laajal laaj ba pare."
  commands.TEXTS.no_more: "Loolu mooy lépp li ACE am ci mbir mii léegi. Laajal beneen laaj walla yónnee NDIMBAL."
  commands.TEXTS.clarify: "ACE amagul ndigal yu ñu saytu ci loolu. ACE man na la dimbali ci: {topics}. Yónnee DIGLE ngir yokk xam-xam."
  commands.TEXTS.unread: "ACE mënagul a jàng làkk wii. Bu la neexee, bindal ci benn ci làkk yii: {languages}."

