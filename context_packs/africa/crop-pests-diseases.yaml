    yo:
      claim: 'Idin kokoro ewe tomati n wa ọna gbooro ti o n dan bi fadaka ninu ewe tomati, ti o di pupa rusurusu ti o si gbẹ. Wọn tun n lu inu igi ati eso, ti wọn si fi iho ijade silẹ ninu eso naa. Awọn idin naa jẹ alawọ ewe si pinki, gigun titi de 9 mm, pẹlu ila dudu lẹhin ori. Igba, ata ati ọdunkun le tun jẹ ikọlu.'
      short: 'Ami kokoro ewe tomati: ọna ti o n dan bi fadaka ninu ewe ti o di pupa rusurusu, iho ninu eso, idin kekere alawọ ewe si pinki pẹlu ila dudu.'
