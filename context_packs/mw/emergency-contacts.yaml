- id: national-emergency
  claim: In Malawi, call 998 for an ambulance, 990 or 997 for the police and 999 for the fire service. Emergency lines can
    be unreliable, so if a call does not connect, go straight to the nearest health facility.
  short: 'Emergency in Malawi: ambulance 998, police 990 or 997, fire 999. If no answer, go to the nearest facility.'
