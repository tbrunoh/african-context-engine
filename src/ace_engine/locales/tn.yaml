  safety.CALL_WORD: "Leletsa {numbers}"
  safety.OR_WORD: "kgotsa"
  safety.EMERGENCY_WORD: "tshoganyetso"
  safety.FALLBACK_NUMBERS: "Leletsa nomore ya tshoganyetso ya kwa lefelong la gago kgotsa o ye kwa bookelong jo bo gaufi."

  commands.TEXTS.help: "ACE e naya kgakololo ya lefelo e e tlhatlhobilweng. Botsa ka puo ya gago. Ditaelo: BOFORA + molaetsa go tlhatlhoba molaetsa, KGAKOLOLO + kgakololo ya gago go abelana kitso, METSWEDI, GAPE, PUO + khoutu (sk. PUO EN), PHIMOLA go phimola tshedimosetso ya gago."
  commands.TEXTS.help_short: "Botsa ACE ka puo ya gago. BOFORA + molaetsa e a o tlhatlhoba. PHIMOLA e phimola tshedimosetso ya gago."
  commands.TEXTS.forgotten: "Go dirilwe. ACE e phimotse sotlhe se e neng e na le sone ka nomore e."
  commands.TEXTS.stopped: "Ga o kitla o tlhola o amogela melaetsa go tswa kwa ACE fa e se fa o kwala gape. Romela PHIMOLA go phimola tshedimosetso ya gago."
  commands.TEXTS.language: "Araba ka PUO le khoutu:"
  commands.TEXTS.tip_thanks: "Re a leboga. Kgakololo ya gago e bolokilwe gore moitseanape a e tlhatlhobe. Ga e kitla e abelanwa pele e tlhatlhobiwa."
  commands.TEXTS.tip_usage: "Romela KGAKOLOLO le kgakololo ya gago, sk.: KGAKOLOLO matlhare a neem a thusa kgatlhanong le seboko sa mmidi kwa Kgatleng."
  commands.TEXTS.scam_usage: "Romela BOFORA le molaetsa o o sa o ikanyeng, ACE e tla o tlhatlhoba."
  commands.TEXTS.no_sources: "Ga go na karabo ya pele e go ka bontshiwang motswedi wa yone. Botsa potso pele."
  commands.TEXTS.no_more: "Ke sotlhe se ACE e nang le sone ka kgang e ga jaana. Botsa potso e nngwe kgotsa o romele THUSO."
  commands.TEXTS.clarify: "ACE ga e ise e nne le kaedi e e tlhatlhobilweng ka seo. ACE e ka go thusa ka: {topics}. Romela KGAKOLOLO go oketsa kitso."
  commands.TEXTS.unread: "ACE ga e ise e kgone go bala puo e. Tsweetswee kwala ka nngwe ya tseno: {languages}."

