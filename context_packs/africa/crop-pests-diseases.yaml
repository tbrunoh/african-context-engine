    fuf:
      claim: 'Ittu bonnu ɓiɓɓe tomati ɗe ɓowɗi nanngi law, ittu ko aawi goɗɗum ɗo ɓowɗi ɗii ngoni ɓadii ngesa. Ɗaŋɗi pheromone ina nangga ɓowɗi fiirooɗi, ko waɗaa e neem walla Bacillus thuringiensis ina waawi wallude. Mbuuftugol lekki ganndangal ina wonaa nafoore laabi keewɗi ngam ɓowɗi ina ñaama nder haakoo ɓowɗi kadi ina mbaawi lekki law, ɗum noon naamnu ballotooɗo ndema ado mbuuftaa lekki.'
      short: 'Ɓowɗi tomati: bonnu ɓiɓɓe nanngaaɗe, huutoro ɗaŋɗi pheromone, neem walla Bt; naamnu ballotooɗo ndema ado mbuuftaa lekki.'
