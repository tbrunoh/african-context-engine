# Eʋegbe (Ewe) for Ghana and Togo, in the standard spelling. SMS folds the letters ɖ, ɛ, ƒ, ɣ, ŋ, ɔ and ʋ to
# their closest Latin letters, as most people type them. Drafted for ACE 2.3. Awaiting review by fluent speakers
# and, for the safety phrases, by clinicians.
meta:
  code: ee
  name: Ewe
  native: "Eʋegbe"
  script: Latn
  encoding: gsm7
  direction: ltr
  reviewed: false
  confirm: "ACE aɖo eŋu na wò le Eʋegbe me."
  names: ["evegbe", "eʋegbe", "ewe", "ee"]

templates:
  safety.OPENERS.self_harm: "Eve nam ŋutɔ be èse le ɖokuiwò me alea. Ele be nàxɔ kpeɖeŋu fifia. {numbers}"
