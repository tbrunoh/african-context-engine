- id: tuta-action
  claim: Remove and destroy infested tomato fruit quickly and clear other host plants around the field. Pheromone traps
    catch the moths, and products based on neem or Bacillus thuringiensis can help. Ordinary sprays often fail because the
    larvae feed inside the leaf, and the pest soon resists pesticides, so ask an extension officer before spraying.
  short: 'Tomato leaf miner: destroy infested fruit, use pheromone traps, neem or Bt products; ask an extension officer before
    spraying.'
  topic: pest
  vertical: agriculture
  kind: action
  subjects:
  - tomato
  keywords: [tomato, tuta, leaf, miner, control, trap, pheromone, neem, nyanya, mtego, dawa, tomate, piege, lutte,
             traça, طماطم, حافرة, ቲማቲም, ቆፋሪ, timaatimii, yaanyo, yaanyada]
  translations:
    sw:
      claim: Ondoa na uharibu haraka matunda ya nyanya yaliyoshambuliwa na safisha mimea mingine inayowahifadhi wadudu hawa
        kuzunguka shamba. Mitego ya feromoni huwanasa nondo, na bidhaa za mwarobaini au Bacillus thuringiensis zinaweza
        kusaidia. Dawa za kawaida mara nyingi hushindwa kwa sababu viwavi hula ndani ya jani, na mdudu huyu huzoea dawa
        haraka, hivyo uliza afisa ugani kabla ya kunyunyizia.
      short: 'Tuta absoluta: haribu nyanya zilizoshambuliwa, tumia mitego ya feromoni, mwarobaini au Bt; uliza afisa ugani
        kabla ya kunyunyizia.'
    fr:
      claim: >-
        Enlevez et détruisez vite les fruits infestés et éliminez les autres plantes hôtes autour du champ. Les pièges à
        phéromones capturent les papillons, et les produits à base de neem ou de Bacillus thuringiensis peuvent aider. Les
        traitements ordinaires échouent souvent car les larves se nourrissent dans la feuille et le ravageur devient vite
        résistant, alors demandez à un agent de vulgarisation avant de traiter.
      short: 'Mineuse de la tomate : détruisez les fruits infestés, pièges à phéromones, neem ou Bt ; demandez à un agent
        agricole avant de traiter.'
    pt:
      claim: 'Retire e destrua rapidamente os frutos de tomate infestados e elimine outras plantas hospedeiras à volta do campo. As armadilhas de feromonas apanham as traças, e produtos à base de nim ou Bacillus thuringiensis podem ajudar. As pulverizações comuns falham muitas vezes porque as larvas se alimentam dentro da folha, e a praga ganha depressa resistência aos pesticidas, por isso pergunte a um extensionista antes de pulverizar.'
      short: 'Traça-do-tomateiro: destrua os frutos infestados, use armadilhas de feromonas, produtos de nim ou Bt; pergunte a um extensionista antes de pulverizar.'
      reviewed: false
    ar:
      claim: 'أزل ثمار الطماطم المصابة وأتلفها بسرعة، وأزل النباتات العائلة الأخرى حول الحقل. تصطاد مصائد الفيرومون الفراشات، وقد تساعد منتجات النيم أو باسيلس ثورينجينسيس. كثيرًا ما تفشل المبيدات العادية لأن اليرقات تتغذى داخل الورقة، وسرعان ما تقاوم الآفة المبيدات، لذا اسأل المرشد الزراعي قبل الرش.'
      short: 'حافرة أوراق الطماطم: أتلف الثمار المصابة، واستخدم مصائد الفيرومون ومنتجات النيم أو Bt، واسأل المرشد الزراعي قبل الرش.'
