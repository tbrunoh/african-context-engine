  commands.TEXTS.help: "ACE itanga inama z'aho uri zagenzuwe. Baza mu rurimi rwawe. Amabwiriza: UBURIGANYA + ubutumwa kugenzura ubutumwa, IMPANURO + inama yawe gusangiza ubumenyi, INKOMOKO, IBINDI, URURIMI + kode (urugero URURIMI EN), SIBA gusiba amakuru yawe."
  commands.TEXTS.help_short: "Baza ACE mu rurimi rwawe. UBURIGANYA + ubutumwa burabugenzura. SIBA isiba amakuru yawe."
  commands.TEXTS.forgotten: "Byakozwe. ACE yasibye ibyo yari ifite byose kuri iyi nimero."
  commands.TEXTS.stopped: "Ntuzongera kwakira ubutumwa bwa ACE keretse wongeye kwandika. Ohereza SIBA gusiba amakuru yawe."
  commands.TEXTS.language: "Subiza URURIMI na kode:"
  commands.TEXTS.tip_thanks: "Murakoze. Inama yawe yabitswe kugira ngo inzobere iyigenzure. Ntizasangizwa itaragenzurwa."
  commands.TEXTS.tip_usage: "Ohereza IMPANURO n'inama yawe, urugero: IMPANURO amababi ya neem afasha kurwanya nkongwa mu majyepfo."
  commands.TEXTS.scam_usage: "Ohereza UBURIGANYA n'ubutumwa utizera, ACE izabugenzura."
  commands.TEXTS.no_sources: "Nta gisubizo cya mbere cyerekanwa aho cyaturutse. Banza ubaze ikibazo."
  commands.TEXTS.no_more: "Ibyo ni byo byose ACE ifite kuri iyi ngingo ubu. Baza ikindi kibazo cyangwa wohereze UBUFASHA."
  commands.TEXTS.clarify: "ACE ntiragira inama zagenzuwe kuri ibyo. ACE ishobora kugufasha kuri: {topics}. Ohereza IMPANURO wongereho ubumenyi."
  commands.TEXTS.unread: "ACE ntirashobora gusoma uru rurimi. Turakwinginze wandike muri rumwe muri izi: {languages}."

