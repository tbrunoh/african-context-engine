  translations:
    sw:
      claim: Viwavi wachanga wa viwavijeshi vamizi hukwangua majani ya mahindi na kuacha madoa membamba kama madirisha.
        Viwavi wakubwa hujificha katikati ya kilele cha mmea, hula majani machanga na kuacha kinyesi kibichi kama unga
        wa mbao.
      short: 'Dalili: madoa kama madirisha kwenye majani, kilele kilicholiwa, kinyesi kibichi kama unga wa mbao.'
    fr:
      claim: Les jeunes larves de la chenille légionnaire d'automne grattent les feuilles de maïs et laissent de fines
        plages transparentes, comme des fenêtres. Les larves plus âgées se cachent dans le cornet, déchiquettent les
        jeunes feuilles et laissent des excréments humides qui ressemblent à de la sciure.
      short: 'Signes : plages transparentes sur les feuilles, cornet déchiqueté, excréments humides comme de la sciure.'
  source: ICIPE, Fall armyworm identification, management and control; CIFOR-ICRAF, Fall Armyworm guide
