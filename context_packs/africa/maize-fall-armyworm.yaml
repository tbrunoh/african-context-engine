- id: push-pull
  claim: Push-pull reduces fall armyworm. Plant Desmodium between maize rows to repel the moths, and Napier or Brachiaria
    grass around the field border to attract them away. Desmodium also controls Striga weed, and both plants are good
    fodder.
  short: 'Push-pull: Desmodium between maize rows, Napier or Brachiaria grass around the edge. Cuts armyworm.'
