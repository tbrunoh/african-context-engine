facts:
- id: mln-signs
  claim: Maize lethal necrosis starts as yellow mottling on the leaves. The leaves then die from the edges inward, the
    young centre of the plant dies (dead heart), husks dry early and cobs fill with little or no grain.
  short: 'MLN signs: yellow mottled leaves dying from the edges, a dead centre (dead heart), husks drying early, cobs with
    little or no grain.'
  topic: crop_disease
  vertical: agriculture
  kind: sign
  subjects:
  - maize
  keywords: [maize, mln, lethal, necrosis, mottling, yellow, dead, heart, husks, mahindi, njano, kufa, mais,
             jaunissement, necrose, milho, ذرة, نخر, በቆሎ, ኒክሮሲስ, boqqolloo, galley, galleyda]
  translations:
    sw:
      claim: Ugonjwa wa mahindi wa MLN huanza kama madoa ya njano kwenye majani. Kisha majani hukauka kuanzia kingoni
        kuelekea ndani, kitovu cha mmea hufa, maganda hukauka mapema na mahindi hujaa punje chache au hakuna kabisa.
      short: 'Dalili za MLN: majani yenye madoa ya njano yanayokauka kuanzia kingoni, kitovu kufa, maganda kukauka mapema,
        punje chache.'
    fr:
      claim: La nécrose létale du maïs commence par des marbrures jaunes sur les feuilles. Les feuilles meurent ensuite
        depuis les bords, le cœur de la plante meurt, les spathes sèchent tôt et les épis se remplissent peu ou pas du tout.
      short: 'Nécrose létale du maïs : feuilles marbrées de jaune qui meurent depuis les bords, cœur mort, spathes sèches tôt,
        épis peu remplis.'
    pt:
      claim: 'A necrose letal do milho começa com manchas amarelas nas folhas. Depois as folhas morrem das bordas para dentro, o centro jovem da planta morre (coração morto), as palhas secam cedo e as maçarocas enchem com pouco ou nenhum grão.'
      short: 'Sinais de MLN: folhas com manchas amarelas que morrem das bordas, centro morto, palhas a secar cedo, maçarocas com pouco ou nenhum grão.'
      reviewed: false
    ar:
      claim: 'يبدأ مرض النخر المميت للذرة ببقع صفراء متفرقة على الأوراق. ثم تموت الأوراق من الحواف نحو الداخل، ويموت قلب النبتة الصغير (القلب الميت)، وتجف أغلفة الكيزان مبكرًا، وتمتلئ الكيزان بقليل من الحبوب أو بلا حبوب.'
      short: 'علامات النخر المميت للذرة: أوراق مبقعة بالأصفر تموت من الحواف، قلب ميت، أغلفة تجف مبكرًا، كيزان بلا حبوب تقريبًا.'
      reviewed: false
    am:
      claim: 'የበቆሎ ገዳይ ኒክሮሲስ በቅጠሎች ላይ በቢጫ ዥንጉርጉር ይጀምራል። ከዚያም ቅጠሎቹ ከጠርዝ ወደ ውስጥ ይደርቃሉ፣ የተክሉ ለጋ መሃል ይሞታል (የሞተ ልብ)፣ ገለባው ቀድሞ ይደርቃል፣ እሸቱም ጥቂት ወይም ምንም ፍሬ አይይዝም።'
      short: 'የMLN ምልክቶች፡ ቢጫ ዥንጉርጉር ቅጠሎች ከጠርዝ መድረቅ፣ የሞተ መሃል፣ ገለባ ቀድሞ መድረቅ፣ ጥቂት ወይም ምንም ፍሬ የሌለው እሸት።'
      reviewed: false
    om:
      claim: 'Dhukkubni MLN boqqolloo baala irratti tuqaalee keelloo ta''ee jalqaba. Achiis baalli qarqara irraa gara keessaatti du''a, giddu galeessi biqiltuu haaraan ni du''a (onnee du''e), qolli dafee goga, boqqolloonis ija xiqqaa ykn homaa hin qabatu.'
      short: 'Mallattoo MLN: baala tuqaa keelloo qarqara irraa du''u, giddu galeessa du''e, qola dafee gogu, ija xiqqaa ykn homaa.'
      reviewed: false
    so:
      claim: 'Cudurka dila galleyda (MLN) wuxuu ku bilaabmaa dhibco huruud ah oo caleemaha ku firirsan. Kadib caleemaha ayaa ka dhinta cidhifyada xagga gudaha, bartamaha yar ee geedka ayaa dhinta (wadne dhintay), qolofta sabuulka ayaa goor hore engegta, sabuulkuna wuxuu buuxsamaa iniin yar ama midna.'
      short: 'Calaamadaha MLN: caleemo dhibco huruud leh oo cidhifyada ka dhinta, bartame dhintay, qolof goor hore engegta, sabuul iniin yar ama aan lahayn.'
      reviewed: false
    ti:
      claim: 'ቀታሊ ሕማም ዕፉን (MLN) ከም ብጫ ነጠብጣባት ኣብ ቆጽሊ ይጅምር። ድሕሪኡ ቆጽሊ ካብ ጫፉ ናብ ውሽጢ ይመውት፣ ልቢ ናይ ንእሽቶ ተኽሊ ይመውት (ዝሞተ ልቢ)፣ ቅራፍ ዕፉን ቀልጢፉ ይነቕጽ፣ ዕፉን ድማ ውሑድ ፍረ ወይ ዋላ ሓንቲ ፍረ የብሉን።'
      short: 'ምልክታት MLN: ብጫ ነጠብጣባት ዘለዎ ቆጽሊ ካብ ጫፉ ዝመውት፣ ዝሞተ ልቢ፣ ቀልጢፉ ዝነቕጽ ቅራፍ፣ ውሑድ ፍረ ዘለዎ ዕፉን።'
      reviewed: false
    fuf:
      claim: 'Ñawu makka warooɗo (MLN) ina fuɗɗoo no tobbe oolɗe e haakoo. Caggal ɗuum haakoo ɗoo ina maaya iwde e ceŋol haa nder, ɓernde ko aawi tokooso ina maaya (ɓernde maayɗo), ɗowɗi makka ina yooroo law, makka ina heewa e ɓiɓɓe seeɗa walla alaa.'
      short: 'Maandeeji MLN: haakoo jogiiɗo tobbe oolɗe maayooɗo iwde e ceŋol, ɓernde maayɗo, ɗowɗi yoorooɗi law, makka jogiiɗo ɓiɓɓe seeɗa.'
      reviewed: false
    mos:
      claim: 'Kamaan bãag sẽn kuud (MLN) singda wa miuug bãnd vãado zugu. Poor vãadã kiida n yi a noorã n kẽng sukã, kood bilfã sũurã kiida (sũur sẽn ki), kamaan pɛɛg kuumda tao-tao, la kamaanã tara buul bilf bi a ka tar ye.'
      short: 'MLN bãnde: vãad sẽn tar miuug bãnd la b kiid n yi noorã, sũur sẽn ki, kamaan pɛɛg sẽn kuumd tao-tao, kamaan sẽn tar buul bilf.'
      reviewed: false
    dyu:
      claim: 'Kaba bana min bɛ faga (MLN) bɛ daminɛ iko nɛrɛmuguman tomiw furaw kan. O kɔfɛ furaw bɛ sa ka bɔ u da la ka don cɛma, sɛnɛfɛn fitini dusukun bɛ sa (dusukun salen), kaba fara bɛ ja joona, ani kaba kisɛw bɛ dɔɔnin walima u tɛ yen.'
      short: 'MLN taamashiyɛnw: nɛrɛmuguman tomiw furaw kan minnu bɛ sa ka bɔ u da la, dusukun salen, kaba fara bɛ ja joona, kaba kisɛ dɔɔnin.'
      reviewed: false
    wo:
      claim: 'Feebar bu ray mbóq (MLN) dafay tàmbalee ni tomb yu mboq ci xob yi. Ginnaaw xob yi dañuy dee jóge ci cat bi ba ci biir, xolu gàncax gu ndaw gi dafay dee (xol bu dee), mbuxum mbóq mi dafay wow ci teel, te mbóq yi dañuy fees ak doom yu tuuti walla amuñu.'
      short: 'Màndargay MLN: xob yu am tomb yu mboq yuy dee jóge ci cat bi, xol bu dee, mbuxum mbuy wow ci teel, mbóq mu am doom yu tuuti.'
      reviewed: false
    ee:
      claim: 'Bli ƒe dɔlélé si wua nu (MLN) dzea egɔme abe dzẽ ƒe dzesiwo ene le aŋgbawo dzi. Emegbe aŋgbawo kuna tso ŋgɔ yi titina, nukuku sue ƒe dzi kuna (dzi si ku), bli ƒe gbalẽ ƒuna kaba, eye bliwo yɔa kple ku ʋɛ aɖewo alo womele eme o.'
      short: 'MLN ƒe dzesiwo: aŋgba siwo dzi dzẽ ƒe dzesiwo le eye wokuna tso ŋgɔ, dzi si ku, bli ƒe gbalẽ si ƒuna kaba, bli siwo me ku ʋɛ aɖewo le.'
      reviewed: false
    ak:
      claim: 'Aburow yare a ɛkum (MLN) fi ase sɛ akokɔsrades nsɛnkyerɛnne wɔ nhaban so. Afei nhaban no wu fi ano kɔ mfinimfini, afifide ketewa no koma wu (koma a awu), aburow ho nhoma wo ntɛm, na aburow no mu aba sua anaa enni hɔ koraa.'
      short: 'MLN nsɛnkyerɛnne: nhaban a akokɔsrades nsɛnkyerɛnne wɔ so na ɛwu fi ano, koma a awu, aburow ho nhoma a ewo ntɛm, aburow a ne mu aba sua.'
      reviewed: false
    ln:
      claim: 'Bokono oyo ebomaka masango (MLN) ebandaka lokola matono ya mosaka na nkasa. Sima nkasa ekufaka kobanda na nsuka kokota na kati, motema ya bilona ya moke ekufaka (motema ekufi), mposo ya masango ekaukaka noki, mpe masango etondaka na mbuma moke to ezali na yango te.'
      short: 'Bilembo ya MLN: nkasa na matono ya mosaka oyo ekufaka kobanda na nsuka, motema ekufi, mposo ekaukaka noki, masango na mbuma moke to te.'
      reviewed: false
    lg:
      claim: 'Obulwadde obutta kasooli (MLN) butandika ng''amabala aga kyenvu ku bikoola. Oluvannyuma ebikoola bifa okuva ku mabbali nga biyingira munda, omutima gw''ekirime ekito gufa (omutima ogufudde), ebisusunku by''ebikonde bikala mangu, era ebikonde bijjula empeke ntono oba nga tebirina.'
      short: 'Obubonero bwa MLN: ebikoola ebirina amabala aga kyenvu ebifa okuva ku mabbali, omutima ogufudde, ebisusunku ebikala mangu, ebikonde ebirina empeke ntono.'
      reviewed: false
    rn:
      claim: 'Indwara yica ibigori (MLN) itangura ari amabara y''umuhondo ku mababi. Hanyuma amababi arapfa ahereye ku mpera yinjira imbere, umutima w''ikimera gito urapfa (umutima wapfuye), ibishishwa vy''ikigori vyuma hakiri kare, kandi ibigori bikuzuramwo impeke nke canke ntizibemwo.'
      short: 'Ibimenyetso vya MLN: amababi afise amabara y''umuhondo apfa ahereye ku mpera, umutima wapfuye, ibishishwa vyuma kare, ibigori bifise impeke nke.'
      reviewed: false
    rw:
      claim: 'Indwara yica ibigori (MLN) itangira ari amabara y''umuhondo ku mababi. Hanyuma amababi apfa ahereye ku nkengero yinjira imbere, umutima w''igihingwa gito urapfa (umutima wapfuye), ibishishwa by''igikoro byuma kare, kandi ibikoro byuzuramo intete nke cyangwa ntizibemo.'
      short: 'Ibimenyetso bya MLN: amababi afite amabara y''umuhondo apfa ahereye ku nkengero, umutima wapfuye, ibishishwa byuma kare, ibikoro bifite intete nke.'
      reviewed: false
    bem:
      claim: 'Ubulwele ubwipaya amataba (MLN) butendeka nga utubala twa kashikila pa mabula. Lyena amabula yalafwa ukufuma ku mbali ukwingila mukati, umutima wa cilimwa icinono ulafwa (umutima uwafwa), ifikanda fya mataba filauma bwangu, kabili amataba yalaisulamo imbuto shinono nangu ukukanaba nashiko.'
      short: 'Ifishibilo fya MLN: amabula ya tubala twa kashikila ayalefwa ukufuma ku mbali, umutima uwafwa, ifikanda ifyauma bwangu, amataba ayali ne mbuto shinono.'
      reviewed: false
    ny:
      claim: 'Matenda opha chimanga (MLN) amayamba ngati mawanga achikasu pa masamba. Kenako masamba amafa kuyambira m''mbali kulowa mkati, mtima wa mbewu yaing''ono umafa (mtima wakufa), makoko a chisononkho amauma msanga, ndipo zisononkho zimadzaza ndi njere zochepa kapena kusakhala nazo.'
      short: 'Zizindikiro za MLN: masamba a mawanga achikasu omwe amafa kuyambira m''mbali, mtima wakufa, makoko omwe amauma msanga, zisononkho za njere zochepa.'
      reviewed: false
    sn:
      claim: 'Chirwere chinouraya chibage (MLN) chinotanga semavara eyero pamashizha. Mashizha anobva afa kubva kumicheto achipinda mukati, moyo wechirimwa chidiki unofa (moyo wakafa), mashizha emagwere anooma nekukurumidza, uye magwere anozara nembeu shoma kana kusava nadzo.'
      short: 'Zviratidzo zveMLN: mashizha ane mavara eyero anofa kubva kumicheto, moyo wakafa, mashizha emagwere anooma nekukurumidza, magwere ane mbeu shoma kana asina.'
      reviewed: false
    ts:
      claim: 'Vuvabyi lebyi dlayaka bya mavele (MLN) byi sungula tanihi swivati swo tshopana eka matluka. Kutani matluka ma fa ku suka emakumu ma nghena endzeni, mbilu ya ximila lexintsongo yi fa (mbilu leyi feke), matluka ya xithavi ma oma ka ha ri na nkarhi, naswona swithavi swi tala hi timbewu ti nga ri tingani kumbe ku nga ri na tona.'
      short: 'Swikombiso swa MLN: matluka ya swivati swo tshopana lama fa emakumu, mbilu leyi feke, swithavi leswi omaka ka ha ri na nkarhi swi ri na timbewu titsongo.'
      reviewed: false
    tn:
      claim: 'Bolwetse jo bo bolayang jwa mmidi (MLN) bo simolola jaaka matheba a serolwana mo matlhareng. Morago matlhare a swa go simolola kwa dintlheng a tsena kwa teng, pelo ya semela se sennye e a swa (pelo e e suleng), matlhare a ditsebe a omelela ka bonako, mme ditsebe di tlala ka ditlhaka di le mmalwa kgotsa di sa nne le tsone.'
      short: 'Matshwao a MLN: matlhare a matheba a serolwana a swang kwa dintlheng, pelo e e suleng, ditsebe tse di omelelang ka bonako di na le ditlhaka di le mmalwa.'
      reviewed: false
    st:
      claim: 'Lefu le bolayang la poone (MLN) le qala e le matheba a mosehla makgasing. Ebe makgasi a shwa ho tloha mathokong a kena ka hare, pelo ya semela se senyenyane e a shwa (pelo e shweleng), makgasi a sefaha a omella kapele, mme difaha di tlala ka dithollo tse fokolang kapa ha di na tsona.'
      short: 'Matshwao a MLN: makgasi a matheba a mosehla a shwang mathokong, pelo e shweleng, makgasi a sefaha a omellang kapele, difaha tse nang le dithollo tse fokolang.'
      reviewed: false
    af:
      claim: 'Dodelike mielienekrose (MLN) begin as geel kolle op die blare. Dan sterf die blare van die rand na binne, die hart van jong plante sterf (dooie hart), die kopblare droog vroeg uit, en die koppe vul met min of geen pitte.'
      short: 'MLN-tekens: geel gevlekte blare wat van die rand af sterf, dooie hart, kopblare wat vroeg uitdroog, koppe met min of geen pitte.'
      reviewed: false
    xh:
      claim: 'Isifo sombona esibulalayo (MLN) siqala njengamabala amthubi kumagqabi. Emva koko amagqabi ayafa ukusuka emiphethweni engena ngaphakathi, intliziyo yesityalo esincinci iyafa (intliziyo efileyo), amakhoba omqondo oma kwangethuba, kwaye imiqondo igcwala ngeenkozo ezimbalwa okanye ingabi nazo.'
      short: 'Iimpawu ze-MLN: amagqabi anamabala amthubi afa emiphethweni, intliziyo efileyo, amakhoba oma kwangethuba, imiqondo eneenkozo ezimbalwa okanye engenazo.'
      reviewed: false
    zu:
      claim: 'Isifo sommbila esibulalayo (MLN) siqala njengamabala aphuzi emaqabungeni. Bese amaqabunga efa kusukela emaphethelweni engena ngaphakathi, inhliziyo yesitshalo esisencane iyafa (inhliziyo efile), amakhasi esikhwebu ayoma kusenesikhathi, futhi izikhwebu zigcwala izinhlamvu ezimbalwa noma zingabi nazo.'
      short: 'Izimpawu ze-MLN: amaqabunga anamabala aphuzi afa emaphethelweni, inhliziyo efile, izikhwebu ezoma ngaphambi kwesikhathi ezinezinhlamvu ezimbalwa.'
      reviewed: false
    pcm:
      claim: 'Maize lethal necrosis (MLN) dey start as yellow marks for leaf. After, the leaf dey die from the edge go inside, the middle of young plant dey die (dead heart), the corn cover dey dry early, and the corn dey fill with small seed or no seed at all.'
      short: 'MLN signs: yellow mark for leaf wey dey die from edge, dead heart, corn cover wey dry early, corn wey get small seed or no seed.'
      reviewed: false
    ig:
      claim: 'Ọrịa ọka na-egbu egbu (MLN) na-amalite dịka ntụpọ edo edo n''akwụkwọ. Mgbe ahụ akwụkwọ na-anwụ site na nsọtụ banye n''ime, etiti osisi na-eto eto na-anwụ (etiti nwụrụ anwụ), ekpuchi ọka na-akpọnwụ n''oge, ọka na-ejupụta na mkpụrụ ole na ole ma ọ bụ enweghị.'
      short: 'Akara MLN: akwụkwọ nwere ntụpọ edo edo na-anwụ site na nsọtụ, etiti nwụrụ anwụ, ekpuchi na-akpọnwụ n''oge, ọka nwere mkpụrụ ole na ole ma ọ bụ enweghị.'
      reviewed: false
    yo:
      claim: 'Arun agbado apaniyan (MLN) bẹrẹ bi abawọn ofeefee lori ewe. Lẹhinna awọn ewe n ku lati eti wọ inu, aarin ọdọ ọgbin naa n ku (aarin ti o ku), eepo agbado n gbẹ ni kutukutu, ati ṣuku agbado n kun pẹlu irugbin diẹ tabi ko si rara.'
      short: 'Ami MLN: ewe ti o ni abawọn ofeefee ti n ku lati eti, aarin ti o ku, eepo ti n gbẹ ni kutukutu, ṣuku agbado ti o ni irugbin diẹ tabi ko si.'
      reviewed: false
    ha:
      claim: 'Cutar masara mai kisa (MLN) tana farawa da ɗigon rawaya a kan ganye. Sannan ganyen suna mutuwa daga gefe zuwa ciki, tsakiyar shukar mai ƙuruciya tana mutuwa (mataccen tsakiya), ɓawon kai yana bushewa da wuri kuma kan masara yana cika da ƙwaya kaɗan ko babu.'
      short: 'Alamun MLN: ganye masu ɗigon rawaya da ke mutuwa daga gefe, mataccen tsakiya, ɓawon kai yana bushewa da wuri, kan masara da ƙwaya kaɗan ko babu.'
      reviewed: false
  source: CIMMYT, Disease symptoms of maize lethal necrosis (MLN), farmer flyer
