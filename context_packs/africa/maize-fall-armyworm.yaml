- id: damage-signs
  claim: Young fall armyworm larvae scrape maize leaves and leave thin windowpane patches. Older larvae hide in the whorl,
    shred the young leaves and leave moist, sawdust like droppings called frass.
  short: 'Armyworm signs: windowpane patches on leaves, shredded whorl, wet sawdust like droppings in the whorl.'
