  <circle cx="354.0" cy="311.5" r="3" fill="#006B69"/>
  <text x="366.0" y="316" class="sans" font-size="13.5" fill="#3E4B52">Swahili voice pilot</text>
  <line x1="350.0" y1="342" x2="570.0" y2="342" stroke="#E8E2D9"/>
  <text x="350.0" y="366" class="sans" font-size="13.5" fill="#253239" font-weight="700">Gate: 99% recall on</text>
  <text x="350.0" y="386" class="sans" font-size="13" fill="#56636A">voice emergencies</text>
  <rect x="608.0" y="132" width="264.0" height="272" rx="14" fill="#FFFFFF" stroke="#E8E2D9"/>
  <text x="630.0" y="162" class="mono" font-size="12" fill="#364E3C" font-weight="700" letter-spacing="2">PHASE 3</text>
