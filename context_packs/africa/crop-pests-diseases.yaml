    am:
      claim: 'የተጠቁ የቲማቲም ፍሬዎችን በፍጥነት አስወግደው ያጥፉ፣ በማሳው ዙሪያ ያሉ ሌሎች አስተናጋጅ ተክሎችንም ያጽዱ። የፌሮሞን ወጥመዶች የእሳት እራቶችን ይይዛሉ፣ በኒም ወይም በባሲለስ ቱሪንጂየንሲስ ላይ የተመሠረቱ ምርቶችም ሊረዱ ይችላሉ። እጮቹ በቅጠሉ ውስጥ ስለሚመገቡ የተለመዱ ርጭቶች ብዙ ጊዜ አይሠሩም፤ ተባዩም ፀረ ተባይን በፍጥነት ይቋቋማል፤ ስለዚህ ከመርጨትዎ በፊት የግብርና ኤክስቴንሽን ባለሙያን ይጠይቁ።'
      short: 'የቲማቲም ቅጠል ቆፋሪ፡ የተጠቁ ፍሬዎችን ያጥፉ፣ የፌሮሞን ወጥመድ፣ የኒም ወይም የBt ምርቶችን ይጠቀሙ፤ ከመርጨትዎ በፊት የኤክስቴንሽን ባለሙያን ይጠይቁ።'
