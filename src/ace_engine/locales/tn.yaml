templates:
  safety.OPENERS.self_harm: "Ke maswabi thata gore o ikutlwa jaana. O tshwanetse go bona thuso jaanong. {numbers}"
  safety.OPENERS.maternal: "Se e ka nna tshoganyetso ya boimana. Ya kwa bookelong jo bo gaufi jaanong. {numbers}"
