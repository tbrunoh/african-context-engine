# Pular (Fuuta Jalon Fula) for Guinea, in the Latin spelling with ɓ, ɗ, ŋ, ɲ and ƴ, which SMS folds to b, d, ng,
# ny and y. Drafted for ACE 2.3 with lower confidence than most added languages: fluent speakers and, for the
# safety phrases, clinicians must review it first. Many speakers mix Pular with French, and the French safety
# phrases still apply to those messages.
