    pcm:
      claim: 'Cassava mosaic disease dey show twisted leaf with green and yellow or green and white patches. When e bad well well, new leaves dey small and twisted, and the plant no dey grow well. Leaf wey yellow or brown everywhere mean say na another problem. Whiteflies dey carry the disease from one plant go another.'
      short: 'Cassava mosaic signs: twisted leaf with green and yellow patches; small twisted new leaves; plant wey no grow. Whitefly dey spread am.'
      reviewed: false
    ig:
      claim: 'Ọrịa mosaic akpụ na-egosi akwụkwọ gbagọrọ agbagọ nwere ntụpọ akwụkwọ ndụ na edo edo ma ọ bụ akwụkwọ ndụ na ọcha. N''ọnọdụ siri ike, akwụkwọ ọhụrụ dị obere ma gbagọọ, osisi ahụ anaghịkwa eto nke ọma. Akwụkwọ ji edo edo ma ọ bụ aja aja n''ozuzu ya na-egosi nsogbu ọzọ. Ijiji ọcha (whiteflies) na-ebufe ọrịa ahụ site n''otu osisi gaa n''ọzọ.'
      short: 'Akara mosaic akpụ: akwụkwọ gbagọrọ agbagọ nwere ntụpọ akwụkwọ ndụ na edo edo; akwụkwọ ọhụrụ dị obere ma gbagọọ; osisi anaghị eto. Ijiji ọcha na-ebufe ya.'
      reviewed: false
    yo:
      claim: 'Arun mosaic gbaguda maa n fi ewe ti o ka pọ han pẹlu abawọn alawọ ewe ati ofeefee tabi alawọ ewe ati funfun. Ni ipo ti o buru, awọn ewe tuntun kere ti wọn si lọ́, ọgbin naa ko si dagba daradara. Ewe ti o jẹ ofeefee tabi pupa rusurusu ni gbogbo rẹ tọka si iṣoro miiran. Awọn eṣinṣin funfun (whiteflies) n tan arun naa lati ọgbin kan si omiran.'
      short: 'Ami mosaic gbaguda: ewe ti o ka pọ pẹlu abawọn alawọ ewe ati ofeefee; ewe tuntun kekere ti o lọ́; ọgbin ti ko dagba. Eṣinṣin funfun n tan an.'
      reviewed: false
    ha:
      claim: 'Cutar mosaic ta rogo tana bayyana a matsayin ganye masu lanƙwasa da ke da tabo kore da rawaya ko kore da fari. A mummunan yanayi sabbin ganye ƙanana ne kuma murɗaɗɗu, shukar kuma ba ta girma. Ganyen da suka yi rawaya ko launin ruwan ƙasa gaba ɗaya suna nuna wata matsala daban. Ƙananan ƙudaje farare (whiteflies) ne ke yaɗa cutar daga shuka zuwa shuka.'
      short: 'Alamun mosaic na rogo: ganye masu lanƙwasa da tabo kore da rawaya; sabbin ganye ƙanana murɗaɗɗu; shuka ba ta girma. Ƙudaje farare ne ke yaɗa ta.'
      reviewed: false
