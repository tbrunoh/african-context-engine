# Nigerian Pidgin (Naija), written the way most people type it on phones. Commands stay in English, as Naija
# speakers use them. Drafted for ACE 2.3. Awaiting review by fluent speakers and, for the safety phrases, by
# clinicians.
meta:
  code: pcm
  name: Nigerian Pidgin
  native: "Naija"
  script: Latn
  encoding: gsm7
  direction: ltr
  reviewed: false
  marker_weight: 2
  confirm: "ACE go dey answer you for Pidgin."
  names: ["pidgin", "naija", "naija pidgin", "pcm"]

