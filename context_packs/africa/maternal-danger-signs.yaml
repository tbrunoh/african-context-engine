  claim: A pregnant woman should go to a health centre as soon as possible if she has fever, abdominal pain, feels ill,
    or has swelling of the fingers, face and legs.
  short: 'See a health worker soon for: fever, belly pain, feeling ill, or swollen fingers, face and legs.'
