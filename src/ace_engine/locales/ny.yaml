  commands.TEXTS.help: "ACE imapereka malangizo a kwanuko otsimikizika. Funsani m'chilankhulo chanu. Malamulo: CHINYENGO + uthenga kuti muwone uthenga, MALANGIZO + malangizo anu kuti mugawane nzeru, MAGWERO, ZAMBIRI, CHILANKHULO + khodi (mwachitsanzo CHILANKHULO EN), FUFUTA kufufuta zambiri zanu."
  commands.TEXTS.help_short: "Funsani ACE m'chilankhulo chanu. CHINYENGO + uthenga imauwona. FUFUTA imafufuta zambiri zanu."
  commands.TEXTS.forgotten: "Zachitika. ACE yafufuta zonse zomwe inali nazo za nambala iyi."
  commands.TEXTS.stopped: "Simudzalandiranso mauthenga ochokera ku ACE pokhapokha mutalembanso. Tumizani FUFUTA kufufuta zambiri zanu."
  commands.TEXTS.language: "Yankhani CHILANKHULO ndi khodi:"
  commands.TEXTS.tip_thanks: "Zikomo. Malangizo anu asungidwa kuti katswiri awawone. Sadzagawidwa asanawunikidwe."
  commands.TEXTS.tip_usage: "Tumizani MALANGIZO ndi malangizo anu, mwachitsanzo: MALANGIZO masamba a neem amathandiza polimbana ndi mbozi za chimanga ku Kasungu."
  commands.TEXTS.scam_usage: "Tumizani CHINYENGO ndi uthenga womwe simukuukhulupirira, ACE iuwona."
  commands.TEXTS.no_sources: "Palibe yankho lakale loti tiwonetse komwe lachokera. Funsani funso kaye."
  commands.TEXTS.no_more: "Ndizo zonse zomwe ACE ili nazo pa nkhaniyi pakadali pano. Funsani funso lina kapena tumizani THANDIZO."
  commands.TEXTS.clarify: "ACE ilibe malangizo otsimikizika pa zimenezo. ACE ingakuthandizeni ndi: {topics}. Tumizani MALANGIZO kuti muwonjezere nzeru."
  commands.TEXTS.unread: "ACE sinathe kuwerenga chilankhulo ichi. Chonde lembani m'chimodzi mwa izi: {languages}."

