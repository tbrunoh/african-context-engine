- id: mln-signs
  claim: Maize lethal necrosis starts as yellow mottling on the leaves. The leaves then die from the edges inward, the
    young centre of the plant dies (dead heart), husks dry early and cobs fill with little or no grain.
  short: 'MLN signs: yellow mottled leaves dying from the edges, a dead centre (dead heart), husks drying early, cobs with
    little or no grain.'
  topic: crop_disease
  vertical: agriculture
  kind: sign
  subjects:
  - maize
  keywords: [maize, mln, lethal, necrosis, mottling, yellow, dead, heart, husks, mahindi, njano, kufa, mais,
             jaunissement, necrose, milho, ذرة, نخر, በቆሎ, ኒክሮሲስ, boqqolloo, galley, galleyda]
  translations:
    sw:
      claim: Ugonjwa wa mahindi wa MLN huanza kama madoa ya njano kwenye majani. Kisha majani hukauka kuanzia kingoni
        kuelekea ndani, kitovu cha mmea hufa, maganda hukauka mapema na mahindi hujaa punje chache au hakuna kabisa.
      short: 'Dalili za MLN: majani yenye madoa ya njano yanayokauka kuanzia kingoni, kitovu kufa, maganda kukauka mapema,
        punje chache.'
    fr:
      claim: La nécrose létale du maïs commence par des marbrures jaunes sur les feuilles. Les feuilles meurent ensuite
        depuis les bords, le cœur de la plante meurt, les spathes sèchent tôt et les épis se remplissent peu ou pas du tout.
      short: 'Nécrose létale du maïs : feuilles marbrées de jaune qui meurent depuis les bords, cœur mort, spathes sèches tôt,
        épis peu remplis.'
    pt:
      claim: 'A necrose letal do milho começa com manchas amarelas nas folhas. Depois as folhas morrem das bordas para dentro, o centro jovem da planta morre (coração morto), as palhas secam cedo e as maçarocas enchem com pouco ou nenhum grão.'
      short: 'Sinais de MLN: folhas com manchas amarelas que morrem das bordas, centro morto, palhas a secar cedo, maçarocas com pouco ou nenhum grão.'
      reviewed: false
    ar:
      claim: 'يبدأ مرض النخر المميت للذرة ببقع صفراء متفرقة على الأوراق. ثم تموت الأوراق من الحواف نحو الداخل، ويموت قلب النبتة الصغير (القلب الميت)، وتجف أغلفة الكيزان مبكرًا، وتمتلئ الكيزان بقليل من الحبوب أو بلا حبوب.'
      short: 'علامات النخر المميت للذرة: أوراق مبقعة بالأصفر تموت من الحواف، قلب ميت، أغلفة تجف مبكرًا، كيزان بلا حبوب تقريبًا.'
      reviewed: false
    am:
      claim: 'የበቆሎ ገዳይ ኒክሮሲስ በቅጠሎች ላይ በቢጫ ዥንጉርጉር ይጀምራል። ከዚያም ቅጠሎቹ ከጠርዝ ወደ ውስጥ ይደርቃሉ፣ የተክሉ ለጋ መሃል ይሞታል (የሞተ ልብ)፣ ገለባው ቀድሞ ይደርቃል፣ እሸቱም ጥቂት ወይም ምንም ፍሬ አይይዝም።'
      short: 'የMLN ምልክቶች፡ ቢጫ ዥንጉርጉር ቅጠሎች ከጠርዝ መድረቅ፣ የሞተ መሃል፣ ገለባ ቀድሞ መድረቅ፣ ጥቂት ወይም ምንም ፍሬ የሌለው እሸት።'
      reviewed: false
    om:
      claim: 'Dhukkubni MLN boqqolloo baala irratti tuqaalee keelloo ta''ee jalqaba. Achiis baalli qarqara irraa gara keessaatti du''a, giddu galeessi biqiltuu haaraan ni du''a (onnee du''e), qolli dafee goga, boqqolloonis ija xiqqaa ykn homaa hin qabatu.'
      short: 'Mallattoo MLN: baala tuqaa keelloo qarqara irraa du''u, giddu galeessa du''e, qola dafee gogu, ija xiqqaa ykn homaa.'
      reviewed: false
    so:
      claim: 'Cudurka dila galleyda (MLN) wuxuu ku bilaabmaa dhibco huruud ah oo caleemaha ku firirsan. Kadib caleemaha ayaa ka dhinta cidhifyada xagga gudaha, bartamaha yar ee geedka ayaa dhinta (wadne dhintay), qolofta sabuulka ayaa goor hore engegta, sabuulkuna wuxuu buuxsamaa iniin yar ama midna.'
      short: 'Calaamadaha MLN: caleemo dhibco huruud leh oo cidhifyada ka dhinta, bartame dhintay, qolof goor hore engegta, sabuul iniin yar ama aan lahayn.'
      reviewed: false
  source: CIMMYT, Disease symptoms of maize lethal necrosis (MLN), farmer flyer
