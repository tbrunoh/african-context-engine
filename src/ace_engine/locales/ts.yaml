  safety.FALLBACK_NUMBERS: "Ringela nomboro ya xihatla ya ndhawu ya wena kumbe u ya exibedlhele lexi nga ekusuhi."

  commands.TEXTS.help: "ACE yi nyika switsundzuxo swa ndhawu leswi kamberiweke. Vutisa hi ririmi ra wena. Swileriso: VUXISI + rungula ku kambela rungula, XITSUNDZUXO + xitsundzuxo xa wena ku avelana vutivi, SWIHLOVO, SWINWANA, RIRIMI + khodi (xik. RIRIMI EN), SULA ku sula vuxokoxoko bya wena."
  commands.TEXTS.help_short: "Vutisa ACE hi ririmi ra wena. VUXISI + rungula yi ri kambela. SULA yi sula vuxokoxoko bya wena."
  commands.TEXTS.forgotten: "Swi endliwile. ACE yi sule hinkwaswo leswi a yi ri na swona hi nomboro leyi."
  commands.TEXTS.stopped: "A wu nge he amukeli marungula ku suka eka ACE handle ka loko u tsala nakambe. Rhumela SULA ku sula vuxokoxoko bya wena."
  commands.TEXTS.language: "Hlamula hi RIRIMI na khodi:"
  commands.TEXTS.tip_thanks: "Inkomu. Xitsundzuxo xa wena xi hlayisiwile leswaku xi kamberiwa hi xitshembi. A xi nge avelaniwi xi nga si kamberiwa."
  commands.TEXTS.tip_usage: "Rhumela XITSUNDZUXO na xitsundzuxo xa wena, xik.: XITSUNDZUXO matluka ya neem ma pfuna eka xivungu xa mavele eLimpopo."
  commands.TEXTS.scam_usage: "Rhumela VUXISI na rungula leri u nga ri tshembiki, ACE yi ta ri kambela."
  commands.TEXTS.no_sources: "A ku na nhlamulo ya khale leyi xihlovo xa yona xi nga kombisiwaka. Vutisa xivutiso ku sungula."
  commands.TEXTS.no_more: "Hi swona hinkwaswo leswi ACE yi nga na swona hi mhaka leyi sweswi. Vutisa xivutiso xin'wana kumbe u rhumela PFUNO."
  commands.TEXTS.clarify: "ACE a yi si va na nkongomiso lowu kamberiweke hi leswo. ACE yi nga ku pfuna hi: {topics}. Rhumela XITSUNDZUXO ku engetela vutivi."
  commands.TEXTS.unread: "ACE a yi si kota ku hlaya ririmi leri. Hi kombela u tsala hi rin'wana ra lawa: {languages}."

