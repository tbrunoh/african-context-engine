  translations:
    sw:
      claim: 'Mpeleke mama mjamzito hospitalini au kituo cha afya mara moja akiwa na dalili yoyote kati ya hizi: kutokwa
        na damu ukeni, degedege, maumivu makali ya kichwa pamoja na kutoona vizuri, homa na udhaifu wa kushindwa kuamka
        kitandani, maumivu makali ya tumbo, au kupumua kwa haraka au kwa shida.'
      short: 'Nenda kituo cha afya SASA kwa: damu, degedege, kichwa kikali na kutoona vizuri, homa na udhaifu, tumbo
        kuuma sana.'
    fr:
      claim: 'Emmenez immédiatement une femme enceinte à l''hôpital ou au centre de santé si elle présente l''un de ces
        signes : saignements vaginaux, convulsions, maux de tête sévères avec vision trouble, fièvre avec une faiblesse
        qui l''empêche de se lever, douleurs abdominales sévères, ou respiration rapide ou difficile.'
      short: 'Centre de santé MAINTENANT si : saignements, convulsions, maux de tête et vision trouble, fièvre et grande
        faiblesse, fortes douleurs au ventre.'
  source: WHO, Counselling for maternal and newborn health care (NCBI Bookshelf NBK304178)
  source_url: https://www.ncbi.nlm.nih.gov/books/NBK304178/
