facts:
- id: national-emergency
  claim: 'There is no national emergency medical number in DR Congo: for a medical emergency, go to the nearest hospital.
    In Kinshasa, call 112 for the police and 118 for the fire service.'
  short: 'DR Congo has no national ambulance number: go to the nearest hospital. Kinshasa: police 112, fire 118.'
