  safety.EMERGENCY_WORD: "ivyihuta"
  safety.FALLBACK_NUMBERS: "Hamagara inomero y'ivyihuta y'aho uri canke uje ku bitaro biri hafi."

  commands.TEXTS.help: "ACE itanga impanuro z'aho uri zasuzumwe. Baza mu rurimi rwawe. Amabwirizwa: UBUHENDANYI + ubutumwa gusuzuma ubutumwa, IMPANURO + inama yawe gusangira ubumenyi, INKOMOKO, IBINDI, URURIMI + kode (akarorero URURIMI EN), FUTA guhanagura amakuru yawe."
  commands.TEXTS.help_short: "Baza ACE mu rurimi rwawe. UBUHENDANYI + ubutumwa buzobusuzuma. FUTA ihanagura amakuru yawe."
  commands.TEXTS.forgotten: "Vyakozwe. ACE yahanaguye ivyo yari ifise vyose kuri iyi nomero."
  commands.TEXTS.stopped: "Ntuzosubira kwakira ubutumwa bwa ACE kiretse wanditse kandi. Rungika FUTA guhanagura amakuru yawe."
  commands.TEXTS.language: "Ishura URURIMI na kode:"
  commands.TEXTS.tip_thanks: "Urakoze. Inama yawe yabitswe kugira ngo umuhinga ayisuzume. Ntizosangirwa itarasuzumwa."
  commands.TEXTS.tip_usage: "Rungika IMPANURO n'inama yawe, akarorero: IMPANURO amababi ya neem afasha kurwanya inkongwa mu Ngozi."
  commands.TEXTS.scam_usage: "Rungika UBUHENDANYI n'ubutumwa utizigiye, ACE izobusuzuma."
  commands.TEXTS.no_sources: "Nta nyishu ya mbere yerekanwa aho yavuye. Banza ubaze ikibazo."
  commands.TEXTS.no_more: "Ivyo ni vyo vyose ACE ifise kuri iyi ngingo ubu. Baza ikindi kibazo canke urungike UBUFASHA."
  commands.TEXTS.clarify: "ACE ntiragira impanuro zasuzumwe kuri ivyo. ACE irashobora kugufasha kuri: {topics}. Rungika IMPANURO wongereko ubumenyi."
  commands.TEXTS.unread: "ACE ntirashobora gusoma uru rurimi. Turagusavye wandike mu rumwe muri izi: {languages}."

