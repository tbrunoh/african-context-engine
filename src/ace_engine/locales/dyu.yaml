  commands.TEXTS.help: "ACE bɛ ladili di minnu sɛgɛsɛgɛra i ka mara kan. Ɲininkali kɛ i ka kan na. Cikanw: NAMARA + cikan ka a sɛgɛsɛgɛ, LADILI + i ka ladili ka dɔnniya tila, BƆYƆRƆ, WƐRƐW, KAN + kodi (iko KAN EN), JƆSI ka i ka kunnafoniw jɔsi."
