# Danger signs in pregnancy and after birth, from WHO guidance. Applies in every covered country.
# Every fact is safety critical. ACE adds the caller's own national numbers through refer_queue.
# Next step: review by a midwife or obstetrician in each country, and review of the French text.
spec_version: '1.0'
id: africa-maternal-danger-signs
title: Danger signs in pregnancy and after birth
description: The signs that mean a pregnant woman or new mother needs care now. ACE does not diagnose. It tells people
  when to go to a facility and how to get there.
version: 1.2.0
order: 3
