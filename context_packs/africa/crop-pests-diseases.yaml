- id: cmd-signs
  claim: Cassava mosaic disease shows as curled leaves with yellow green or white green patches. In bad cases new leaves
    are small and twisted and the plant is stunted. Leaves that are evenly yellow or brown point to a different problem.
    Whiteflies spread the disease from plant to plant.
  short: 'Cassava mosaic signs: curled leaves with yellow green patches; small, twisted new leaves; stunted plants.
    Whiteflies spread it.'
  topic: crop_disease
  vertical: agriculture
  kind: sign
  subjects:
  - cassava
  keywords: [cassava, mosaic, curled, patches, twisted, whitefly, muhogo, mihogo, majani, manioc, mosaique, feuilles,
             mandioca, mosaico, كسافا, فسيفساء, ካሳቫ, ሞዛይክ, kaasaavaa, mosaayikii, kasaafo, kasaafada, moosayg]
  translations:
    sw:
      claim: Ugonjwa wa batobato wa muhogo huonekana kama majani yaliyojikunja yenye mabaka ya njano na kijani au meupe na
        kijani. Ukizidi, majani mapya huwa madogo na yaliyopinda na mmea hudumaa. Majani ya njano tupu au ya kahawia ni
        tatizo jingine. Inzi weupe hueneza ugonjwa huu.
      short: 'Batobato ya muhogo: majani yaliyojikunja yenye mabaka ya njano na kijani; majani mapya madogo na yaliyopinda;
        mmea kudumaa.'
    fr:
      claim: La mosaïque du manioc se voit à des feuilles enroulées avec des taches jaune vert ou blanc vert. Dans les cas
        graves, les nouvelles feuilles sont petites et déformées et la plante reste chétive. Des feuilles uniformément
        jaunes ou brunes signalent un autre problème. Les aleurodes (mouches blanches) propagent la maladie.
      short: 'Mosaïque du manioc : feuilles enroulées avec taches jaune vert, jeunes feuilles petites et déformées, plante
        chétive.'
    pt:
      claim: 'A doença do mosaico da mandioca aparece como folhas enroladas com manchas verde-amareladas ou verde-esbranquiçadas. Nos casos graves as folhas novas são pequenas e torcidas e a planta fica raquítica. Folhas uniformemente amarelas ou castanhas indicam outro problema. A mosca-branca espalha a doença de planta para planta.'
      short: 'Sinais do mosaico da mandioca: folhas enroladas com manchas verde-amareladas; folhas novas pequenas e torcidas; plantas raquíticas. A mosca-branca espalha-o.'
      reviewed: false
    ar:
      claim: 'يظهر مرض فسيفساء الكسافا على شكل أوراق ملتفة فيها بقع خضراء مصفرة أو خضراء مبيضة. في الحالات الشديدة تكون الأوراق الجديدة صغيرة وملتوية ويتقزم النبات. أما الأوراق الصفراء أو البنية بالتساوي فتدل على مشكلة أخرى. ينشر الذباب الأبيض المرض من نبتة إلى أخرى.'
      short: 'علامات فسيفساء الكسافا: أوراق ملتفة ببقع خضراء مصفرة، أوراق جديدة صغيرة ملتوية، نباتات متقزمة. ينشره الذباب الأبيض.'
      reviewed: false
    am:
      claim: 'የካሳቫ ሞዛይክ በሽታ ቢጫ አረንጓዴ ወይም ነጭ አረንጓዴ ነጠብጣብ ያላቸው የተጠቀለሉ ቅጠሎች ሆኖ ይታያል። በከፋ ሁኔታ አዲስ ቅጠሎች ትንሽ እና የተጣመሙ ይሆናሉ፣ ተክሉም ይቀነጭራል። ሙሉ በሙሉ ቢጫ ወይም ቡናማ የሆኑ ቅጠሎች ሌላ ችግርን ያመለክታሉ። ነጭ ዝንቦች በሽታውን ከተክል ወደ ተክል ያስተላልፋሉ።'
      short: 'የካሳቫ ሞዛይክ ምልክቶች፡ ቢጫ አረንጓዴ ነጠብጣብ ያላቸው የተጠቀለሉ ቅጠሎች፤ ትንሽ የተጣመሙ አዲስ ቅጠሎች፤ የቀነጨረ ተክል። ነጭ ዝንቦች ያስተላልፉታል።'
      reviewed: false
    om:
      claim: 'Dhukkubni mosaayikii kaasaavaa baala maramaa tuqaa magariisa keelloo ykn magariisa adii qabu ta''ee mul''ata. Yeroo hamaa baalli haaraan xiqqaa fi micciirama, biqiltuunis ni gabaabbata. Baalli guutuun isaa keelloo ykn magaala ta''e rakkoo biraa agarsiisa. Titiisni adiin dhukkuba kana biqiltuu tokko irraa gara biraatti daddabarsa.'
      short: 'Mallattoo mosaayikii kaasaavaa: baala maramaa tuqaa magariisa keelloo qabu; baala haaraa xiqqaa micciirame; biqiltuu gabaabbate. Titiisni adiin ni daddabarsa.'
      reviewed: false
    so:
      claim: 'Cudurka moosaygga kasaafada wuxuu u muuqdaa caleemo duuban oo leh dhibco cagaar huruud ah ama cagaar caddaan ah. Xaaladaha daran caleemaha cusub waa yar yihiin oo qalloocan, geedkuna wuu gaabnaadaa. Caleemaha si siman u huruud ah ama u bunni ah waxay tilmaamaan dhibaato kale. Duqsiga cad ayaa cudurka ka gudbiya geed ilaa geed.'
      short: 'Calaamadaha moosaygga kasaafada: caleemo duuban oo dhibco cagaar huruud leh; caleemo cusub oo yar oo qalloocan; geed gaaban. Duqsiga cad ayaa faafiya.'
      reviewed: false
    ti:
      claim: 'ሕማም ሞዛይክ ካሳቫ ቀጠልያን ብጫን ወይ ቀጠልያን ጻዕዳን ነጠብጣባት ዘለዎ ዝተጠውየ ቆጽሊ የርኢ። ኣዝዩ ምስ ዝብኢስ፣ ሓደስቲ ቆጽሊ ንኣሽቱን ዝተጠውዩን ይኾኑ፣ ተኽሊ ድማ ጽቡቕ ኣይዓቢን። ብሙሉኡ ብጫ ወይ ቡናዊ ዝኾነ ቆጽሊ ካልእ ጸገም የመልክት። ጻዕዳ ጻንጸያ (whiteflies) ነቲ ሕማም ካብ ሓደ ተኽሊ ናብ ካልእ የስፋሕፍሕዎ።'
      short: 'ምልክታት ሞዛይክ ካሳቫ: ቀጠልያን ብጫን ነጠብጣባት ዘለዎ ዝተጠውየ ቆጽሊ፤ ንኣሽቱ ሓደስቲ ቆጽሊ፤ ዘይዓቢ ተኽሊ። ጻዕዳ ጻንጸያ የስፋሕፍሖ።'
      reviewed: false
    fuf:
      claim: 'Ñawu mosayik bantara ina holla haakoo ɓilliiɗo jogiiɗo tobbe haakeeje e oolɗe walla haakeeje e daneeje. Si ɗum tiiɗii, haakoo kesoo ina tokoosi ina ɓillii, lekki oo mawnataa no moƴƴi. Haakoo oolo walla ɓoɗeejo kala ɗo ina holla caɗeele goɗɗe. Ɓuuɓi daneeji (whiteflies) ina saaka ñawu oo iwde e lekki gooto haa goɗɗo.'
      short: 'Maandeeji mosayik bantara: haakoo ɓilliiɗo jogiiɗo tobbe haakeeje e oolɗe; haakoo kesoo tokooso; lekki mo mawnataa. Ɓuuɓi daneeji ina saaka ɗum.'
      reviewed: false
    mos:
      claim: 'Maniok mozayik bãag wilgda vãad sẽn gilgame la vers ne miuug bi vers ne peelg bãnd be b zugu. A sã n wa yaa toogo, vãad-paalã yaa bilf la b gilgame, la koodã pa yãkd sõma ye. Vãad sẽn yaa miuug bi zẽe zĩig fãa wilgda yel-beed a to. Zĩinsa peelse (whiteflies) yaoodame bãagã n yi kood a ye n kẽng a to zugu.'
      short: 'Maniok mozayik bãnde: vãad sẽn gilgame la vers ne miuug bãnd be b zugu; vãad-paal bilfu; kood sẽn pa yãkd ye. Zĩinsa peelse n yaood-a.'
      reviewed: false
    dyu:
      claim: 'Bananku mosayiki bana bɛ furaw jira minnu kurunna ani binkɛnɛman ni nɛrɛmuguman walima binkɛnɛman ni jɛman tomiw bɛ u la. Ni a gɛlɛyara, fura kuraw ka dɔgɔ ka kurun, sɛnɛfɛn tɛ bonya ka ɲɛ. Furaw minnu bɛɛ nɛrɛmuguman don walima wulennin don, olu bɛ gɛlɛya wɛrɛ jira. Dimɔgɔ jɛmanw (whiteflies) bɛ bana jɛnsɛn ka bɔ sɛnɛfɛn kelen na ka taa dɔ wɛrɛ la.'
      short: 'Bananku mosayiki taamashiyɛnw: furaw kurunnenw binkɛnɛman ni nɛrɛmuguman tomiw bɛ minnu na; fura kura fitininw; sɛnɛfɛn min tɛ bonya. Dimɔgɔ jɛmanw b''a jɛnsɛn.'
      reviewed: false
    wo:
      claim: 'Feebaru mosayik bu ñambi dafay wone xob yu ñaxñaxu yu am tomb yu wert ak mboq walla wert ak weex. Bu metti lool, xob yu bees yi dañuy ndaw te ñaxñaxu, te gàncax gi du màgg bu baax. Xob yu mboq walla yu ruus fépp dafay wone beneen jafe-jafe. Wànk yu weex (whiteflies) ñooy wasaare feebar bi jóge ci gàncax ba ci beneen.'
      short: 'Màndargay mosayik bu ñambi: xob yu ñaxñaxu yu am tomb yu wert ak mboq; xob yu bees yu ndaw; gàncax gu dul màgg. Wànk yu weex ñoo koy wasaare.'
      reviewed: false
    ee:
      claim: 'Agbeli ƒe mosaic dɔlélé ɖea aŋgba siwo gɔ̃ eye gbemumu kple dzẽ alo gbemumu kple ɣi ƒe dzesiwo le wo dzi fiana. Ne evɔ̃ ŋutɔ la, aŋgba yeyewo le sue eye wogɔ̃, eye nukuku la mekpɔa nyuie o. Aŋgba siwo katã nye dzẽ alo kɔ fiaa kuxi bubu. Ʋuʋudedi ɣiwo (whiteflies) kakaa dɔlélé la tso nukuku ɖeka dzi yi bubu dzi.'
      short: 'Agbeli ƒe mosaic ƒe dzesiwo: aŋgba siwo gɔ̃ eye gbemumu kple dzẽ ƒe dzesiwo le wo dzi; aŋgba yeye suewo; nukuku si mekpɔ o. Ʋuʋudedi ɣiwo kakaa.'
      reviewed: false
    ak:
      claim: 'Bankye mosaic yare da nhaban a akyea a ahabammono ne akokɔsrades anaa ahabammono ne fitaa nsɛnkyerɛnne wɔ so adi. Sɛ ɛyɛ den a, nhaban foforo no yɛ nketewa na akyea, na afifide no nnyin yiye. Nhaban a ɛyɛ akokɔsrades anaa dodowa wɔ baabiara kyerɛ ɔhaw foforo. Nwansena fitaa (whiteflies) trɛw yare no fi afifide baako so kɔ foforo so.'
      short: 'Bankye mosaic nsɛnkyerɛnne: nhaban a akyea a ahabammono ne akokɔsrades nsɛnkyerɛnne wɔ so; nhaban foforo nketewa; afifide a ennyin. Nwansena fitaa trɛw no.'
      reviewed: false
    ln:
      claim: 'Bokono ya mosaique ya mwanza emonisaka nkasa oyo egumbami na matono ya langi ya matiti mpe ya mosaka to ya matiti mpe ya pembe. Soki ebebi mingi, nkasa ya sika ezalaka moke mpe egumbami, mpe bilona ekolaka malamu te. Nkasa ya mosaka to ya langi ya mabele bisika nyonso elakisaka mokakatano mosusu. Banzinzi ya pembe (whiteflies) epalanganisaka bokono longwa na bilona moko tii na mosusu.'
      short: 'Bilembo ya mosaique ya mwanza: nkasa egumbami na matono ya matiti mpe ya mosaka; nkasa ya sika moke; bilona ekolaka te. Banzinzi ya pembe epalanganisaka yango.'
      reviewed: false
    lg:
      claim: 'Obulwadde bwa mosaic obwa muwogo bulaga ebikoola ebyekyusizza ebirina amabala aga kiragala ne kyenvu oba aga kiragala n''ejjeru. Bwe kiba kibi nnyo, ebikoola ebipya biba bitono era byekyusizza, era ekirime tekikula bulungi. Ebikoola ebya kyenvu oba kitaka wonna biraga obuzibu obulala. Ensowera enjeru (whiteflies) zisaasaanya obulwadde okuva ku kirime ekimu okudda ku kirala.'
      short: 'Mosaic ya muwogo: ebikoola ebyekyusizza ebirina amabala aga kiragala ne kyenvu; ebikoola ebipya ebitono; ekirime ekitakula. Ensowera enjeru zibusaasaanya.'
      reviewed: false
    rn:
      claim: 'Indwara ya mozayike y''imyumbati igaragaza amababi agoramye afise amabara y''icatsi n''umuhondo canke icatsi n''umweru. Iyo bikabije, amababi mashasha aba mato kandi agoramye, kandi ikimera ntigikura neza. Amababi y''umuhondo canke ikigina hose agaragaza iyindi ngorane. Isazi z''umweru (whiteflies) zikwiragiza indwara ziva ku kimera kimwe zija ku kindi.'
      short: 'Ibimenyetso vya mozayike y''imyumbati: amababi agoramye afise amabara y''icatsi n''umuhondo; amababi mashasha mato; ikimera kidakura. Isazi z''umweru ziyikwiragiza.'
      reviewed: false
    rw:
      claim: 'Indwara ya kabore y''imyumbati igaragaza amababi agoramye afite amabara y''icyatsi n''umuhondo cyangwa icyatsi n''umweru. Iyo bikabije, amababi mashya aba mato kandi agoramye, kandi igihingwa ntigikura neza. Amababi y''umuhondo cyangwa ikigina hose agaragaza ikindi kibazo. Isazi z''umweru (whiteflies) zikwirakwiza indwara ziva ku gihingwa kimwe zijya ku kindi.'
      short: 'Ibimenyetso bya kabore y''imyumbati: amababi agoramye afite amabara y''icyatsi n''umuhondo; amababi mashya mato; igihingwa kidakura. Isazi z''umweru ziyikwirakwiza.'
      reviewed: false
    bem:
      claim: 'Ubulwele bwa mosaic ubwa tute bulalanga amabula ayapombana ayali no tubala twa cimbala na kashikila nangu twa cimbala na buuta. Nga cabipa sana, amabula ayapya yaba ayanono kabili ayapombana, kabili icilimwa tacilakula bwino. Amabula ayakashikila nangu aya bulauni konse yalalanga ubwafya bumbi. Ifipelebesha ifyabuuta (whiteflies) filasalanganya ubulwele ukufuma ku cilimwa cimo ukuya ku cimbi.'
      short: 'Ifishibilo fya mosaic ya tute: amabula ayapombana aya tubala twa cimbala na kashikila; amabula ayapya ayanono; icilimwa icishilekula. Ifipelebesha filabutwala.'
      reviewed: false
    ny:
      claim: 'Matenda a mosaic a chinangwa amaonetsa masamba opotoka ali ndi mawanga obiriwira ndi achikasu kapena obiriwira ndi oyera. Ngati zaipa kwambiri, masamba atsopano ndi aang''ono komanso opotoka, ndipo mbewu sikula bwino. Masamba achikasu kapena a bulauni ponseponse amaonetsa vuto lina. Ntchentche zoyera (whiteflies) zimafalitsa matendawa kuchokera ku mbewu ina kupita ku ina.'
      short: 'Zizindikiro za mosaic ya chinangwa: masamba opotoka a mawanga obiriwira ndi achikasu; masamba atsopano aang''ono; mbewu yosakula. Ntchentche zimawafalitsa.'
      reviewed: false
    sn:
      claim: 'Chirwere chemosaic chemufarinya chinoratidza mashizha akamonyana ane mavara egirinhi neyero kana egirinhi nechena. Kana zvakaipisisa, mashizha matsva madiki uye akamonyana, uye chirimwa hachikure zvakanaka. Mashizha ari yero kana bhurauni kwese anoratidza rimwe dambudziko. Nhunzi chena (whiteflies) dzinoparadzira chirwere kubva pachirimwa chimwe kuenda kune chimwe.'
      short: 'Zviratidzo zvemosaic yemufarinya: mashizha akamonyana ane mavara egirinhi neyero; mashizha matsva madiki; chirimwa chisingakure. Nhunzi chena dzinochiparadzira.'
      reviewed: false
    ts:
      claim: 'Vuvabyi bya mosaic bya mufaki byi kombisa matluka lama khunjekeke ma ri na swivati swa rihlaza na swo tshopana kumbe swa rihlaza na swo basa. Loko swi bihile ngopfu, matluka lamantshwa ma ntsongo naswona ma khunjekile, naswona ximila a xi kuli kahle. Matluka lama tshopanaka kumbe ya buraweni hinkwawo ma kombisa xiphiqo xin''wana. Tinhunguvana to basa (whiteflies) ti hangalasa vuvabyi ku suka eka ximila xin''wana ku ya eka xin''wana.'
      short: 'Mosaic ya mufaki: matluka lama khunjekeke ya swivati swa rihlaza na swo tshopana; matluka lamantshwa lamatsongo; ximila lexi nga kuliki.'
      reviewed: false
    tn:
      claim: 'Bolwetse jwa mosaic jwa kasava bo bontsha matlhare a a sotegileng a a nang le matheba a matala le a serolwana kgotsa a matala le a masweu. Fa go le maswe thata, matlhare a masha a mannye mme a sotegile, mme semela ga se gole sentle. Matlhare a a serolwana kgotsa a a borokwa gotlhe a supa bothata jo bongwe. Dintsi tse ditshweu (whiteflies) di anamisa bolwetse go tswa mo semeleng sengwe go ya go se sengwe.'
      short: 'Mosaic ya kasava: matlhare a a sotegileng a matheba a matala le a serolwana; matlhare a masha a mannye; semela se se sa goleng. Dintsi di a bo anamisa.'
      reviewed: false
    st:
      claim: 'Lefu la mosaic la kasava le bontsha makgasi a sothehileng a nang le matheba a matala le a mosehla kapa a matala le a masweu. Ha ho le hobe haholo, makgasi a matjha a manyane mme a sothehile, mme semela ha se hole hantle. Makgasi a mosehla kapa a sootho hohle a bontsha bothata bo bong. Dintsintsi tse tshweu (whiteflies) di hasanya lefu ho tloha semeleng se seng ho ya ho se seng.'
      short: 'Matshwao a mosaic ya kasava: makgasi a sothehileng a matheba a matala le a mosehla; makgasi a matjha a manyane; semela se sa holeng. Dintsintsi di a le hasanya.'
