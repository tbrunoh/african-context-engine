    ti:
      claim: 'ዝተጠቕዐ ፍረ ኮምደረ ቀልጢፍካ ኣልግሶን ኣጥፍኦን፣ እዚ ባልዕ ዝነብረሉ ካልኦት ኣትኽልቲ ኣብ ከባቢ ግራት ድማ ኣልግስ። መጻወዲ pheromone ነቶም ዝነፍሩ ባልዕ ይሕዝ፣ ካብ ኒም ወይ Bacillus thuringiensis ዝተሰርሑ ፍርያት ድማ ክሕግዙ ይኽእሉ። ልሙድ ምንጻግ መብዛሕትኡ ግዜ ኣይሰርሕን ምኽንያቱ ሓሰኻ ኣብ ውሽጢ ቆጽሊ ስለ ዝበልዑን ባልዕ ቀልጢፉ ንመድሃኒት ስለ ዝጻወሮን፣ ስለዚ ቅድሚ ምንጻግካ ክኢላ ሕርሻ ሕተት።'
      short: 'ሓሰኻ ኮምደረ: ዝተጠቕዐ ፍረ ኣጥፍእ፣ መጻወዲ pheromone፣ ኒም ወይ Bt ተጠቐም፤ ቅድሚ ምንጻግካ ክኢላ ሕርሻ ሕተት።'
